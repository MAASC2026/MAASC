<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Student Examination Timetable</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
    color:#222;
}

/* ================= HEADER ================= */

.header{
    background:#1f3c88;
    color:white;
    padding:25px 20px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header h1{
    font-size:28px;
    margin-bottom:7px;
}

.header p{
    font-size:14px;
    opacity:.9;
}

/* ================= CONTAINER ================= */

.container{
    width:95%;
    max-width:1450px;
    margin:25px auto;
}

/* ================= STUDENT CARD ================= */

.student-card{
    background:white;
    border-radius:12px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.student-card h2{
    color:#1f3c88;
    margin-bottom:18px;
    font-size:20px;
}

.student-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.info-box{
    background:#f8f9fc;
    border:1px solid #ddd;
    border-radius:8px;
    padding:14px;
}

.info-box span{
    display:block;
    font-size:11px;
    color:#777;
    margin-bottom:6px;
}

.info-box strong{
    font-size:14px;
    color:#222;
}

/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    border-radius:10px;
    padding:20px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.stat h3{
    font-size:29px;
    color:#1f3c88;
    margin-bottom:6px;
}

.stat p{
    font-size:13px;
    color:#666;
}

/* ================= LOADING ================= */

.loading-card{
    background:white;
    border-radius:12px;
    padding:55px 20px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.spinner{
    width:45px;
    height:45px;
    border:4px solid #ddd;
    border-top:4px solid #1f3c88;
    border-radius:50%;
    margin:0 auto 18px;
    animation:spin 1s linear infinite;
}

@keyframes spin{

    100%{
        transform:rotate(360deg);
    }

}

/* ================= NO TIMETABLE ================= */

.no-timetable{
    background:white;
    border-radius:12px;
    padding:50px 25px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.no-timetable h2{
    color:#1f3c88;
    margin-bottom:12px;
}

.no-timetable p{
    color:#666;
    line-height:1.7;
}

/* ================= ERROR ================= */

.error-card{
    background:white;
    border-left:5px solid #dc3545;
    border-radius:8px;
    padding:22px;
    color:#842029;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.error-card h2{
    margin-bottom:10px;
}

/* ================= EXAM CARD ================= */

.exam-card{
    background:white;
    border-radius:12px;
    margin-bottom:25px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

/* ================= EXAM HEADER ================= */

.exam-header{
    background:#1f3c88;
    color:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.exam-header h2{
    font-size:21px;
}

.published{
    background:#198754;
    color:white;
    padding:7px 13px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

/* ================= EXAM BODY ================= */

.exam-body{
    padding:20px;
}

.exam-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
    margin-bottom:20px;
}

.exam-info-box{
    background:#f8f9fc;
    border:1px solid #ddd;
    border-radius:8px;
    padding:13px;
}

.exam-info-box span{
    display:block;
    font-size:11px;
    color:#777;
    margin-bottom:5px;
}

.exam-info-box strong{
    font-size:14px;
}

/* ================= TABLE ================= */

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1000px;
    border-collapse:collapse;
}

thead th{
    background:#1f3c88;
    color:white;
    padding:13px 12px;
    text-align:left;
    font-size:13px;
    white-space:nowrap;
}

tbody td{
    padding:13px 12px;
    border-bottom:1px solid #eee;
    font-size:13px;
    vertical-align:top;
}

tbody tr:hover td{
    background:#f8f9fc;
}

.subject-name{
    font-weight:bold;
    color:#1f3c88;
}

.portion{
    max-width:350px;
    white-space:pre-wrap;
    line-height:1.5;
}

.session{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    background:#e8f1ff;
    color:#174ea6;
    font-weight:bold;
    font-size:11px;
}

.time{
    white-space:nowrap;
    font-weight:bold;
}

/* ================= MOBILE ================= */

@media(max-width:1000px){

    .student-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .exam-info{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .container{
        width:94%;
    }

    .header h1{
        font-size:22px;
    }

    .student-grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .exam-info{
        grid-template-columns:1fr;
    }

    .exam-header{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>

</head>

<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAIv3091VM-gkmdwEAn7OhXWd9Cm2zh2bo",

    authDomain:
        "maasc-2026.firebaseapp.com",

    projectId:
        "maasc-2026",

    storageBucket:
        "maasc-2026.appspot.com",

    messagingSenderId:
        "585813001586",

    appId:
        "1:585813001586:web:664e0e90ff"

};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(app);


const COLLECTION_NAME =
    "examTimetable";


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadStudentExam();

    }
);


/* =====================================================
   MAIN FUNCTION
===================================================== */

async function loadStudentExam(){

    try{

        console.log(
            "================================"
        );

        console.log(
            "STUDENT EXAM TIMETABLE"
        );

        console.log(
            "================================"
        );


        /* =============================================
           GET STUDENT DOCUMENT ID
        ============================================= */

        const studentId =
            getStudentDocumentId();


        console.log(
            "STUDENT DOCUMENT ID:",
            studentId
        );


        if(!studentId){

            showError(

                "Student Login Not Found",

                "Student document ID was not found. Please login again."

            );

            return;

        }


        /* =============================================
           GET STUDENT DOCUMENT
        ============================================= */

        const student =
            await getStudentFromFirestore(
                studentId
            );


        if(!student){

            showError(

                "Student Record Not Found",

                "Your student record could not be found."

            );

            return;

        }


        console.log(
            "STUDENT FIRESTORE DATA:",
            student
        );


        /* =============================================
           DISPLAY STUDENT
        ============================================= */

        displayStudent(
            student
        );


        /* =============================================
           NORMALIZE DEPARTMENT
        ============================================= */

        const department =
            normalize(
                student.department
            );


        /* =============================================
           NORMALIZE YEAR
        ============================================= */

        const year =
            normalizeYear(
                student.year
            );


        console.log(
            "STUDENT DEPARTMENT:",
            department
        );


        console.log(
            "STUDENT YEAR:",
            year
        );


        if(!department){

            showError(

                "Department Not Found",

                "Department is missing from your student record."

            );

            return;

        }


        if(!year){

            showError(

                "Year Not Found",

                "Year is missing from your student record."

            );

            return;

        }


        /* =============================================
           LOAD EXAM
        ============================================= */

        await loadExamTimetable(
            department,
            year
        );

    }

    catch(error){

        console.error(
            "STUDENT EXAM ERROR:",
            error
        );


        showError(

            "Unable to Load Examination Timetable",

            error.message

        );

    }

}


/* =====================================================
   GET STUDENT ID
===================================================== */

function getStudentDocumentId(){

    const localStorageKeys = [

        "studentId",

        "studentDocId",

        "loggedInStudentId",

        "studentDocumentId"

    ];


    for(
        const key of localStorageKeys
    ){

        const value =
            localStorage.getItem(
                key
            );


        if(
            value &&
            value.trim()
        ){

            console.log(
                "STUDENT ID FROM LOCAL STORAGE:",
                key
            );

            return value.trim();

        }

    }


    const sessionStorageKeys = [

        "studentId",

        "studentDocId",

        "loggedInStudentId",

        "studentDocumentId"

    ];


    for(
        const key of sessionStorageKeys
    ){

        const value =
            sessionStorage.getItem(
                key
            );


        if(
            value &&
            value.trim()
        ){

            console.log(
                "STUDENT ID FROM SESSION STORAGE:",
                key
            );

            return value.trim();

        }

    }


    return "";

}


/* =====================================================
   GET STUDENT FROM FIRESTORE
===================================================== */

async function getStudentFromFirestore(
    studentId
){

    console.log(
        "READING STUDENT:",
        "students/" + studentId
    );


    const studentRef =
        doc(
            db,
            "students",
            studentId
        );


    const studentSnap =
        await getDoc(
            studentRef
        );


    if(
        !studentSnap.exists()
    ){

        console.error(
            "STUDENT DOCUMENT DOES NOT EXIST:",
            studentId
        );

        return null;

    }


    const data =
        studentSnap.data();


    return {

        id:
            studentSnap.id,

        name:
            data.name ||
            data.Name ||
            data.studentName ||
            data.StudentName ||
            "",

        registerNumber:
            data.registerNumber ||
            data.registerNo ||
            data.regNo ||
            data.RegisterNumber ||
            data.RegisterNo ||
            data.rollNo ||
            data.rollNumber ||
            "",

        department:
            data.department ||
            data.Department ||
            "",

        year:
            data.year ||
            data.Year ||
            "",

        section:
            data.section ||
            data.Section ||
            ""

    };

}


/* =====================================================
   DISPLAY STUDENT
===================================================== */

function displayStudent(
    student
){

    document.getElementById(
        "studentName"
    ).textContent =
        student.name || "-";


    document.getElementById(
        "registerNumber"
    ).textContent =
        student.registerNumber || "-";


    document.getElementById(
        "department"
    ).textContent =
        student.department || "-";


    document.getElementById(
        "year"
    ).textContent =
        student.year || "-";


    document.getElementById(
        "studentCard"
    ).style.display =
        "block";

}


/* =====================================================
   LOAD EXAM TIMETABLE
===================================================== */

async function loadExamTimetable(
    department,
    year
){

    console.log(
        "SEARCHING EXAM TIMETABLE..."
    );


    console.log(
        "MATCH DEPARTMENT:",
        department
    );


    console.log(
        "MATCH YEAR:",
        year
    );


    const snapshot =
        await getDocs(

            collection(
                db,
                COLLECTION_NAME
            )

        );


    const matchingTimetables = [];


    snapshot.forEach(
        item => {

            const data =
                item.data();


            const dbDepartment =
                normalize(
                    data.department
                );


            const dbYear =
                normalizeYear(
                    data.year
                );


            console.log(
                "CHECK TIMETABLE:",
                item.id,
                data.examType,
                dbDepartment,
                dbYear,
                "ALL SECTIONS:",
                data.allSections,
                "STATUS:",
                data.status,
                "COMPLETED:",
                data.completed
            );


            /*
             * IMPORTANT
             *
             * NO SECTION MATCHING.
             *
             * Student timetable is based on:
             *
             * DEPARTMENT + YEAR
             *
             */


            if(

                dbDepartment ===
                department

                &&

                dbYear ===
                year

            ){

                matchingTimetables.push({

                    id:
                        item.id,

                    ...data

                });

            }

        }
    );


    console.log(
        "MATCHING TIMETABLES:",
        matchingTimetables
    );


    hideLoading();


    /* =================================================
       NO MATCH
    ================================================= */

    if(
        matchingTimetables.length === 0
    ){

        showNoTimetable(

            "No Examination Timetable",

            `No examination timetable has been created for ${department} - ${year}.`

        );

        return;

    }


    /* =================================================
       FILTER PUBLISHED
    ================================================= */

    const published =
        matchingTimetables.filter(
            item => {

                /*
                 * NEW SYSTEM
                 */

                if(
                    item.completed === true
                ){

                    return true;

                }


                if(
                    String(
                        item.status || ""
                    )
                    .trim()
                    .toLowerCase()
                    ===
                    "completed"
                ){

                    return true;

                }


                /*
                 * SUPPORT OTHER POSSIBLE
                 * COMPLETION VALUES
                 */

                if(
                    String(
                        item.status || ""
                    )
                    .trim()
                    .toLowerCase()
                    ===
                    "complete"
                ){

                    return true;

                }


                if(
                    String(
                        item.status || ""
                    )
                    .trim()
                    .toLowerCase()
                    ===
                    "published"
                ){

                    return true;

                }


                return false;

            }
        );


    console.log(
        "PUBLISHED TIMETABLES:",
        published
    );


    /* =================================================
       NOT PUBLISHED
    ================================================= */

    if(
        published.length === 0
    ){

        showNoTimetable(

            "Examination Timetable Not Published",

            `Your timetable for ${department} - ${year} has not been published yet.`

        );

        return;

    }


    /* =================================================
       DISPLAY
    ================================================= */

    renderExamTimetables(
        published
    );

}


/* =====================================================
   RENDER EXAM TIMETABLES
===================================================== */

function renderExamTimetables(
    timetables
){

    const container =
        document.getElementById(
            "examContent"
        );


    let totalSubjects =
        0;


    timetables.forEach(
        timetable => {

            if(
                Array.isArray(
                    timetable.subjects
                )
            ){

                totalSubjects +=
                    timetable.subjects.length;

            }

        }
    );


    document.getElementById(
        "examCount"
    ).textContent =
        timetables.length;


    document.getElementById(
        "subjectCount"
    ).textContent =
        totalSubjects;


    document.getElementById(
        "completedCount"
    ).textContent =
        timetables.length;


    document.getElementById(
        "stats"
    ).style.display =
        "grid";


    /*
     * SORT EXAMS
     */

    timetables.sort(
        (a,b) => {

            return getFirstDate(a)
                .localeCompare(
                    getFirstDate(b)
                );

        }
    );


    container.innerHTML = "";


    timetables.forEach(
        timetable => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "exam-card";


            let subjects =
                Array.isArray(
                    timetable.subjects
                )

                ?

                [...timetable.subjects]

                :

                [];


            /*
             * SORT SUBJECTS BY DATE/TIME
             */

            subjects.sort(
                (a,b) => {

                    const dateA =
                        String(
                            a.examDate || ""
                        );


                    const dateB =
                        String(
                            b.examDate || ""
                        );


                    if(
                        dateA !== dateB
                    ){

                        return dateA.localeCompare(
                            dateB
                        );

                    }


                    return String(
                        a.startTime || ""
                    )
                    .localeCompare(
                        String(
                            b.startTime || ""
                        )
                    );

                }
            );


            card.innerHTML = `

                <div class="exam-header">

                    <h2>

                        ${escapeHTML(
                            timetable.examType ||
                            "Examination"
                        )}

                    </h2>


                    <span class="published">

                        ✓ Published

                    </span>

                </div>


                <div class="exam-body">


                    <div class="exam-info">


                        <div class="exam-info-box">

                            <span>
                                Department
                            </span>

                            <strong>

                                ${escapeHTML(
                                    timetable.department ||
                                    "-"
                                )}

                            </strong>

                        </div>


                        <div class="exam-info-box">

                            <span>
                                Year
                            </span>

                            <strong>

                                ${escapeHTML(
                                    timetable.year ||
                                    "-"
                                )}

                            </strong>

                        </div>


                        <div class="exam-info-box">

                            <span>
                                Applicable To
                            </span>

                            <strong>
                                All Sections
                            </strong>

                        </div>


                    </div>


                    <div class="table-wrapper">

                        <table>

                            <thead>

                                <tr>

                                    <th>
                                        S.No
                                    </th>

                                    <th>
                                        Subject
                                    </th>

                                    <th>
                                        Subject Code
                                    </th>

                                    <th>
                                        Portion
                                    </th>

                                    <th>
                                        Exam Date
                                    </th>

                                    <th>
                                        Session
                                    </th>

                                    <th>
                                        Time
                                    </th>

                                </tr>

                            </thead>


                            <tbody>

                                ${renderSubjects(
                                    subjects
                                )}

                            </tbody>

                        </table>

                    </div>


                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   SUBJECT ROWS
===================================================== */

function renderSubjects(
    subjects
){

    if(
        !subjects.length
    ){

        return `

            <tr>

                <td
                    colspan="7"
                    style="
                        text-align:center;
                        padding:30px;
                    "
                >

                    No subjects available.

                </td>

            </tr>

        `;

    }


    return subjects
        .map(
            (subject,index) => `

                <tr>

                    <td>

                        ${index + 1}

                    </td>


                    <td>

                        <div class="subject-name">

                            ${escapeHTML(
                                subject.subjectName ||
                                "-"
                            )}

                        </div>

                    </td>


                    <td>

                        ${escapeHTML(
                            subject.subjectCode ||
                            "-"
                        )}

                    </td>


                    <td>

                        <div class="portion">

                            ${escapeHTML(
                                subject.portion ||
                                "-"
                            )}

                        </div>

                    </td>


                    <td>

                        <strong>

                            ${formatDate(
                                subject.examDate
                            )}

                        </strong>

                    </td>


                    <td>

                        <span class="session">

                            ${escapeHTML(
                                subject.session ||
                                "-"
                            )}

                        </span>

                    </td>


                    <td>

                        <span class="time">

                            ${formatTime(
                                subject.startTime
                            )}

                            -

                            ${formatTime(
                                subject.endTime
                            )}

                        </span>

                    </td>

                </tr>

            `
        )
        .join("");

}


/* =====================================================
   GET FIRST DATE
===================================================== */

function getFirstDate(
    timetable
){

    if(
        !Array.isArray(
            timetable.subjects
        )
    ){

        return "";

    }


    const dates =
        timetable.subjects
        .map(
            subject =>
                subject.examDate || ""
        )
        .filter(
            date =>
                date
        )
        .sort();


    return dates[0] || "";

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
    date
){

    if(!date){

        return "-";

    }


    /*
     * YYYY-MM-DD
     */

    if(
        /^\d{4}-\d{2}-\d{2}$/.test(
            date
        )
    ){

        const parts =
            date.split("-");


        return (
            parts[2] +
            "-" +
            parts[1] +
            "-" +
            parts[0]
        );

    }


    return date;

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(
    time
){

    if(!time){

        return "-";

    }


    /*
     * Already formatted
     */

    if(
        /AM|PM/i.test(time)
    ){

        return time;

    }


    const parts =
        time.split(":");


    if(
        parts.length < 2
    ){

        return time;

    }


    let hour =
        parseInt(
            parts[0],
            10
        );


    const minute =
        parts[1];


    if(
        Number.isNaN(hour)
    ){

        return time;

    }


    const ampm =
        hour >= 12
        ?
        "PM"
        :
        "AM";


    hour =
        hour % 12 ||
        12;


    return (
        hour +
        ":" +
        minute +
        " " +
        ampm
    );

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalize(
    value
){

    return String(
        value || ""
    )
    .trim()
    .replace(
        /\s+/g,
        " "
    )
    .toUpperCase();

}


/* =====================================================
   NORMALIZE YEAR
===================================================== */

function normalizeYear(
    value
){

    const text =
        String(
            value || ""
        )
        .trim()
        .toUpperCase()
        .replace(
            /\s+/g,
            " "
        );


    if(

        text === "1" ||
        text === "I" ||
        text === "I YEAR" ||
        text === "1 YEAR"

    ){

        return "I YEAR";

    }


    if(

        text === "2" ||
        text === "II" ||
        text === "II YEAR" ||
        text === "2 YEAR"

    ){

        return "II YEAR";

    }


    if(

        text === "3" ||
        text === "III" ||
        text === "III YEAR" ||
        text === "3 YEAR"

    ){

        return "III YEAR";

    }


    return text;

}


/* =====================================================
   HIDE LOADING
===================================================== */

function hideLoading(){

    document.getElementById(
        "loading"
    ).style.display =
        "none";

}


/* =====================================================
   SHOW NO TIMETABLE
===================================================== */

function showNoTimetable(
    title,
    message
){

    document.getElementById(
        "stats"
    ).style.display =
        "none";


    document.getElementById(
        "examContent"
    ).innerHTML = `

        <div class="no-timetable">

            <h2>

                ${escapeHTML(
                    title
                )}

            </h2>

            <p>

                ${escapeHTML(
                    message
                )}

            </p>

        </div>

    `;

}


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(
    title,
    message
){

    hideLoading();


    document.getElementById(
        "stats"
    ).style.display =
        "none";


    document.getElementById(
        "examContent"
    ).innerHTML = `

        <div class="error-card">

            <h2>

                ${escapeHTML(
                    title
                )}

            </h2>

            <p>

                ${escapeHTML(
                    message
                )}

            </p>

        </div>

    `;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}
