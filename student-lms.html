<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student LMS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#1f2937;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    height:70px;
    background:#ffffff;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:100;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:12px;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
}

.logo-text h2{
    font-size:18px;
}

.logo-text p{
    font-size:12px;
    color:#6b7280;
    margin-top:2px;
}

.student-info{
    text-align:right;
}

.student-name{
    font-weight:bold;
    font-size:14px;
}

.student-register{
    color:#6b7280;
    font-size:12px;
    margin-top:3px;
}

/* =========================
   PAGE
========================= */

.container{
    max-width:1250px;
    margin:auto;
    padding:25px;
}

.welcome{
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    border-radius:18px;
    padding:25px;
    margin-bottom:22px;
}

.welcome h1{
    font-size:24px;
    margin-bottom:7px;
}

.welcome p{
    opacity:.9;
    font-size:14px;
}

/* =========================
   SUMMARY
========================= */

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.summary-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:18px;
}

.summary-card .label{
    font-size:12px;
    color:#6b7280;
    margin-bottom:8px;
}

.summary-card .value{
    font-size:25px;
    font-weight:bold;
}

/* =========================
   SUBJECT BAR
========================= */

.subject-section{
    margin-bottom:25px;
}

.section-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:13px;
}

.subject-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
}

.subject-tab{
    border:1px solid #dbe2ea;
    background:white;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    font-size:13px;
    transition:.2s;
}

.subject-tab:hover{
    border-color:#2563eb;
}

.subject-tab.active{
    background:#2563eb;
    color:white;
    border-color:#2563eb;
}

/* =========================
   TOPIC
========================= */

.topic-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:16px;
    margin-bottom:16px;
    overflow:hidden;
}

.topic-header{
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    background:#fff;
}

.topic-left{
    display:flex;
    align-items:center;
    gap:13px;
}

.topic-icon{
    width:40px;
    height:40px;
    border-radius:10px;
    background:#eff6ff;
    color:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.topic-title{
    font-size:16px;
    font-weight:bold;
}

.topic-meta{
    font-size:12px;
    color:#6b7280;
    margin-top:4px;
}

.topic-arrow{
    font-size:20px;
    color:#6b7280;
    transition:.2s;
}

.topic-card.open .topic-arrow{
    transform:rotate(180deg);
}

/* =========================
   TOPIC ITEMS
========================= */

.topic-content{
    display:none;
    border-top:1px solid #edf0f4;
}

.topic-card.open .topic-content{
    display:block;
}

.lms-item{
    padding:18px 20px;
    border-bottom:1px solid #edf0f4;
}

.lms-item:last-child{
    border-bottom:none;
}

.item-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.item-title-area{
    flex:1;
}

.item-title{
    font-size:15px;
    font-weight:bold;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.item-description{
    color:#6b7280;
    font-size:13px;
    line-height:1.5;
    margin-top:7px;
}

.new-badge{
    background:#dc2626;
    color:white;
    font-size:10px;
    font-weight:bold;
    padding:4px 7px;
    border-radius:5px;
    letter-spacing:.4px;
}

.completed-badge{
    background:#dcfce7;
    color:#166534;
    font-size:10px;
    font-weight:bold;
    padding:4px 7px;
    border-radius:5px;
}

.submitted-badge{
    background:#dbeafe;
    color:#1d4ed8;
    font-size:10px;
    font-weight:bold;
    padding:4px 7px;
    border-radius:5px;
}

.item-date{
    font-size:11px;
    color:#9ca3af;
    white-space:nowrap;
}

.item-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
}

.btn{
    border:none;
    border-radius:8px;
    padding:9px 13px;
    font-size:12px;
    cursor:pointer;
    font-weight:600;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-secondary{
    background:#eef2f7;
    color:#374151;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-warning{
    background:#f59e0b;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

/* =========================
   DETAILS
========================= */

.item-details{
    display:none;
    margin-top:15px;
    padding:15px;
    border-radius:10px;
    background:#f8fafc;
}

.lms-item.open .item-details{
    display:block;
}

.detail-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
    font-size:13px;
}

.detail-label{
    font-weight:bold;
    min-width:100px;
}

.comment-box{
    margin-top:14px;
    background:white;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:13px;
}

.comment-title{
    font-size:12px;
    font-weight:bold;
    margin-bottom:6px;
}

.comment-text{
    font-size:13px;
    line-height:1.5;
    color:#374151;
}

/* =========================
   EMPTY / LOADING
========================= */

.loading{
    background:white;
    border-radius:15px;
    padding:40px;
    text-align:center;
    color:#6b7280;
}

.empty{
    background:white;
    border:1px dashed #cbd5e1;
    border-radius:15px;
    padding:45px;
    text-align:center;
}

.empty-icon{
    font-size:40px;
    margin-bottom:12px;
}

.empty h3{
    margin-bottom:6px;
}

.empty p{
    color:#6b7280;
    font-size:13px;
}

/* =========================
   MODAL
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    z-index:500;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(700px,100%);
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:18px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.modal-title{
    font-size:19px;
    font-weight:bold;
}

.close-btn{
    border:none;
    background:#f1f5f9;
    width:35px;
    height:35px;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
}

.file-preview{
    background:#f8fafc;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}

.file-name{
    font-weight:bold;
    margin-bottom:6px;
}

.file-info{
    font-size:12px;
    color:#6b7280;
}

.open-file{
    display:inline-block;
    margin-top:12px;
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:10px 14px;
    border-radius:8px;
    font-size:13px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#111827;
    color:white;
    padding:13px 17px;
    border-radius:10px;
    font-size:13px;
    transform:translateY(100px);
    opacity:0;
    transition:.3s;
    z-index:1000;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .summary{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .topbar{
        height:auto;
        min-height:70px;
        padding:12px 15px;
    }

    .student-info{
        display:none;
    }

    .container{
        padding:15px;
    }

    .welcome{
        padding:20px;
    }

    .welcome h1{
        font-size:20px;
    }

    .summary{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .summary-card{
        padding:14px;
    }

    .summary-card .value{
        font-size:21px;
    }

    .item-top{
        flex-direction:column;
    }

    .item-date{
        white-space:normal;
    }
}
</style>

<script type="module">

import {
    collection,
    doc,
    getDoc,
    getDocs,
    query,
    where,
    setDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    db
}
from "./firebase-config.js";


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentStudent = null;

let currentStudentKey = "";

let allAssignments = [];

let allSubmissions = [];

let readAssignmentIds = new Set();

let groupedTopics = [];

let activeSubject = "ALL";


/* =========================================================
   UTILITY
========================================================= */

function normalize(value){

    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getTimestamp(value){

    if(!value){
        return 0;
    }

    if(typeof value === "number"){
        return value;
    }

    if(value.seconds){
        return value.seconds * 1000;
    }

    if(value.toDate){

        try{
            return value.toDate().getTime();
        }
        catch(e){}
    }

    const date = new Date(value);

    if(!isNaN(date.getTime())){
        return date.getTime();
    }

    return 0;
}


function formatDate(value){

    const timestamp = getTimestamp(value);

    if(!timestamp){
        return "";
    }

    return new Date(timestamp).toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}


function showToast(message){

    const toast = document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },2500);

}


/* =========================================================
   GET STORED STUDENT ID
========================================================= */

function getStoredStudentId(){

    return (

        sessionStorage.getItem("studentRollNo") ||

        sessionStorage.getItem("studentRegisterNo") ||

        sessionStorage.getItem("studentId") ||

        sessionStorage.getItem("rollNo") ||

        ""

    ).trim();

}


/* =========================================================
   FIND CURRENT STUDENT
========================================================= */

async function findStudent(){

    const storedId = getStoredStudentId();

    console.log(
        "STORED STUDENT ID:",
        storedId
    );

    if(!storedId){

        throw new Error(
            "Student login information not found."
        );

    }


    /*
       First try document ID.
    */

    try{

        const directRef = doc(
            db,
            "students",
            storedId
        );

        const directSnap = await getDoc(
            directRef
        );

        if(directSnap.exists()){

            return {
                id:directSnap.id,
                ...directSnap.data()
            };

        }

    }
    catch(error){

        console.warn(
            "Direct student lookup failed:",
            error
        );

    }


    /*
       Try rollNo.
    */

    const possibleFields = [
        "rollNo",
        "registerNo",
        "registerNumber",
        "studentId"
    ];


    for(const field of possibleFields){

        try{

            const q = query(
                collection(db,"students"),
                where(field,"==",storedId)
            );

            const snap = await getDocs(q);

            if(!snap.empty){

                const d = snap.docs[0];

                return {
                    id:d.id,
                    ...d.data()
                };

            }

        }
        catch(error){

            console.warn(
                "Student lookup failed:",
                field,
                error
            );

        }

    }


    /*
       Final fallback scan.
    */

    try{

        const snap = await getDocs(
            collection(db,"students")
        );

        for(const d of snap.docs){

            const data = d.data();

            const ids = [

                d.id,

                data.rollNo,

                data.registerNo,

                data.registerNumber,

                data.studentId

            ]
            .filter(Boolean)
            .map(String);

            if(ids.includes(storedId)){

                return {
                    id:d.id,
                    ...data
                };

            }

        }

    }
    catch(error){

        console.error(
            "Fallback student scan failed:",
            error
        );

    }


    throw new Error(
        "Student record not found for: " + storedId
    );

}


/* =========================================================
   STUDENT ID
========================================================= */

function getStudentKey(){

    return (

        currentStudent.registerNo ||

        currentStudent.rollNo ||

        currentStudent.registerNumber ||

        currentStudent.studentId ||

        currentStudent.id ||

        getStoredStudentId()

    ).toString().trim();

}


/* =========================================================
   CHECK ASSIGNMENT FOR CURRENT STUDENT
========================================================= */

function assignmentBelongsToStudent(assignment){

    const studentKey = normalize(
        currentStudentKey
    );


    /*
       Staff LMS normally stores:

       selectedStudents: [
          {
             registerNo: "..."
          }
       ]
    */

    if(Array.isArray(assignment.selectedStudents)){

        const found =
            assignment.selectedStudents.some(student => {

                if(typeof student === "string"){

                    return normalize(student) === studentKey;

                }

                if(!student || typeof student !== "object"){
                    return false;
                }

                const ids = [

                    student.registerNo,
                    student.rollNo,
                    student.studentId,
                    student.registerNumber,
                    student.id

                ]
                .filter(Boolean)
                .map(normalize);

                return ids.includes(studentKey);

            });


        if(found){
            return true;
        }

    }


    /*
       Other possible assignment formats.
    */

    const directIds = [

        assignment.registerNo,
        assignment.rollNo,
        assignment.studentRegisterNo,
        assignment.studentId

    ]
    .filter(Boolean)
    .map(normalize);


    if(directIds.includes(studentKey)){
        return true;
    }


    /*
       Some data may use selectedStudentIds.
    */

    if(Array.isArray(assignment.selectedStudentIds)){

        if(
            assignment.selectedStudentIds
                .map(normalize)
                .includes(studentKey)
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   LOAD ASSIGNMENTS
========================================================= */

async function loadAssignments(){

    console.log(
        "Loading lmsAssignments..."
    );


    const snap = await getDocs(
        collection(db,"lmsAssignments")
    );


    const visible = [];


    snap.forEach(d => {

        const data = d.data();


        if(
            assignmentBelongsToStudent({
                id:d.id,
                ...data
            })
        ){

            visible.push({

                id:d.id,

                ...data

            });

        }

    });


    /*
       Latest first.
    */

    visible.sort((a,b)=>{

        const aTime =
            getTimestamp(
                a.updatedAt ||
                a.createdAt ||
                a.assignedAt
            );

        const bTime =
            getTimestamp(
                b.updatedAt ||
                b.createdAt ||
                b.assignedAt
            );

        return bTime - aTime;

    });


    allAssignments = visible;


    console.log(
        "STUDENT LMS ASSIGNMENTS:",
        allAssignments
    );

}


/* =========================================================
   LOAD SUBMISSIONS
========================================================= */

async function loadSubmissions(){

    allSubmissions = [];


    /*
       First attempt query by studentRegisterNo.
    */

    try{

        const q = query(
            collection(db,"lmsSubmissions"),
            where(
                "studentRegisterNo",
                "==",
                currentStudentKey
            )
        );


        const snap = await getDocs(q);


        snap.forEach(d => {

            allSubmissions.push({

                id:d.id,

                ...d.data()

            });

        });


        return;

    }
    catch(error){

        console.warn(
            "Submission query failed:",
            error
        );

    }


    /*
       Fallback.
    */

    try{

        const snap = await getDocs(
            collection(db,"lmsSubmissions")
        );


        snap.forEach(d => {

            const data = d.data();

            const id = normalize(
                data.studentRegisterNo ||
                data.studentId ||
                data.registerNo
            );


            if(id === normalize(currentStudentKey)){

                allSubmissions.push({

                    id:d.id,

                    ...data

                });

            }

        });

    }
    catch(error){

        console.error(
            "Could not load submissions:",
            error
        );

    }

}


/* =========================================================
   LOAD READ STATUS
========================================================= */

async function loadReadStatus(){

    readAssignmentIds = new Set();


    try{

        const q = query(

            collection(db,"lmsReadStatus"),

            where(
                "studentRegisterNo",
                "==",
                currentStudentKey
            )

        );


        const snap = await getDocs(q);


        snap.forEach(d => {

            const data = d.data();


            if(data.assignmentId){

                readAssignmentIds.add(
                    String(data.assignmentId)
                );

            }

        });


        console.log(
            "READ ITEMS:",
            [...readAssignmentIds]
        );

    }
    catch(error){

        /*
           If Firestore asks for an index or the query
           cannot be executed, the page still works.
        */

        console.warn(
            "Read status query failed:",
            error
        );

    }

}


/* =========================================================
   MARK ITEM AS READ
========================================================= */

async function markAsRead(assignmentId){

    if(!assignmentId){
        return;
    }


    assignmentId = String(
        assignmentId
    );


    /*
       Immediately remove NEW locally.
    */

    readAssignmentIds.add(
        assignmentId
    );


    render();


    /*
       Deterministic document ID.

       This means:

       Student A + Assignment X
       has a different read document

       from

       Student B + Assignment X
    */

    const safeStudent =
        String(currentStudentKey)
            .replace(/[\/\\?#\[\]]/g,"_");

    const safeAssignment =
        String(assignmentId)
            .replace(/[\/\\?#\[\]]/g,"_");


    const readDocId =
        safeStudent +
        "_" +
        safeAssignment;


    try{

        await setDoc(

            doc(
                db,
                "lmsReadStatus",
                readDocId
            ),

            {

                studentRegisterNo:
                    currentStudentKey,

                assignmentId:
                    assignmentId,

                opened:true,

                openedAt:
                    serverTimestamp()

            },

            {
                merge:true
            }

        );

    }
    catch(error){

        console.error(
            "Could not save read status:",
            error
        );

    }

}


/* =========================================================
   GET TOPIC
========================================================= */

function getTopicName(assignment){

    const topic =

        assignment.topic ||

        assignment.topicName ||

        assignment.unit ||

        assignment.module ||

        assignment.chapter ||

        "General";


    return String(topic)
        .trim() || "General";

}


/* =========================================================
   GET SUBJECT
========================================================= */

function getSubjectName(assignment){

    return (

        assignment.subjectName ||

        assignment.subject ||

        assignment.subjectTitle ||

        assignment.subjectCode ||

        "General"

    ).toString().trim();

}


/* =========================================================
   GROUP BY SUBJECT + TOPIC
========================================================= */

function buildGroups(){

    const map = new Map();


    allAssignments.forEach(assignment => {

        const subject =
            getSubjectName(
                assignment
            );

        const topic =
            getTopicName(
                assignment
            );


        const key =
            normalize(subject) +
            "::" +
            normalize(topic);


        if(!map.has(key)){

            map.set(
                key,
                {

                    subject,

                    topic,

                    items:[]

                }
            );

        }


        map.get(key).items.push(
            assignment
        );

    });


    groupedTopics = [...map.values()];


    /*
       Newest topic first.
    */

    groupedTopics.sort((a,b)=>{

        const aTime =
            Math.max(
                ...a.items.map(item =>
                    getTimestamp(
                        item.updatedAt ||
                        item.createdAt ||
                        item.assignedAt
                    )
                )
            );

        const bTime =
            Math.max(
                ...b.items.map(item =>
                    getTimestamp(
                        item.updatedAt ||
                        item.createdAt ||
                        item.assignedAt
                    )
                )
            );

        return bTime - aTime;

    });


    /*
       Newest content first INSIDE the topic.
    */

    groupedTopics.forEach(group => {

        group.items.sort((a,b)=>{

            const aTime =
                getTimestamp(
                    a.updatedAt ||
                    a.createdAt ||
                    a.assignedAt
                );

            const bTime =
                getTimestamp(
                    b.updatedAt ||
                    b.createdAt ||
                    b.assignedAt
                );

            return bTime - aTime;

        });

    });

}


/* =========================================================
   GET SUBMISSION
========================================================= */

function getSubmission(assignmentId){

    return allSubmissions.find(
        submission =>
            String(
                submission.assignmentId
            ) === String(assignmentId)
    );

}


/* =========================================================
   SUBJECT LIST
========================================================= */

function renderSubjects(){

    const container =
        document.getElementById(
            "subjectTabs"
        );


    const subjects = [

        ...new Set(
            groupedTopics.map(
                group => group.subject
            )
        )

    ];


    let html = `

        <button
            class="subject-tab ${
                activeSubject === "ALL"
                    ? "active"
                    : ""
            }"
            onclick="filterSubject('ALL')">

            All

        </button>

    `;


    subjects.forEach(subject => {

        html += `

            <button
                class="subject-tab ${
                    normalize(activeSubject) ===
                    normalize(subject)
                        ? "active"
                        : ""
                }"
                onclick='filterSubject(${JSON.stringify(subject)})'>

                ${escapeHtml(subject)}

            </button>

        `;

    });


    container.innerHTML = html;

}


/* =========================================================
   ITEM HTML
========================================================= */

function renderItem(item){

    const submission =
        getSubmission(
            item.id
        );


    const isRead =
        readAssignmentIds.has(
            String(item.id)
        );


    const isCompleted =
        item.completed === true ||
        item.status === "completed" ||
        submission?.completed === true;


    const isSubmitted =
        submission?.submitted === true ||
        submission?.fileUrl ||
        submission?.fileName;


    const title =

        item.title ||

        item.assignmentTitle ||

        item.name ||

        item.materialTitle ||

        item.fileName ||

        "Learning Material";


    const description =

        item.description ||

        item.instructions ||

        item.content ||

        item.details ||

        "";


    const staffName =

        item.staffName ||

        item.facultyName ||

        item.assignedStaff ||

        "Faculty";


    const date =

        item.updatedAt ||

        item.createdAt ||

        item.assignedAt;


    const dueDate =

        item.dueDate ||

        item.deadline ||

        "";


    let badges = "";


    if(!isRead){

        badges += `
            <span class="new-badge">
                NEW
            </span>
        `;

    }


    if(isSubmitted){

        badges += `
            <span class="submitted-badge">
                SUBMITTED
            </span>
        `;

    }


    if(isCompleted){

        badges += `
            <span class="completed-badge">
                COMPLETED
            </span>
        `;

    }


    const itemId =
        "item_" +
        String(item.id)
            .replace(/[^a-zA-Z0-9_-]/g,"_");


    return `

        <div
            class="lms-item"
            id="${itemId}">

            <div class="item-top">

                <div class="item-title-area">

                    <div class="item-title">

                        ${escapeHtml(title)}

                        ${badges}

                    </div>


                    ${
                        description
                            ? `
                            <div class="item-description">

                                ${escapeHtml(
                                    description
                                )}

                            </div>
                            `
                            : ""
                    }

                </div>


                <div class="item-date">

                    ${formatDate(date)}

                </div>

            </div>


            <div class="item-actions">

                <button
                    class="btn btn-primary"
                    onclick='openItem(${JSON.stringify(item.id)})'>

                    Open

                </button>


                ${
                    item.fileUrl
                        ? `
                        <button
                            class="btn btn-secondary"
                            onclick='openMaterial(${JSON.stringify(item.id)})'>

                            View Material

                        </button>
                        `
                        : ""
                }


                ${
                    submission
                        ? `
                        <button
                            class="btn btn-success"
                            onclick='viewSubmission(${JSON.stringify(item.id)})'>

                            My Submission

                        </button>
                        `
                        : ""
                }

            </div>


            <div class="item-details">

                <div class="detail-row">

                    <span class="detail-label">
                        Faculty:
                    </span>

                    <span>
                        ${escapeHtml(staffName)}
                    </span>

                </div>


                ${
                    item.subjectCode
                        ? `
                        <div class="detail-row">

                            <span class="detail-label">
                                Subject Code:
                            </span>

                            <span>
                                ${escapeHtml(
                                    item.subjectCode
                                )}
                            </span>

                        </div>
                        `
                        : ""
                }


                ${
                    dueDate
                        ? `
                        <div class="detail-row">

                            <span class="detail-label">
                                Due Date:
                            </span>

                            <span>
                                ${escapeHtml(
                                    formatDate(dueDate)
                                )}
                            </span>

                        </div>
                        `
                        : ""
                }


                ${
                    item.fileName
                        ? `
                        <div class="detail-row">

                            <span class="detail-label">
                                File:
                            </span>

                            <span>
                                ${escapeHtml(
                                    item.fileName
                                )}
                            </span>

                        </div>
                        `
                        : ""
                }


                ${
                    submission?.comment ||
                    submission?.facultyComment
                        ? `
                        <div class="comment-box">

                            <div class="comment-title">
                                Faculty Comment
                            </div>

                            <div class="comment-text">

                                ${escapeHtml(
                                    submission.comment ||
                                    submission.facultyComment
                                )}

                            </div>

                        </div>
                        `
                        : ""
                }

            </div>

        </div>

    `;

}


/* =========================================================
   RENDER TOPICS
========================================================= */

function render(){

    buildGroups();

    renderSubjects();


    const container =
        document.getElementById(
            "lmsContainer"
        );


    let groups = groupedTopics;


    if(activeSubject !== "ALL"){

        groups =
            groups.filter(
                group =>
                    normalize(group.subject) ===
                    normalize(activeSubject)
            );

    }


    if(!groups.length){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📚
                </div>

                <h3>
                    No learning materials
                </h3>

                <p>
                    No LMS content has been assigned to you yet.
                </p>

            </div>

        `;

        updateSummary();

        return;

    }


    let html = "";


    groups.forEach((group,index)=>{

        const newItems =
            group.items.filter(
                item =>
                    !readAssignmentIds.has(
                        String(item.id)
                    )
            ).length;


        html += `

            <div
                class="topic-card ${
                    index === 0
                        ? "open"
                        : ""
                }">

                <div
                    class="topic-header"
                    onclick="toggleTopic(this)">

                    <div class="topic-left">

                        <div class="topic-icon">
                            📖
                        </div>

                        <div>

                            <div class="topic-title">

                                ${escapeHtml(
                                    group.topic
                                )}

                            </div>

                            <div class="topic-meta">

                                ${escapeHtml(
                                    group.subject
                                )}

                                ·

                                ${group.items.length}
                                item${
                                    group.items.length === 1
                                        ? ""
                                        : "s"
                                }

                                ${
                                    newItems
                                        ? `
                                        ·
                                        ${newItems}
                                        new
                                        `
                                        : ""
                                }

                            </div>

                        </div>

                    </div>


                    <div class="topic-arrow">
                        ▼
                    </div>

                </div>


                <div class="topic-content">

                    ${group.items
                        .map(renderItem)
                        .join("")}

                </div>

            </div>

        `;

    });


    container.innerHTML = html;


    updateSummary();

}


/* =========================================================
   SUMMARY
========================================================= */

function updateSummary(){

    const subjects =
        new Set(
            allAssignments.map(
                getSubjectName
            )
        );


    const topics =
        groupedTopics.length;


    const newItems =
        allAssignments.filter(
            item =>
                !readAssignmentIds.has(
                    String(item.id)
                )
        ).length;


    const submitted =
        allSubmissions.filter(
            submission =>
                submission.submitted === true ||
                submission.fileUrl ||
                submission.fileName
        ).length;


    document.getElementById(
        "subjectCount"
    ).textContent =
        subjects.size;


    document.getElementById(
        "topicCount"
    ).textContent =
        topics;


    document.getElementById(
        "newCount"
    ).textContent =
        newItems;


    document.getElementById(
        "submittedCount"
    ).textContent =
        submitted;

}


/* =========================================================
   FILTER SUBJECT
========================================================= */

window.filterSubject = function(subject){

    activeSubject = subject;

    render();

};


/* =========================================================
   TOGGLE TOPIC
========================================================= */

window.toggleTopic = function(header){

    const card =
        header.closest(
            ".topic-card"
        );


    card.classList.toggle(
        "open"
    );

};


/* =========================================================
   OPEN ITEM
========================================================= */

window.openItem = async function(id){

    const assignment =
        allAssignments.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!assignment){
        return;
    }


    /*
       IMPORTANT:

       NEW disappears when the student
       opens the actual LMS item.

       Merely expanding the topic does NOT
       mark everything as read.
    */

    await markAsRead(
        assignment.id
    );


    const itemId =
        "item_" +
        String(assignment.id)
            .replace(/[^a-zA-Z0-9_-]/g,"_");


    const element =
        document.getElementById(
            itemId
        );


    if(element){

        element.classList.add(
            "open"
        );

        element.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    }

};


/* =========================================================
   OPEN MATERIAL
========================================================= */

window.openMaterial = async function(id){

    const assignment =
        allAssignments.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!assignment){
        return;
    }


    await markAsRead(
        assignment.id
    );


    const url =
        assignment.fileUrl ||
        assignment.downloadURL ||
        assignment.url;


    if(!url){

        showToast(
            "No material file available."
        );

        return;

    }


    document.getElementById(
        "modalTitle"
    ).textContent =

        assignment.title ||

        assignment.assignmentTitle ||

        assignment.fileName ||

        "Learning Material";


    document.getElementById(
        "modalBody"
    ).innerHTML = `

        <div class="file-preview">

            <div class="file-name">

                ${escapeHtml(
                    assignment.fileName ||
                    "Learning Material"
                )}

            </div>

            <div class="file-info">

                ${escapeHtml(
                    getSubjectName(
                        assignment
                    )
                )}

                ${
                    assignment.topic
                        ? `
                        ·
                        ${escapeHtml(
                            assignment.topic
                        )}
                        `
                        : ""
                }

            </div>


            <a
                class="open-file"
                href="${escapeHtml(url)}"
                target="_blank"
                rel="noopener noreferrer">

                Open Material

            </a>

        </div>

    `;


    document.getElementById(
        "itemModal"
    ).classList.add(
        "show"
    );

};


/* =========================================================
   VIEW SUBMISSION
========================================================= */

window.viewSubmission = async function(id){

    const assignment =
        allAssignments.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!assignment){
        return;
    }


    await markAsRead(
        assignment.id
    );


    const submission =
        getSubmission(
            assignment.id
        );


    if(!submission){

        showToast(
            "No submission found."
        );

        return;

    }


    document.getElementById(
        "modalTitle"
    ).textContent =
        "My Submission";


    const fileUrl =
        submission.fileUrl ||
        submission.downloadURL ||
        "";


    document.getElementById(
        "modalBody"
    ).innerHTML = `

        <div class="file-preview">

            <div class="file-name">

                ${escapeHtml(
                    submission.fileName ||
                    "Submitted Work"
                )}

            </div>


            <div class="file-info">

                Assignment:
                ${escapeHtml(
                    assignment.title ||
                    assignment.assignmentTitle ||
                    "LMS Assignment"
                )}

            </div>


            ${
                submission.comment
                    ? `
                    <div class="comment-box">

                        <div class="comment-title">
                            Your Comment
                        </div>

                        <div class="comment-text">

                            ${escapeHtml(
                                submission.comment
                            )}

                        </div>

                    </div>
                    `
                    : ""
            }


            ${
                submission.facultyComment
                    ? `
                    <div class="comment-box">

                        <div class="comment-title">
                            Faculty Comment
                        </div>

                        <div class="comment-text">

                            ${escapeHtml(
                                submission.facultyComment
                            )}

                        </div>

                    </div>
                    `
                    : ""
            }


            ${
                fileUrl
                    ? `
                    <a
                        class="open-file"
                        href="${escapeHtml(fileUrl)}"
                        target="_blank"
                        rel="noopener noreferrer">

                        Open Submitted File

                    </a>
                    `
                    : ""
            }

        </div>

    `;


    document.getElementById(
        "itemModal"
    ).classList.add(
        "show"
    );

};


/* =========================================================
   CLOSE MODAL
========================================================= */

window.closeModal = function(){

    document.getElementById(
        "itemModal"
    ).classList.remove(
        "show"
    );

};


document.getElementById(
    "itemModal"
).addEventListener(
    "click",
    function(event){

        if(event.target === this){

            closeModal();

        }

    }
);
