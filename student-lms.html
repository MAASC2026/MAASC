import {
    collection,
    doc,
    getDoc,
    getDocs,
    query,
    where,
    setDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    db
}
from "./firebase-config.js";


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://lmqcmkttadmqyeshcuhf.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_E3y8efSouYf4DFK7Q7q86g_LKwmpLAi";

const SUPABASE_BUCKET =
    "lms-assignment";


const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   STATE
========================================================= */

let currentStudent = null;

let currentStudentKey = "";

let allAssignments = [];

let allSubmissions = [];

let readAssignmentIds = new Set();

let groupedTopics = [];

let activeSubject = "ALL";

let currentAssignment = null;

let currentSubmission = null;


/* =========================================================
   HELPERS
========================================================= */

function normalize(value){

    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");

}


function safe(value){

    return String(value ?? "")
        .trim();

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getTimestamp(value){

    if(!value){
        return 0;
    }

    if(typeof value === "number"){
        return value;
    }

    if(value?.seconds){
        return value.seconds * 1000;
    }

    if(typeof value?.toDate === "function"){

        try{
            return value.toDate().getTime();
        }
        catch(e){}
    }

    const d = new Date(value);

    return isNaN(d.getTime())
        ? 0
        : d.getTime();

}


function formatDate(value){

    const timestamp =
        getTimestamp(value);

    if(!timestamp){
        return "";
    }

    return new Date(timestamp)
        .toLocaleDateString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric"
            }
        );

}


function showToast(
    message,
    type="",
    duration=3000
){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.className =

        type;

    setTimeout(()=>{

        toast.classList.remove(
            "show"
        );

}


/* =========================================================
   STUDENT ID
========================================================= */

function getStoredStudentId(){

    return (

        sessionStorage.getItem(
            "studentRollNo"
        ) ||

        sessionStorage.getItem(
            "studentRegisterNo"
        ) ||

        sessionStorage.getItem(
            "studentId"
        ) ||

        sessionStorage.getItem(
            "rollNo"
        ) ||

        ""

    ).trim();

}


/* =========================================================
   FIND STUDENT
========================================================= */

async function findStudent(){

    const storedId =
        getStoredStudentId();


    if(!storedId){

        throw new Error(
            "Student login information not found. Please login again."
        );

    }


    /*
       1. Document ID
    */

    try{

        const ref =
            doc(
                db,
                "students",
                storedId
            );

        const snap =
            await getDoc(ref);


        if(snap.exists()){

            return {
                id:snap.id,
                ...snap.data()
            };

        }

    }
    catch(error){

        console.warn(
            "Direct student lookup failed",
            error
        );

    }


    /*
       2. Field lookup
    */

    const fields = [

        "rollNo",
        "registerNo",
        "registerNumber",
        "studentId"

    ];


    for(const field of fields){

        try{

            const q =
                query(
                    collection(
                        db,
                        "students"
                    ),
                    where(
                        field,
                        "==",
                        storedId
                    )
                );


            const snap =
                await getDocs(q);


            if(!snap.empty){

                const d =
                    snap.docs[0];

                return {
                    id:d.id,
                    ...d.data()
                };

            }

        }
        catch(error){

            console.warn(
                field,
                error
            );

        }

    }


    /*
       3. Final fallback
    */

    const snap =
        await getDocs(
            collection(
                db,
                "students"
            )
        );


    for(const d of snap.docs){

        const data =
            d.data();


        const ids = [

            d.id,

            data.rollNo,

            data.registerNo,

            data.registerNumber,

            data.studentId

        ]
        .filter(Boolean)
        .map(
            x => normalize(x)
        );


        if(
            ids.includes(
                normalize(storedId)
            )
        ){

            return {
                id:d.id,
                ...data
            };

        }

    }


    throw new Error(
        "Student record not found for " +
        storedId
    );

}


/* =========================================================
   STUDENT KEY
========================================================= */

function getStudentKey(){

    return (

        currentStudent.registerNo ||

        currentStudent.rollNo ||

        currentStudent.registerNumber ||

        currentStudent.studentId ||

        currentStudent.id ||

        getStoredStudentId()

    ).toString().trim();

}


/* =========================================================
   ASSIGNMENT VISIBILITY
========================================================= */

function assignmentBelongsToStudent(
    assignment
){

    const studentKey =
        normalize(
            currentStudentKey
        );


    /*
       Main Staff LMS structure.
    */

    if(
        Array.isArray(
            assignment.selectedStudents
        )
    ){

        const found =
            assignment.selectedStudents.some(
                student => {

                    if(
                        typeof student === "string"
                    ){

                        return (
                            normalize(student) ===
                            studentKey
                        );

                    }


                    if(
                        !student ||
                        typeof student !== "object"
                    ){

                        return false;

                    }


                    const ids = [

                        student.registerNo,
                        student.rollNo,
                        student.studentId,
                        student.registerNumber,
                        student.id

                    ]
                    .filter(Boolean)
                    .map(
                        x => normalize(x)
                    );


                    return ids.includes(
                        studentKey
                    );

                }
            );


        if(found){
            return true;
        }

    }


    /*
       Direct student fields.
    */

    const directIds = [

        assignment.registerNo,
        assignment.rollNo,
        assignment.studentRegisterNo,
        assignment.studentId

    ]
    .filter(Boolean)
    .map(
        x => normalize(x)
    );


    if(
        directIds.includes(
            studentKey
        )
    ){

        return true;

    }


    /*
       selectedStudentIds.
    */

    if(
        Array.isArray(
            assignment.selectedStudentIds
        )
    ){

        if(
            assignment.selectedStudentIds
                .map(
                    x => normalize(x)
                )
                .includes(
                    studentKey
                )
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   LOAD ASSIGNMENTS
========================================================= */

async function loadAssignments(){

    const snap =
        await getDocs(
            collection(
                db,
                "lmsAssignments"
            )
        );


    allAssignments = [];


    snap.forEach(d => {

        const assignment = {

            id:d.id,

            ...d.data()

        };


        if(
            assignmentBelongsToStudent(
                assignment
            )
        ){

            allAssignments.push(
                assignment
            );

        }

    });


    allAssignments.sort(
        (a,b) => {

            return getTimestamp(
                b.updatedAt ||
                b.createdAt ||
                b.assignedAt
            )
            -
            getTimestamp(
                a.updatedAt ||
                a.createdAt ||
                a.assignedAt
            );

        }
    );


    console.log(
        "VISIBLE STUDENT ASSIGNMENTS:",
        allAssignments
    );

}


/* =========================================================
   LOAD SUBMISSIONS
========================================================= */

async function loadSubmissions(){

    allSubmissions = [];


    try{

        const q =
            query(
                collection(
                    db,
                    "lmsSubmissions"
                ),
                where(
                    "studentRegisterNo",
                    "==",
                    currentStudentKey
                )
            );


        const snap =
            await getDocs(q);


        snap.forEach(d => {

            allSubmissions.push({

                id:d.id,

                ...d.data()

            });

        });


        return;

    }
    catch(error){

        console.warn(
            "Submission query failed:",
            error
        );

    }


    /*
       Fallback.
    */

    try{

        const snap =
            await getDocs(
                collection(
                    db,
                    "lmsSubmissions"
                )
            );


        snap.forEach(d => {

            const data =
                d.data();


            const student =
                normalize(
                    data.studentRegisterNo ||
                    data.studentId ||
                    data.registerNo
                );


            if(
                student ===
                normalize(
                    currentStudentKey
                )
            ){

                allSubmissions.push({

                    id:d.id,

                    ...data

                });

            }

        });

    }
    catch(error){

        console.error(
            "Submission fallback failed:",
            error
        );

    }

}

){

/* =========================================================
   SUBJECT / TOPIC
========================================================= */

function getSubjectName(
    assignment
){

    return (

        assignment.subjectName ||

        assignment.subject ||

        assignment.subjectTitle ||

        assignment.subjectCode ||

        "General"

    )
    .toString()
    .trim();

}


function getTopicName(
    assignment
){

    return (

        assignment.topic ||

        assignment.topicName ||

        assignment.unit ||

        assignment.module ||

        assignment.chapter ||

        "General"

    )
    .toString()
    .trim() || "General";

}


/* =========================================================
   BUILD GROUPS
========================================================= */

function buildGroups(){

    const map =
        new Map();


    allAssignments.forEach(
        assignment => {

            const subject =
                getSubjectName(
                    assignment
                );

            const topic =
                getTopicName(
                    assignment
                );


            const key =
                normalize(subject) +
                "::" +
                normalize(topic);


            if(
                !map.has(key)
            ){

                map.set(
                    key,
                    {

                        subject,

                        topic,

                        items:[]

                    }
                );

            }


            map.get(key)
                .items
                .push(
                    assignment
                );

        }
    );


    groupedTopics =
        [...map.values()];


    groupedTopics.sort(
        (a,b) => {

            const aLatest =
                Math.max(
                    ...a.items.map(
                        item =>
                            getTimestamp(
                                item.updatedAt ||
                                item.createdAt ||
                                item.assignedAt
                            )
                    )
                );


            const bLatest =
                Math.max(
                    ...b.items.map(
                        item =>
                            getTimestamp(
                                item.updatedAt ||
                                item.createdAt ||
                                item.assignedAt
                            )
                    )
                );


            return bLatest - aLatest;

        }
    );


    groupedTopics.forEach(
        group => {

            group.items.sort(
                (a,b) => {

                    return getTimestamp(
                        b.updatedAt ||
                        b.createdAt ||
                        b.assignedAt
                    )
                    -
                    getTimestamp(
                        a.updatedAt ||
                        a.createdAt ||
                        a.assignedAt
                    );

                }
            );

        }
    );

}


/* =========================================================

){

/* =========================================================
   RENDER
========================================================= */

function render(){

    buildGroups();

    renderSubjects();


    let groups =
        groupedTopics;


    if(
        activeSubject !== "ALL"
    ){

        groups =
            groups.filter(
                group =>
                    normalize(
                        group.subject
                    ) ===
                    normalize(
                        activeSubject
                    )
            );

    }


    const container =
        document.getElementById(
            "lmsContainer"
        );


    if(!groups.length){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📚
                </div>

                <h3>
                    No learning materials
                </h3>

                <p>
                    No LMS content has been assigned to you yet.
                </p>

            </div>

        `;

        updateSummary();

        return;

    }


    let html = "";


    groups.forEach(
        (group,index) => {

            const newCount =
                group.items.filter(
                    item =>
                        !readAssignmentIds.has(
                            String(item.id)
                        )
                ).length;


            html += `

                <div
                    class="topic-card ${
                        index === 0
                            ? "open"
                            : ""
                    }">

                    <div
                        class="topic-header"
                        onclick="toggleTopic(this)">

                            <div class="topic-icon">

                            </div>

                                        group.topic
                                    )}

                                </div>

                                <div class="topic-meta">

                                    ${escapeHtml(
                                        group.subject
                                    )}

                                    ·

                                    ${group.items.length}
                                    item${
                                        group.items.length === 1
                                            ? ""
                                            : "s"
                                    }

                                    ${
                                        newCount
                                            ? `
                                            ·
                                            ${newCount}
                                            new
                                            `
                                            : ""
                                    }

                                </div>

                            </div>

                        </div>

                        <div class="topic-arrow">
                            ▼
                        </div>

                    </div>


                    <div class="topic-content">

                        ${group.items
                            .map(

                            )
                            .join("")}

                    </div>

                </div>

        }
    );


    container.innerHTML =

    updateSummary();

/* =========================================================
   REQUIRED OPTION
========================================================= */

function isRequiredOption(
    value
){

    return (
        value === true ||
        value === "true" ||
        value === "required" ||
        value === "yes" ||
        value === "YES"
    );

}


/* =========================================================
   FILE SIZE
========================================================= */

function formatFileSize(
    bytes
){

    if(bytes < 1024){
        return bytes + " B";
    }

    if(bytes < 1024 * 1024){

        return (
            bytes / 1024
        ).toFixed(1) +
        " KB";

    }

    return (
        bytes /
        (1024 * 1024)
    ).toFixed(1) +
    " MB";

}


/* =========================================================
   SUPABASE UPLOAD
========================================================= */

async function uploadSubmissionFile(
    file
){

    if(!file){
        return null;
    }


    const MAX_FILE_SIZE =
        25 * 1024 * 1024;


    if(
        file.size >
        MAX_FILE_SIZE
    ){

        throw new Error(
            "File size must not exceed 25 MB."
        );

    }


    const safeRegister =
        safe(
            currentStudentKey
        )
        .replace(
            /[^a-zA-Z0-9_-]/g,
            "_"
        );


    const safeAssignmentId =
        safe(
            currentAssignment.id
        )
        .replace(
            /[^a-zA-Z0-9_-]/g,
            "_"
        );


    const safeName =
        file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );


    const path =

        "lmsSubmissions/" +

        safeRegister +

        "/" +

        safeAssignmentId +

        "/" +

        Date.now() +

        "_" +

        safeName;


    const progressContainer =
        document.getElementById(
            "submissionProgressContainer"
        );


    const progressBar =
        document.getElementById(
            "submissionProgress"
        );


    const progressText =
        document.getElementById(
            "submissionProgressText"
        );


    progressContainer.style.display =
        "block";


    progressBar.style.width =
        "20%";


    progressText.textContent =
        "Uploading...";


    console.log(
        "SUPABASE SUBMISSION PATH:",
        path
    );


    const {
        data,
        error
    } =
        await supabase
            .storage
            .from(
                SUPABASE_BUCKET
            )
            .upload(
                path,
                file,
                {
                    cacheControl:"3600",
                    upsert:false,
                    contentType:
                        file.type ||
                        "application/octet-stream"
                }
            );


    if(error){

        console.error(
            "SUPABASE UPLOAD ERROR:",
            error
        );

        throw new Error(
            error.message ||
            "Supabase file upload failed."
        );

    }


    progressBar.style.width =
        "80%";


    progressText.textContent =
        "Creating file link...";


    const publicResult =
        supabase
            .storage
            .from(
                SUPABASE_BUCKET
            )
            .getPublicUrl(
                path
            );


    const publicUrl =
        publicResult
            ?.data
            ?.publicUrl ||
        "";


    if(!publicUrl){

        throw new Error(
            "File uploaded but public URL could not be created."
        );

    }


    progressBar.style.width =
        "100%";


    progressText.textContent =
        "Upload complete";


    return {

        fileName:
            file.name,

        fileUrl:
            publicUrl,

        filePath:
            path,

        fileType:
            file.type || "",

        fileSize:
            file.size,

        hasAttachment:
            true

    };

}

    if(
        !currentAssignment ||
        !currentStudent
    ){

        showToast(
            "Assignment or student information is missing.",
            "error"
        );

        return;

    }


    const fileInput =
        document.getElementById(
            "studentFile"
        );


    const file =
        fileInput.files[0] ||
        null;


    const commentInput =
        document.getElementById(
            "studentComment"
        );


    const comment =
        commentInput.value.trim();


    const commentRequired =
        isRequiredOption(
            currentAssignment.commentRequired
        ) ||
        isRequiredOption(
            currentAssignment.allowComment
        );


    /*
       Comment requirement
    */

    if(
        commentRequired &&
        !comment
    ){

        commentInput.focus();

        showToast(
            "Comment is required.",
            "warning",
            5000
        );

        return;

    }


    /*
       New submission requires a file.
       Existing submission can keep its
       current file if no new file is selected.
    */

    if(
        !file &&
        !currentSubmission?.fileUrl
    ){

        showToast(
            "Please select a file to submit.",
            "warning",
            5000
        );

        fileInput.focus();

        return;

    }


    /*
       Disable button.
    */

    const button =
        document.getElementById(
            "submitAssignmentButton"
        );


    button.disabled =
        true;


    button.textContent =
        file
            ? "Uploading..."
            : "Saving...";


    try{

        let fileData = {

            fileName:
                currentSubmission?.fileName ||
                "",

            fileUrl:
                currentSubmission?.fileUrl ||
                "",

            filePath:
                currentSubmission?.filePath ||
                "",

            fileType:
                currentSubmission?.fileType ||
                "",

            fileSize:
                currentSubmission?.fileSize ||
                0

        };


        /*
           New file selected.
        */

        if(file){

            /*
               If resubmitting and an old file exists,
               delete the old physical file first.
            */

            if(
                currentSubmission?.filePath
            ){

                try{

                    const {
                        error
                    } =
                        await supabase
                            .storage
                            .from(
                                SUPABASE_BUCKET
                            )
                            .remove([
                                currentSubmission.filePath
                            ]);


                    if(error){

                        console.warn(
                            "Old file could not be removed:",
                            error
                        );

                    }

                }
                catch(error){

                    console.warn(
                        "Old storage cleanup failed:",
                        error
                    );

                }

            }


            fileData =
                await uploadSubmissionFile(
                    file
                );

        }


        /*
           IMPORTANT:
           One student + one assignment =
           one submission document.
        */

        const submissionId =

            safe(
                currentAssignment.id
            )
            .replace(
                /[^a-zA-Z0-9_-]/g,
                "_"
            ) +

            "_" +

            safe(
                currentStudentKey
            )
            .replace(
                /[^a-zA-Z0-9_-]/g,
                "_"
            );


        const submissionData = {

            assignmentId:
                currentAssignment.id,

            studentRegisterNo:
                currentStudentKey,

            studentName:

                currentStudent.name ||

                currentStudent.studentName ||

                "",

            studentId:

                currentStudent.studentId ||

                currentStudent.studentID ||

                currentStudent.id ||

                "",

            subjectId:

                currentAssignment.subjectId ||

                "",

            subjectCode:

                currentAssignment.subjectCode ||

                "",

            subjectName:

                currentAssignment.subjectName ||

                currentAssignment.subject ||

                "",

            topic:

                getTopicName(
                    currentAssignment
                ),

            assignmentTitle:

                currentAssignment.title ||

                currentAssignment.assignmentTitle ||

                currentAssignment.name ||

                "",

            staffId:

                currentAssignment.staffId ||

                "",

            staffName:

                currentAssignment.staffName ||

                currentAssignment.facultyName ||

                "",

            comment:
                comment,

            commentRequired:
                commentRequired,

            fileName:
                fileData.fileName,

            fileUrl:
                fileData.fileUrl,

            filePath:
                fileData.filePath,

            fileType:
                fileData.fileType,

            fileSize:
                fileData.fileSize,

            submitted:
                true,

            updatedAt:
                serverTimestamp(),

            completed:
                currentSubmission?.completed === true
                    ? true
                    : false

        };


        if(
            !currentSubmission
        ){

            submissionData.submittedAt =
                serverTimestamp();

        }


        console.log(
            "SAVING SUBMISSION:",
            submissionId,
            submissionData
        );


        await setDoc(

            doc(
                db,
                "lmsSubmissions",
                submissionId
            ),

            submissionData,

            {
                merge:true
            }

        );


        /*
           Reload submission.
        */

        await loadSubmissions();


        currentSubmission =
            getSubmission(
                currentAssignment.id
            );


        render();


        showToast(
            currentSubmission
                ? "Assignment submitted successfully."
                : "Assignment saved successfully.",
            "success",
            4000
        );


        setTimeout(
            () => {

                closeSubmissionModal();

            },
            700
        );

    }
    catch(error){

        console.error(
            "SUBMISSION ERROR:",
            error
        );


        showToast(
            error?.message ||
            "Assignment submission failed.",
            "error",
            6000
        );

    }
    finally{

        button.disabled =
            false;


        button.textContent =
            currentSubmission
                ? "Upload & Resubmit"
                : "Upload & Submit";

    }

};


/* =========================================================
   DELETE ATTACHMENT
========================================================= */

window.deleteStudentAttachment =
async function(){

    if(
        !currentSubmission ||
        !currentSubmission.filePath
    ){

        return;

    }


    const confirmed =
        window.confirm(
            "Delete the attached file?\n\nYou can attach another file before submitting again."
        );


    if(!confirmed){
        return;
    }


    const button =
        document.getElementById(
            "deleteAttachmentButton"
        );


    button.disabled =
        true;


    button.textContent =
        "Deleting...";


    try{

        const {
            error
        } =
            await supabase
                .storage
                .from(
                    SUPABASE_BUCKET
                )
                .remove([
                    currentSubmission.filePath
                ]);


        if(error){

            throw new Error(
                error.message ||
                "Unable to delete file."
            );

        }


        const submissionId =

            safe(
                currentAssignment.id
            )
            .replace(
                /[^a-zA-Z0-9_-]/g,
                "_"
            ) +

            "_" +

            safe(
                currentStudentKey
            )
            .replace(
                /[^a-zA-Z0-9_-]/g,
                "_"
            );


        await setDoc(

            doc(
                db,
                "lmsSubmissions",
                submissionId
            ),

            {

                fileName:"",

                fileUrl:"",

                filePath:"",

                fileType:"",

                fileSize:0,

                updatedAt:
                    serverTimestamp()

            },

            {
                merge:true
            }

        );


        await loadSubmissions();


        currentSubmission =
            getSubmission(
                currentAssignment.id
            );


        updateDeleteAttachmentButton();


        document.getElementById(
            "studentFile"
        ).value =
            "";


        document.getElementById(
            "studentFileName"
        ).textContent =
            "No file selected";


        showToast(
            "Attached file deleted.",
            "success"
        );

    }
    catch(error){

        console.error(
            "DELETE ATTACHMENT ERROR:",
            error
        );


        showToast(
            error.message ||
            "Unable to delete attachment.",
            "error"
        );

    }
    finally{

        button.disabled =
            false;

        updateDeleteAttachmentButton();

    }

};


/* =========================================================
   DELETE BUTTON STATE
========================================================= */

function updateDeleteAttachmentButton(){

    const button =
        document.getElementById(
            "deleteAttachmentButton"
        );


    if(
        currentSubmission?.filePath
    ){

        button.style.display =
            "inline-block";

    }
    else{

        button.style.display =
            "none";

    }

}


/* =========================================================
   CLOSE SUBMISSION MODAL
========================================================= */

window.closeSubmissionModal =
function(){

    document.getElementById(
        "submissionModal"
    ).classList.remove(
        "show"
    );

    currentAssignment =
        null;

    currentSubmission =
        null;

};


/* =========================================================
   VIEW SUBMISSION
========================================================= */

window.viewSubmission =
async function(id){

    const assignment =
        allAssignments.find(
            x =>
                String(x.id) ===
                String(id)
        );


    if(!assignment){
        return;
    }


    await markAsRead(
        assignment.id
    );


    const submission =
        getSubmission(
            assignment.id
        );


    if(!submission){

        showToast(
            "No submission found.",
            "warning"
        );

        return;

    }


    document.getElementById(
        "viewModalTitle"
    ).textContent =
        "My Submission";


    const title =

        assignment.title ||

        assignment.assignmentTitle ||

        assignment.name ||

        "Assignment";


    document.getElementById(
        "viewModalBody"
    ).innerHTML = `

        <div class="assignment-info">

            <h3>
                ${escapeHtml(title)}
            </h3>

            <p>
                <strong>Subject:</strong>
                ${escapeHtml(
                    getSubjectName(
                        assignment
                    )
                )}
            </p>

            <p>
                <strong>Status:</strong>
                ${
                    submission.submitted
                        ? "Submitted"
                        : "Not Submitted"
                }
            </p>

            ${
                submission.updatedAt
                    ? `
                    <p>
                        <strong>Last Updated:</strong>
                        ${formatDate(
                            submission.updatedAt
                        )}
                    </p>
                    `
                    : ""
            }

        </div>


        ${
            submission.fileUrl
                ? `
                <div class="existing-submission">

                    <h4>
                        📎 Submitted File
                    </h4>

                    <p>
                        ${escapeHtml(
                            submission.fileName ||
                            "Submitted file"
                        )}
                    </p>

                    <button
                        class="btn btn-primary"
                        onclick='window.open(${JSON.stringify(submission.fileUrl)},"_blank","noopener,noreferrer")'>

                        Open Submitted File

                    </button>

                </div>
                `
                : `
                <div class="empty">
                    No file attached.
                </div>
                `
        }


        ${
            submission.comment
                ? `
                <div class="faculty-comment">

                    <div class="faculty-comment-title">
                        Your Comment
                    </div>

                    <div class="faculty-comment-text">

                        ${escapeHtml(
                            submission.comment
                        )}

                    </div>

                </div>
                `
                : ""
        }


        ${
            submission.facultyComment ||
            submission.staffComment
                ? `
                <div class="faculty-comment">

                    <div class="faculty-comment-title">
                        Faculty Comment
                    </div>

                    <div class="faculty-comment-text">

                        ${escapeHtml(
                            submission.facultyComment ||
                            submission.staffComment
                        )}

                    </div>

                </div>
                `
                : ""
        }


        ${
            submission.completed === true
                ? `
                <div
                    style="
                        margin-top:15px;
                        padding:13px;
                        background:#dcfce7;
                        color:#166534;
                        border-radius:10px;
                        font-size:13px;
                        font-weight:bold;
                    ">

                    ✓ Assignment marked as completed by faculty

                </div>
                `
                : ""
        }

    `;


    document.getElementById(
        "viewModal"
    ).classList.add(
        "show"
    );

};

   CLOSE VIEW MODAL
