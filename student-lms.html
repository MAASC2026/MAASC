<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student LMS</title>

<!-- =========================================================
     SUPABASE
========================================================= -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6f9;
    color:#222;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    height:64px;
    background:#0b2b45;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;

    position:sticky;
    top:0;
    z-index:1000;

    box-shadow:0 2px 8px rgba(0,0,0,.25);
}

.header-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.menu-btn{
    border:none;
    background:transparent;
    color:white;

    font-size:25px;
    cursor:pointer;
}

.logo-title{
    font-size:19px;
    font-weight:bold;
}

.header-right{
    display:flex;
    align-items:center;
    gap:18px;
}

.student-header{
    text-align:right;
}

.student-header-name{
    font-size:14px;
    font-weight:bold;
}

.student-header-reg{
    font-size:11px;
    opacity:.8;
}

.logout-btn{
    border:none;
    background:#d9534f;
    color:white;

    padding:9px 14px;
    border-radius:5px;

    cursor:pointer;
    font-weight:bold;
}

/* =========================================================
   LAYOUT
========================================================= */

.layout{
    display:flex;
    min-height:calc(100vh - 64px);
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    width:240px;
    background:#102f48;
    color:white;

    flex-shrink:0;

    transition:.25s;

    min-height:calc(100vh - 64px);
}

.sidebar.closed{
    margin-left:-240px;
}

.sidebar-title{
    padding:20px;

    background:#082238;

    font-size:15px;
    font-weight:bold;

    border-bottom:1px solid rgba(255,255,255,.1);
}

.sidebar-item{
    padding:14px 20px;

    cursor:pointer;

    font-size:14px;

    border-bottom:1px solid rgba(255,255,255,.05);
}

.sidebar-item:hover{
    background:#174a6e;
}

.sidebar-item.active{
    background:#0d5c8f;
    border-left:4px solid #f39c12;
}

/* =========================================================
   MAIN
========================================================= */

.main{
    flex:1;
    min-width:0;
    padding:25px;
}

/* =========================================================
   STUDENT INFORMATION
========================================================= */

.student-info{
    background:white;

    border-radius:8px;

    padding:18px 20px;

    margin-bottom:22px;

    box-shadow:0 2px 8px rgba(0,0,0,.08);

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:15px;
}

.info-box{
    border-right:1px solid #ddd;
    padding-right:10px;
}

.info-box:last-child{
    border-right:none;
}

.info-label{
    font-size:11px;
    color:#777;

    margin-bottom:5px;

    text-transform:uppercase;
}

.info-value{
    font-size:14px;
    font-weight:bold;

    color:#0b4f7c;
}

/* =========================================================
   PAGE HEADER
========================================================= */

.page-header{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:18px;
}

.page-title{
    font-size:23px;

    color:#123d5b;

    font-weight:bold;
}

.page-subtitle{
    font-size:13px;

    color:#777;

    margin-top:4px;
}

/* =========================================================
   SEARCH
========================================================= */

.search-box{
    background:white;

    padding:12px;

    border-radius:7px;

    margin-bottom:20px;

    box-shadow:0 2px 7px rgba(0,0,0,.07);
}

.search-box input{
    width:100%;

    padding:12px 14px;

    border:1px solid #ccd5dc;

    border-radius:5px;

    outline:none;

    font-size:14px;
}

/* =========================================================
   SUBJECTS
========================================================= */

.subject-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(280px,1fr));

    gap:20px;
}

.subject-card{
    background:white;

    border-radius:8px;

    overflow:hidden;

    box-shadow:0 3px 10px rgba(0,0,0,.12);

    cursor:pointer;

    transition:.2s;

    position:relative;
}

.subject-card:hover{
    transform:translateY(-3px);

    box-shadow:0 7px 18px rgba(0,0,0,.18);
}

.subject-top{
    background:#0d5489;

    color:white;

    padding:17px;

    min-height:105px;
}

.subject-code{
    font-size:13px;

    font-weight:bold;

    opacity:.9;

    margin-bottom:7px;
}

.subject-name{
    font-size:17px;

    font-weight:bold;

    line-height:1.3;
}

.subject-body{
    padding:15px;
}

.subject-meta{
    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-bottom:12px;
}

.badge{
    background:#eef4f8;

    color:#174c6c;

    padding:5px 8px;

    border-radius:4px;

    font-size:11px;
}

.subject-footer{
    display:flex;

    justify-content:space-between;

    align-items:center;
}

.assignment-count{
    font-size:12px;
    color:#555;
}

.open-btn{
    background:#0d5489;

    color:white;

    border:none;

    padding:8px 13px;

    border-radius:4px;

    cursor:pointer;

    font-size:12px;

    font-weight:bold;
}

/* =========================================================
   COURSE
========================================================= */

.course-page{
    display:none;
}

.back-btn{
    background:#164e72;

    color:white;

    border:none;

    padding:9px 15px;

    border-radius:4px;

    cursor:pointer;

    margin-bottom:15px;

    font-weight:bold;
}

.course-header{
    background:#0d5489;

    color:white;

    padding:20px;

    border-radius:8px 8px 0 0;
}

.course-code{
    font-size:13px;
    opacity:.85;

    margin-bottom:6px;
}

.course-name{
    font-size:23px;
    font-weight:bold;
}

.course-info{
    margin-top:8px;

    font-size:12px;

    opacity:.9;
}

.course-tabs{
    background:white;

    display:flex;

    border-bottom:1px solid #ddd;

    box-shadow:0 2px 5px rgba(0,0,0,.06);

    overflow-x:auto;
}

.course-tab{
    padding:13px 20px;

    border:none;

    background:white;

    cursor:pointer;

    font-weight:bold;

    font-size:13px;

    color:#555;

    border-bottom:3px solid transparent;

    white-space:nowrap;
}

.course-tab.active{
    color:#0d5489;

    border-bottom-color:#0d5489;
}

.course-content{
    background:white;

    min-height:350px;

    padding:20px;

    border-radius:0 0 8px 8px;
}

/* =========================================================
   ASSIGNMENT
========================================================= */

.assignment-card{
    border:1px solid #d8dee3;

    margin-bottom:15px;

    border-radius:6px;

    overflow:hidden;

    background:white;

    box-shadow:0 1px 3px rgba(0,0,0,.05);
}

.assignment-header{
    background:#11558a;

    color:white;

    padding:12px 15px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;
}

.assignment-title{
    font-size:14px;

    font-weight:bold;

    flex:1;
}

.status{
    font-size:10px;

    padding:4px 7px;

    border-radius:4px;

    white-space:nowrap;
}

.status.pending{
    background:#d68910;
}

.status.submitted{
    background:#218838;
}

.status.completed{
    background:#6f42c1;
}

.assignment-body{
    padding:16px;
}

.topic{
    color:#174c6c;

    font-size:15px;

    font-weight:bold;

    margin-bottom:7px;
}

.description{
    color:#555;

    font-size:13px;

    line-height:1.6;

    white-space:pre-wrap;
}

.assignment-details{
    margin-top:12px;

    display:flex;

    flex-wrap:wrap;

    gap:8px;
}

.detail-badge{
    background:#f0f3f5;

    color:#555;

    padding:6px 9px;

    border-radius:4px;

    font-size:11px;
}

.assignment-actions{
    margin-top:15px;

    display:flex;

    flex-wrap:wrap;

    gap:8px;
}

.btn{
    border:none;

    border-radius:4px;

    padding:9px 13px;

    cursor:pointer;

    font-size:12px;

    font-weight:bold;
}

.btn-primary{
    background:#0d5489;
    color:white;
}

.btn-success{
    background:#218838;
    color:white;
}

.btn-purple{
    background:#6f42c1;
    color:white;
}

.btn-light{
    background:#edf1f4;
    color:#333;
}

.attachment{
    margin-top:14px;

    padding:12px;

    border:1px solid #ddd;

    background:#f8fafb;

    border-radius:5px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.loading,
.empty{
    background:white;

    border-radius:8px;

    padding:50px 20px;

    text-align:center;

    color:#777;

    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.spinner{
    width:35px;
    height:35px;

    border:4px solid #ddd;

    border-top-color:#0d5489;

    border-radius:50%;

    animation:spin 1s linear infinite;

    margin:0 auto 15px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.55);

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:3000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(760px,100%);

    max-height:90vh;

    overflow:auto;

    background:white;

    border-radius:8px;

    box-shadow:0 15px 50px rgba(0,0,0,.35);
}

.modal-header{
    background:#0d5489;

    color:white;

    padding:15px 18px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    position:sticky;

    top:0;

    z-index:2;
}

.modal-title{
    font-weight:bold;

    font-size:15px;
}

.close{
    border:none;

    background:transparent;

    color:white;

    font-size:24px;

    cursor:pointer;
}

.modal-body{
    padding:20px;
}

/* =========================================================
   FORM
========================================================= */

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;

    font-size:12px;

    font-weight:bold;

    color:#555;

    margin-bottom:6px;
}

.form-group textarea{
    width:100%;

    min-height:100px;

    resize:vertical;

    border:1px solid #ccd5dc;

    border-radius:5px;

    padding:10px;

    outline:none;

    font-family:Arial;
}

.file-picker{
    border:2px dashed #b9c7d1;

    padding:20px;

    border-radius:6px;

    text-align:center;

    background:#f9fbfc;

    cursor:pointer;
}

.file-picker input{
    display:none;
}

.file-name{
    margin-top:8px;

    color:#0d5489;

    font-size:12px;

    font-weight:bold;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress{
    display:none;

    margin-top:10px;
}

.progress-bar{
    height:8px;

    background:#e5e5e5;

    border-radius:10px;

    overflow:hidden;
}

.progress-fill{
    width:0%;

    height:100%;

    background:#0d5489;

    transition:.2s;
}

.progress-text{
    text-align:center;

    font-size:11px;

    color:#666;

    margin-top:4px;
}

/* =========================================================
   CHAT
========================================================= */

.chat-messages{
    height:330px;

    overflow-y:auto;

    padding:10px;

    background:#f5f7f9;

    border:1px solid #ddd;

    border-radius:6px;
}

.chat-message{
    max-width:80%;

    padding:10px;

    margin-bottom:10px;

    border-radius:8px;

    font-size:13px;

    line-height:1.5;
}

.chat-message.student{
    margin-left:auto;

    background:#dceffc;
}

.chat-message.faculty{
    margin-right:auto;

    background:#fff;

    border:1px solid #ddd;
}

.chat-name{
    font-weight:bold;

    font-size:11px;

    margin-bottom:4px;
}

.chat-date{
    font-size:9px;

    color:#888;

    margin-top:4px;
}

.chat-send{
    display:flex;

    gap:8px;

    margin-top:10px;
}

.chat-send input{
    flex:1;

    padding:10px;

    border:1px solid #ccc;

    border-radius:5px;

    outline:none;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    right:20px;

    bottom:20px;

    min-width:280px;

    max-width:420px;

    padding:13px 16px;

    background:#222;

    color:white;

    border-radius:5px;

    display:none;

    z-index:5000;

    font-size:13px;
}

.toast.show{
    display:block;
}

.toast.success{
    background:#218838;
}

.toast.error{
    background:#c9302c;
}

.toast.warning{
    background:#e67e22;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

    .student-info{
        grid-template-columns:repeat(2,1fr);
    }

    .info-box{
        border-right:none;
    }
}

@media(max-width:700px){

    .sidebar{
        position:fixed;

        left:0;
        top:64px;

        z-index:2000;

        height:calc(100vh - 64px);

        box-shadow:5px 0 15px rgba(0,0,0,.2);
    }

    .main{
        padding:15px;
    }

    .student-header{
        display:none;
    }

    .student-info{
        grid-template-columns:1fr 1fr;
    }

    .assignment-actions{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}

@media(max-width:450px){

    .student-info{
        grid-template-columns:1fr;
    }

    .subject-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

    <div class="header-left">

        <button
            class="menu-btn"
            id="menuBtn"
        >☰</button>

        <div class="logo-title">
            Student LMS
        </div>

    </div>

    <div class="header-right">

        <div class="student-header">

            <div
                class="student-header-name"
                id="headerName"
            >
                Loading...
            </div>

            <div
                class="student-header-reg"
                id="headerReg"
            ></div>

        </div>

        <button
            class="logout-btn"
            id="logoutBtn"
        >
            Logout
        </button>

    </div>

</header>


<!-- =========================================================
     LAYOUT
========================================================= -->

<div class="layout">

    <!-- SIDEBAR -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-title">
            STUDENT LMS
        </div>

        <div
            class="sidebar-item"
            id="dashboardBtn"
        >
            🏠 Dashboard
        </div>

        <div class="sidebar-item active">
            📚 My LMS
        </div>

        <div
            class="sidebar-item"
            id="profileBtn"
        >
            👤 My Profile
        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <!-- STUDENT INFO -->

        <section class="student-info">

            <div class="info-box">

                <div class="info-label">
                    Register No
                </div>

                <div
                    class="info-value"
                    id="studentRegister"
                >
                    -
                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    Student Name
                </div>

                <div
                    class="info-value"
                    id="studentName"
                >
                    -
                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    Department
                </div>

                <div
                    class="info-value"
                    id="studentDepartment"
                >
                    -
                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    Year
                </div>

                <div
                    class="info-value"
                    id="studentYear"
                >
                    -
                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    Section
                </div>

                <div
                    class="info-value"
                    id="studentSection"
                >
                    -
                </div>

            </div>

        </section>


        <!-- =================================================
             SUBJECT HOME
        ================================================== -->

        <section id="subjectHome">

            <div class="page-header">

                <div>

                    <div class="page-title">
                        My Courses
                    </div>

                    <div class="page-subtitle">
                        Your assigned subjects and learning work
                    </div>

                </div>

            </div>


            <div class="search-box">

                <input
                    type="text"
                    id="subjectSearch"
                    placeholder="Search subject..."
                >

            </div>


            <div
                class="subject-grid"
                id="subjectGrid"
            >

                <div class="loading">

                    <div class="spinner"></div>

                    Loading your LMS...

                </div>

            </div>

        </section>


        <!-- =================================================
             COURSE PAGE
        ================================================== -->

        <section
            class="course-page"
            id="coursePage"
        >

            <button
                class="back-btn"
                id="backBtn"
            >
                ← Back to My Courses
            </button>


            <div class="course-header">

                <div
                    class="course-code"
                    id="courseCode"
                ></div>

                <div
                    class="course-name"
                    id="courseName"
                ></div>

                <div
                    class="course-info"
                    id="courseInfo"
                ></div>

            </div>


            <div class="course-tabs">

                <button
                    class="course-tab active"
                    data-tab="assignments"
                >
                    📝 Class Work
                </button>

                <button
                    class="course-tab"
                    data-tab="materials"
                >
                    📚 Materials
                </button>

            </div>


            <div class="course-content">

                <div id="assignmentsTab">

                    <div
                        id="assignmentList"
                    >
                        <div class="loading">
                            Loading class work...
                        </div>
                    </div>

                </div>


                <div
                    id="materialsTab"
                    style="display:none"
                >

                    <div
                        id="materialsList"
                    ></div>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- =========================================================
     ASSIGNMENT MODAL
========================================================= -->

<div
    class="modal"
    id="assignmentModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <div
                class="modal-title"
                id="modalTitle"
            >
                Assignment
            </div>

            <button
                class="close"
                id="closeAssignment"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <div
                id="assignmentDetails"
            ></div>


            <div
                class="form-group"
                style="margin-top:20px"
            >

                <label>
                    Your Comment
                </label>

                <textarea
                    id="submissionComment"
                    placeholder="Enter your answer/comment..."
                ></textarea>

            </div>


            <div class="form-group">

                <label>
                    Upload Your Work
                </label>

                <label class="file-picker">

                    <input
                        type="file"
                        id="submissionFile"
                    >

                    📎 Click to choose your file

                    <div
                        class="file-name"
                        id="submissionFileName"
                    >
                        No file selected
                    </div>

                </label>

            </div>


            <div
                class="progress"
                id="uploadProgress"
            >

                <div class="progress-bar">

                    <div
                        class="progress-fill"
                        id="progressFill"
                    ></div>

                </div>

                <div
                    class="progress-text"
                    id="progressText"
                >
                    0%
                </div>

            </div>


            <div
                id="existingSubmission"
                style="margin-top:15px"
            ></div>


            <div
                style="
                    display:flex;
                    gap:8px;
                    flex-wrap:wrap;
                    margin-top:20px;
                "
            >

                <button
                    class="btn btn-primary"
                    id="submitBtn"
                >
                    Submit Assignment
                </button>

                <button
                    class="btn btn-purple"
                    id="chatBtn"
                >
                    💬 Faculty Chat
                </button>

                <button
                    class="btn btn-success"
                    id="completeBtn"
                >
                    ✓ Mark as Completed
                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     CHAT MODAL
========================================================= -->

<div
    class="modal"
    id="chatModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <div class="modal-title">
                Faculty Conversation
            </div>

            <button
                class="close"
                id="closeChat"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <div
                class="chat-messages"
                id="chatMessages"
            >
                Loading...
            </div>


            <div class="chat-send">

                <input
                    type="text"
                    id="chatInput"
                    placeholder="Type your message..."
                >

                <button
                    class="btn btn-primary"
                    id="sendChatBtn"
                >
                    Send
                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     TOAST
========================================================= -->

<div
    class="toast"
    id="toast"
></div>


<!-- =========================================================
     FIREBASE + APPLICATION
========================================================= -->

<script type="module">

/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
    initializeApp

/* =========================================================
   UTILITIES
========================================================= */

function safe(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value).trim();
}


function upper(value){

    return safe(value).toUpperCase();
}


function lower(value){

    return safe(value).toLowerCase();
}


function escapeHtml(value){

    return safe(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function getDateObject(value){

    if(!value){
        return null;
    }

    try{

        if(
            typeof value.toDate ===
            "function"
        ){
            return value.toDate();
        }

        if(
            value.seconds !== undefined
        ){
            return new Date(
                value.seconds * 1000
            );
        }

        const date =
            new Date(value);

        if(
            isNaN(date.getTime())
        ){
            return null;
        }

        return date;

    }
    catch{

        return null;
    }
}


function formatDate(value){

    const date =
        getDateObject(value);

    if(!date){
        return "-";
    }

    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


function showToast(
    message,
    type="success",
    duration=3500
){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.className =
        "toast show " + type;

    setTimeout(
        () => {

            toast.className =
                "toast";

        },
        duration
    );
}


/* =========================================================
   STUDENT IDENTITY
   IMPORTANT:
   sessionStorage.studentRollNo
   is the primary identity.
========================================================= */

function getStoredStudentId(){

    const primary =
        safe(
            sessionStorage.getItem(
                "studentRollNo"
            )
        );

    if(primary){
        return primary;
    }

    const secondary =
        safe(
            sessionStorage.getItem(
                "studentRegNo"
            )
        );

    if(secondary){
        return secondary;
    }

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        safe(params.get("rollNo")) ||
        safe(params.get("registerNo"))
    );
}


/* =========================================================
   NORMALIZE STUDENT
========================================================= */

function normalizeStudent(
    data,
    fallbackId=""
){

    data =
        data || {};

    const registerNo =
        safe(data.registerNo) ||
        safe(data.registerNumber) ||
        safe(data.studentRegisterNo) ||
        safe(data.studentRegNo) ||
        safe(data.regNo) ||
        safe(data.studentId) ||
        safe(data.studentID) ||
        safe(data.rollNo) ||
        safe(data.rollNumber) ||
        safe(fallbackId);


    const name =
        safe(data.studentName) ||
        safe(data.name) ||
        safe(data.fullName) ||
        safe(data.student_name);


    const department =
        safe(data.department) ||
        safe(data.dept);


    const year =
        safe(data.year) ||
        safe(data.classYear) ||
        safe(data.studentYear);


    const section =
        safe(data.section) ||
        safe(data.sec);


    return {

        ...data,

        registerNo,

        rollNo:
            safe(data.rollNo) ||
            registerNo,

        name,

        department,

        year,

        section

    };

}


/* =========================================================
   FIND EXACT STUDENT
========================================================= */

async function findStudent(){

    const storedId =
        getStoredStudentId();

    if(!storedId){

        throw new Error(
            "Student login session not found."
        );

    }

    const id =
        safe(storedId);

    const upperId =
        upper(id);


    /* -----------------------------------------------------
       1. DOCUMENT ID
    ----------------------------------------------------- */

    try{

        const ref =
            doc(
                db,
                "students",
                id
            );

        const snap =
            await getDoc(ref);

        if(snap.exists()){

            const student =
                normalizeStudent(
                    snap.data(),
                    snap.id
                );

            if(
                upper(student.registerNo)
                === upperId
                ||
                upper(student.rollNo)
                === upperId
                ||
                upper(snap.id)
                === upperId
            ){

                return student;

            }

        }

    }
    catch(error){

        console.warn(
            "DIRECT STUDENT LOOKUP:",
            error
        );

    }


    /* -----------------------------------------------------
       2. EXACT FIELD LOOKUP
    ----------------------------------------------------- */

    const fields = [

        "registerNo",
        "registerNumber",
        "studentRegisterNo",
        "studentRegNo",
        "regNo",
        "studentId",
        "studentID",
        "rollNo",
        "rollNumber"

    ];


    for(
        const field of fields
    ){

        try{

            const q =
                query(
                    collection(
                        db,
                        "students"
                    ),
                    where(
                        field,
                        "==",
                        id
                    )
                );

            const snap =
                await getDocs(q);

            for(
                const item of snap.docs
            ){

                const student =
                    normalizeStudent(
                        item.data(),
                        item.id
                    );

                const matches = [

                    student.registerNo,

                    student.rollNo,

                    item.id,

                    item.data().studentRegisterNo,

                    item.data().studentRegNo,

                    item.data().registerNumber,

                    item.data().rollNumber

                ].some(
                    value =>
                        upper(value)
                        === upperId
                );


                if(matches){

                    return student;

                }

            }

        }
        catch(error){

            console.warn(
                "STUDENT LOOKUP:",
                field,
                error
            );

        }

    }


    /* -----------------------------------------------------
       3. LAST RESORT SCAN
    ----------------------------------------------------- */

    try{

        const snap =
            await getDocs(
                collection(
                    db,
                    "students"
                )
            );


        for(
            const item of snap.docs
        ){

            const data =
                item.data() || {};


            const candidates = [

                data.registerNo,
                data.registerNumber,
                data.studentRegisterNo,
                data.studentRegNo,
                data.regNo,
                data.studentId,
                data.studentID,
                data.rollNo,
                data.rollNumber,
                item.id

            ];


            if(
                candidates.some(
                    value =>
                        upper(value)
                        === upperId
                )
            ){

                return normalizeStudent(
                    data,
                    item.id
                );

            }

        }

    }
    catch(error){

        console.error(
            "STUDENT SCAN:",
            error
        );

    }


    return null;
}

/* =========================================================
   SUBJECT EXTRACTION
========================================================= */

function extractSubjectArray(data){

    if(!data){
        return [];
    }


    const keys = [

        "subjects",
        "assignedSubjects",
        "subjectAssignments",
        "assignedSubject",
        "subjectList",
        "courses"

    ];


    for(
        const key of keys
    ){

        if(
            Array.isArray(
                data[key]
            )
        ){

            return data[key];

        }

    }


    for(
        const key of keys
    ){

        if(
            data[key] &&
            typeof data[key] === "object" &&
            !Array.isArray(data[key])
        ){

            return Object.entries(
                data[key]
            ).map(
                ([id,value]) => {

                    if(
                        value &&
                        typeof value === "object"
                    ){

                        return {
                            id,
                            ...value
                        };

                    }

                    return {
                        id,
                        subjectName:value
                    };

                }
            );

        }

    }


    return [];
}


/* =========================================================
   NORMALIZE SUBJECT
========================================================= */

function normalizeSubject(item){

    item =
        item || {};


    return {

        ...item,

        id:
            safe(item.id) ||
            safe(item.subjectId),

        subjectId:
            safe(item.subjectId) ||
            safe(item.id),

        subjectCode:
            safe(item.subjectCode) ||
            safe(item.code),

        subjectName:
            safe(item.subjectName) ||
            safe(item.name) ||
            safe(item.subject),

        department:
            safe(item.department),

        classYear:
            safe(item.classYear) ||
            safe(item.year) ||
            currentStudent.year,

        section:
            safe(item.section) ||
            currentStudent.section,

        roomNo:
            safe(item.roomNo),

        staffId:
            safe(item.staffId),

        staffName:
            safe(item.staffName)

    };

}

async function loadStudentSubjects(){

    subjectGrid.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

        </div>

    `;


    const registerNo =
        currentStudent.registerNo;

    ----------------------------------------------------- */

    try{

        const ref =
            doc(
                db,
                "student_subjects",
                registerNo
            );

        const snap =
            await getDoc(ref);


        if(snap.exists()){

            subjectItems =
                extractSubjectArray(
                    snap.data()
                );

        }

    }
    catch(error){

        console.warn(
            "SUBJECT DOC:",
            error
        );

    }


    /* -----------------------------------------------------
       REGISTER FIELD QUERY
    ----------------------------------------------------- */

    if(
        subjectItems.length === 0
    ){

        const fields = [

            "registerNo",
            "registerNumber",
            "studentRegisterNo",
            "studentRegNo",
            "regNo",
            "studentId",
            "rollNo"

        ];


        for(
            const field of fields
        ){

            try{

                const q =
                    query(
                        collection(
                            db,
                            "student_subjects"
                        ),
                        where(
                            field,
                            "==",
                            registerNo
                        )
                    );


                const snap =
                    await getDocs(q);


                if(!snap.empty){

                    subjectItems =
                        extractSubjectArray(
                            snap.docs[0].data()
                        );


                    if(
                        subjectItems.length
                    ){
                        break;
                    }

                }

            }
            catch(error){

                console.warn(
                    "SUBJECT QUERY:",
                    field,
                    error
                );

            }

        }

    }


    /* -----------------------------------------------------
       LAST RESORT SCAN
    ----------------------------------------------------- */

    if(
        subjectItems.length === 0
    ){

        try{

            const snap =
                await getDocs(
                    collection(
                        db,
                        "student_subjects"
                    )
                );


            for(
                const item of snap.docs
            ){

                const data =
                    item.data() || {};


                const ids = [

                    data.registerNo,
                    data.registerNumber,
                    data.studentRegisterNo,
                    data.studentRegNo,
                    data.regNo,
                    data.studentId,
                    data.rollNo,
                    item.id

                ];


                if(
                    ids.some(
                        value =>
                            upper(value)
                            ===
                            upper(registerNo)
                    )
                ){

                    subjectItems =
                        extractSubjectArray(
                            data
                        );

                    break;

                }

            }

        }
        catch(error){

            console.error(
                "SUBJECT SCAN:",
                error
            );

        }

    }


    allSubjects =
        subjectItems
            .map(
                normalizeSubject
            )
            .filter(
                item =>
                    item.subjectCode ||
                    item.subjectName ||
                    item.subjectId
            );


    /* -----------------------------------------------------
       REMOVE DUPLICATES
    ----------------------------------------------------- */

    const unique =
        new Map();


    for(
        const subject of allSubjects
    ){

        const key =
            upper(
                subject.subjectId
            ) ||
            upper(
                subject.subjectCode
            ) ||
            upper(
                subject.subjectName
            );


        if(!unique.has(key)){

            unique.set(
                key,
                subject
            );

        }

    }


    allSubjects =
        Array.from(
            unique.values()
        );


    await loadAssignments();

    await loadMaterials();

    renderSubjects();

}

async function loadAssignments(){

    allAssignments = [];


    try{

        const snap =
            await getDocs(
                collection(
                    db,
                    "lmsAssignments"
                )
            );


        snap.forEach(
            item => {

                allAssignments.push({

                    id:item.id,

                    ...item.data()

                });

            }
        );


        allAssignments.sort(
            (a,b) => {

                const aTime =
                    getDateObject(
                        a.createdAt
                    )?.getTime() || 0;


                const bTime =
                    getDateObject(
                        b.createdAt
                    )?.getTime() || 0;


                return bTime - aTime;

            }
        );

    }
    catch(error){

        console.error(
            "ASSIGNMENT LOAD:",
            error
        );

        showToast(
            "Unable to load LMS assignments.",
            "error"
        );

    }

}

/* =========================================================
   SUBJECT MATCH
========================================================= */

function assignmentBelongsToSubject(
    assignment,
    subject
){

    const assignmentSubjectId =
        upper(
            assignment.subjectId
        );


    const assignmentCode =
        upper(
            assignment.subjectCode
        );


    const assignmentName =
        lower(
            assignment.subjectName
        );


    const subjectId =
        upper(
            subject.subjectId
        );


    const subjectCode =
        upper(
            subject.subjectCode
        );


    const subjectName =
        lower(
            subject.subjectName
        );


    if(
        assignmentSubjectId &&
        subjectId &&
        assignmentSubjectId === subjectId
    ){
        return true;
    }


    if(
        assignmentCode &&
        subjectCode &&
        assignmentCode === subjectCode
    ){
        return true;
    }


    if(
        assignmentName &&
        subjectName &&
        assignmentName === subjectName
    ){
        return true;
    }


    return false;
}


/* =========================================================
   CRITICAL STUDENT FILTER
========================================================= */

function assignmentAssignedToCurrentStudent(
    assignment
){

    if(!currentStudent){
        return false;
    }


    const currentRegister =
        upper(
            currentStudent.registerNo
        );


    if(!currentRegister){
        return false;
    }


    /*
       Staff LMS stores selectedStudents
       as an array.

       Example:

       selectedStudents: [
           {
               registerNo:"212402326",
               name:"Student A"
           }
       ]
    */

    const selected =
        Array.isArray(
            assignment.selectedStudents
        )
        ?
        assignment.selectedStudents
        :
        [];


    /*
       VERY IMPORTANT:

       Empty selectedStudents does NOT mean
       "show to everybody".

       It means this student has NOT been
       individually assigned.
    */

    if(
        selected.length === 0
    ){

        return false;

    }


    return selected.some(
        student => {

            const registerNo =
                upper(
                    typeof student === "object"
                    ?
                    (
                        student.registerNo ||
                        student.registerNumber ||
                        student.studentRegisterNo ||
                        student.studentRegNo ||
                        student.regNo ||
                        student.rollNo ||
                        student.id ||
                        ""
                    )
                    :
                    student
                );


            return (
                registerNo ===
                currentRegister
            );

        }
    );

}


/* =========================================================
   SUBJECT ASSIGNMENT COUNT
========================================================= */

function getStudentAssignmentsForSubject(
    subject
){

    return allAssignments.filter(
        assignment =>

            assignmentBelongsToSubject(
                assignment,
                subject
            )

            &&

            assignmentAssignedToCurrentStudent(
                assignment
            )
    );

}

                            formatDate(

                            )

                    </span>
                    `
                    :
                    ""
                }

            ${

                `

                    <span>

                    class="btn btn-purple"

                    💬 Faculty Chat

                    <button

                    >
                        ✓ Completed
                    </button>
                    `
                    :
                    `
                    <button
                        class="btn btn-success"

                        ✓ Mark as Completed
                    </button>
                    `
                }

    `;


    /* OPEN ATTACHMENT */

    const openFile =
        card.querySelector(
            "[data-open-file]"
        );


    if(openFile){

        openFile.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                window.open(
                    attachment,
                    "_blank",
                    "noopener"
                );

            }
        );

    }


    /* SUBMIT */

    card.querySelector(
        "[data-submit]"
    ).addEventListener(
        "click",
        event => {

            event.stopPropagation();

            openAssignment(
                assignment,
                submission
            );

        }
    );


    /* CHAT */

    card.querySelector(
        "[data-chat]"
    ).addEventListener(
        "click",
        event => {

            event.stopPropagation();

            openAssignment(
                assignment,
                submission,

            );

        }
    );


    /* COMPLETE */

    const completeBtn =
        card.querySelector(
            "[data-complete]"
        );


    if(completeBtn){

        completeBtn.addEventListener(
            "click",
            async event => {

                event.stopPropagation();

        );

/* =========================================================
   SUBMIT ASSIGNMENT
========================================================= */

document.getElementById(
    "submitBtn"
).addEventListener(
    "click",
    submitAssignment
);


async function submitAssignment(){

    if(
        !currentAssignment ||
        !currentStudent
    ){

        return;

    }


    const button =
        document.getElementById(
            "submitBtn"
        );


    const comment =
        document.getElementById(
            "submissionComment"
        )
        .value
        .trim();


    const file =
        document.getElementById(
            "submissionFile"
        )
        .files[0];


    button.disabled =
        true;


    button.textContent =
        "Submitting...";


    try{

        let fileUrl =
            currentSubmission?.fileUrl ||
            "";

        let filePath =
            currentSubmission?.filePath ||
            "";

        let fileName =
            currentSubmission?.fileName ||
            "";


        /* -------------------------------------------------
           SUPABASE FILE UPLOAD
        ------------------------------------------------- */

        if(file){

            const safeRegister =
                safe(
                    currentStudent.registerNo
                )
                .replace(
                    /[^a-zA-Z0-9_-]/g,
                    "_"
                );


            const safeAssignmentId =
                safe(
                    currentAssignment.id
                )
                .replace(
                    /[^a-zA-Z0-9_-]/g,
                    "_"
                );


            const safeFileName =
                file.name
                    .replace(
                        /[^a-zA-Z0-9._-]/g,
                        "_"
                    );


            const path =

                "lmsSubmissions/" +
                safeRegister +
                "/" +
                safeAssignmentId +
                "/" +
                Date.now() +
                "_" +
                safeFileName;


            const progress =
                document.getElementById(
                    "uploadProgress"
                );


            const fill =
                document.getElementById(
                    "progressFill"
                );


            const text =
                document.getElementById(
                    "progressText"
                );


            progress.style.display =
                "block";


            fill.style.width =
                "20%";


            text.textContent =
                "Uploading...";


            const result =
                await supabase
                    .storage
                    .from(
                        SUPABASE_BUCKET
                    )
                    .upload(
                        path,
                        file,
                        {
                            cacheControl:"3600",
                            upsert:false,
                            contentType:
                                file.type ||
                                "application/octet-stream"
                        }
                    );


            if(result.error){

                throw result.error;

            }


            fill.style.width =
                "80%";


            const publicResult =
                supabase
                    .storage
                    .from(
                        SUPABASE_BUCKET
                    )
                    .getPublicUrl(
                        path
                    );


            fileUrl =
                publicResult
                    ?.data
                    ?.publicUrl ||
                "";


            if(!fileUrl){

                throw new Error(
                    "Could not create file URL."
                );

            }


            filePath =
                path;


            fileName =
                file.name;


            fill.style.width =
                "100%";


            text.textContent =
                "Upload complete";

        }


        /* -------------------------------------------------
           FIRESTORE SUBMISSION
        ------------------------------------------------- */

        const submissionId =

            safe(
                currentAssignment.id
            ) +
            "_" +
            safe(
                currentStudent.registerNo
            );


        const submissionData = {

            assignmentId:
                currentAssignment.id,

            studentRegisterNo:
                currentStudent.registerNo,

            studentName:
                currentStudent.name,

            studentId:
                currentStudent.studentId ||
                currentStudent.studentID ||
                "",

            subjectId:
                currentAssignment.subjectId ||
                currentCourse?.subjectId ||
                "",

            subjectCode:
                currentAssignment.subjectCode ||
                currentCourse?.subjectCode ||
                "",

            subjectName:
                currentAssignment.subjectName ||
                currentCourse?.subjectName ||
                "",

            staffId:
                currentAssignment.staffId ||
                currentCourse?.staffId ||
                "",

            staffName:
                currentAssignment.staffName ||
                currentCourse?.staffName ||
                "",

            comment,

            commentRequired:
                !!currentAssignment.commentRequired,

            fileName,

            fileUrl,

            filePath,

            submitted:true,

            updatedAt:
                serverTimestamp()

        };


        if(!currentSubmission){

            submissionData.submittedAt =
                serverTimestamp();

        }


        await setDoc(

            doc(
                db,
                "lmsSubmissions",
                submissionId
            ),

            submissionData,

            {
                merge:true
            }

        );


        currentSubmission =
            await getStudentSubmission(
                currentAssignment.id
            );


        showToast(
            "Assignment submitted successfully.",
            "success"
        );


        await renderAssignments();


        setTimeout(
            closeAssignmentModal,
            700
        );

    }
    catch(error){

        console.error(
            "SUBMISSION ERROR:",
            error
        );


        showToast(
            "Unable to submit: " +
            (
                error?.message ||
                "Unknown error"
            ),
            "error",
            7000
        );

    }
    finally{

        button.disabled =
            false;


        button.textContent =
            currentSubmission
            ?
            "Update Submission"
            :
            "Submit Assignment";

    }

}

/* =========================================================
   MATERIAL FILTER
========================================================= */

function materialBelongsToSubject(
    material,
    subject
){

    const materialSubjectId =
        upper(
            material.subjectId
        );


    const materialCode =
        upper(
            material.subjectCode
        );


    const materialName =
        lower(
            material.subjectName
        );


    const subjectId =
        upper(
            subject.subjectId
        );


    const subjectCode =
        upper(
            subject.subjectCode
        );


    const subjectName =
        lower(
            subject.subjectName
        );


    if(
        materialSubjectId &&
        subjectId &&
        materialSubjectId === subjectId
    ){
        return true;
    }


    if(
        materialCode &&
        subjectCode &&
        materialCode === subjectCode
    ){
        return true;
    }


    if(
        materialName &&
        subjectName &&
        materialName === subjectName
    ){
        return true;
    }


    return false;

}

/* =========================================================
   LOAD CHAT
========================================================= */

async function loadChatMessages(){

    const container =
        document.getElementById(
            "chatMessages"
        );


    container.innerHTML = `

        <div style="
            text-align:center;
            padding:25px;
            color:#777;
        ">

            Loading messages...

        </div>

    `;


    if(
        !currentAssignment ||
        !currentStudent
    ){

        return;

    }


    try{

        const q =
            query(
                collection(
                    db,
                    "lmsChats"
                ),
                where(
                    "assignmentId",
                    "==",
                    currentAssignment.id
                )
            );


        const snap =
            await getDocs(q);


        const currentRegister =
            upper(
                currentStudent.registerNo
            );


        const messages = [];


        snap.forEach(
            item => {

                const data =
                    item.data();


                /*
                   CRITICAL:

                   Only this student's messages
                   are displayed.
                */

                if(
                    upper(
                        data.studentRegisterNo
                    )
                    ===
                    currentRegister
                ){

                    messages.push({

                        id:item.id,

                        ...data

                    });

                }

            }
        );


        messages.sort(
            (a,b) => {

                const aTime =
                    getDateObject(
                        a.createdAt
                    )?.getTime() || 0;


                const bTime =
                    getDateObject(
                        b.createdAt
                    )?.getTime() || 0;


                return aTime - bTime;

            }
        );


        if(
            messages.length === 0
        ){

            container.innerHTML = `

                <div style="
                    text-align:center;
                    padding:30px;
                    color:#777;
                ">

                    No messages yet.

                    <br>

                    Start the conversation
                    with your faculty.

                </div>

            `;

            return;

        }


        container.innerHTML = "";


        messages.forEach(
            message => {

                const isStudent =
                    upper(
                        message.senderType
                    )
                    ===
                    "STUDENT";


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "chat-message " +
                    (
                        isStudent
                        ?
                        "student"
                        :
                        "faculty"
                    );


                div.innerHTML = `

                    <div class="chat-name">

                        ${escapeHtml(
                            message.senderName ||
                            (
                                isStudent
                                ?
                                "You"
                                :
                                "Faculty"
                            )
                        )}

                    </div>


                    <div>

                        ${escapeHtml(
                            message.message ||
                            ""
                        )}

                    </div>


                    <div class="chat-date">

                        ${escapeHtml(
                            formatDate(
                                message.createdAt
                            )
                        )}

                    </div>

                `;


                container.appendChild(
                    div
                );

            }
        );


        container.scrollTop =
            container.scrollHeight;

    }
    catch(error){

        console.error(
            "CHAT ERROR:",
            error
        );


        container.innerHTML = `

            <div style="
                padding:20px;
                color:#c9302c;
            ">

                Unable to load messages.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}

    }


    const button =

        );


    button.disabled =

            collection(
                db,
                "lmsChats"
            ),

            {

                assignmentId:
                    currentAssignment.id,

                subjectId:
                    currentAssignment.subjectId ||
                    currentCourse?.subjectId ||
                    "",

                subjectCode:
                    currentAssignment.subjectCode ||
                    currentCourse?.subjectCode ||
                    "",

                    currentCourse?.subjectName ||

                senderType:
                    "STUDENT",

                senderName:
                    currentStudent.name,

                message,

                createdAt:

        );


        showToast(

            "error"
        );

    finally{

    }

        :
        "none";


    document.getElementById(
        "materialsTab"
    ).style.display =
        tab === "materials"
        ?
        "block"
        :
        "none";

}

   LOGOUT
========================================================= */

document.getElementById(
    "logoutBtn"
).addEventListener(
    "click",
    async () => {

        try{

            await signOut(auth);

        }
        catch(error){

            console.warn(
                "AUTH LOGOUT:",
                error
            );

        }


        sessionStorage.removeItem(
            "studentRollNo"
        );

        sessionStorage.removeItem(
            "studentRegNo"
        );

        sessionStorage.removeItem(
            "studentName"
        );

        sessionStorage.removeItem(
            "currentStudentId"
        );

        localStorage.removeItem(
            "currentStudentId"
        );


        window.location.href =
            "student-login.html";

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

async function initializeStudentLMS(){

    try{

        console.log(
            "========================================"
        );

        console.log(
            "STUDENT LMS INITIALIZING"
        );

        console.log(
            "STORED STUDENT:",
            getStoredStudentId()
        );


        currentStudent =
            await findStudent();


        if(!currentStudent){

            throw new Error(
                "Student record not found."
            );

        }


        console.log(
            "CURRENT STUDENT:",
            currentStudent
        );


        displayStudent();


        await loadStudentSubjects();


        console.log(
            "STUDENT LMS READY"
        );

    }
    catch(error){

        console.error(
            "STUDENT LMS INITIALIZATION ERROR:",
            error
        );


        subjectGrid.innerHTML = `

            <div class="empty">

                <h3>
                    Unable to load Student LMS
                </h3>

                <p style="
                    margin-top:10px;
                    color:#c9302c;
                ">

                    ${escapeHtml(
                        error.message
                    )}

                </p>

                <button
                    class="btn btn-primary"
                    style="margin-top:15px"
                    onclick="location.reload()"
                >
                    Try Again
                </button>

            </div>

        `;

    }

}


initializeStudentLMS();

</script>
