<style>

/* ==================================================
   RESET
================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}


/* ==================================================
   BODY
================================================== */

body{
    background:#f4f6f9;
    padding:20px;
    color:#1f2937;
}


/* ==================================================
   MAIN CONTAINER
================================================== */

.container{
    max-width:1400px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}


/* ==================================================
   TITLE
================================================== */

h2{
    text-align:center;
    margin-bottom:20px;
    color:#1565c0;
}


/* ==================================================
   FORM
================================================== */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-bottom:20px;
}


.form-grid input,
.form-grid select,
.form-grid textarea{

    width:100%;

    padding:10px;

    border:1px solid #ccc;

    border-radius:5px;

    font-size:15px;

    outline:none;
}


.form-grid input:focus,
.form-grid select:focus,
.form-grid textarea:focus{

    border-color:#1565c0;

    box-shadow:0 0 0 2px rgba(21,101,192,.1);

}


.form-grid textarea{

    grid-column:1/3;

    resize:vertical;

}


/* ==================================================
   BUTTON AREA
================================================== */

.button-area{

    grid-column:1/3;

    display:flex;

    gap:10px;

    flex-wrap:wrap;

}


button{

    padding:10px 20px;

    border:none;

    border-radius:5px;

    cursor:pointer;

    font-size:15px;

    transition:.2s;

}


button:hover{

    opacity:.9;

    transform:translateY(-1px);

}


#saveBtn{

    background:#1565c0;

    color:white;

}


#clearBtn{

    background:#757575;

    color:white;

}


#updateBtn{

    background:#2e7d32;

    color:white;

    display:none;

}


/* ==================================================
   TABLE WRAPPER
================================================== */

.table-wrapper{

    overflow:auto;

    margin-top:20px;

}


/* ==================================================
   TABLE
================================================== */

table{

    width:100%;

    border-collapse:collapse;

    min-width:1300px;

}


table th{

    background:#1565c0;

    color:white;

    padding:10px;

    border:1px solid #1259a5;

}


table td{

    padding:10px;

    border:1px solid #ddd;

    text-align:center;

    vertical-align:middle;

}


/* ==================================================
   ACTION BUTTONS
================================================== */

.action-btn{

    padding:6px 10px;

    margin:2px;

    border:none;

    border-radius:4px;

    cursor:pointer;

    color:white;

    font-size:13px;

}


.edit{

    background:#2e7d32;

}


.delete{

    background:#d32f2f;

}


.complete{

    background:#00897b;

}


.action-btn:hover{

    opacity:.85;

}


/* ==================================================
   COMPLETED SECTION
================================================== */

.completed-section{

    margin-top:45px;

    border-top:3px solid #e0e0e0;

    padding-top:25px;

}


.completed-title{

    color:#2e7d32;

    margin-bottom:15px;

    font-size:22px;

    border-left:5px solid #2e7d32;

    padding-left:10px;

}


.completed-table{

    min-width:1400px;

}


.completed-table th{

    background:#2e7d32;

    border-color:#256b29;

}


/* ==================================================
   COMPLETED STATUS
================================================== */

.status-completed{

    display:inline-block;

    padding:5px 10px;

    border-radius:4px;

    background:#e8f5e9;

    color:#2e7d32;

    font-weight:bold;

}


/* ==================================================
   NO DATA
================================================== */

.no-data{

    text-align:center;

    padding:20px !important;

    color:#777;

    font-weight:bold;

}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:800px){

    body{

        padding:10px;

    }


    .container{

        padding:15px;

    }


    .form-grid{

        grid-template-columns:1fr;

    }


    .form-grid textarea{

        grid-column:1;

    }


    .button-area{

        grid-column:1;

    }

}

</style>

// ==================================================
// LOAD FACULTY FROM FIRESTORE
// ==================================================

async function loadFaculty(){

    const faculty=
    document.getElementById("faculty");


    faculty.innerHTML=
    "<option value=''>Select staff</option>";


    try{


        const q=query(

            collection(
                db,
                "staff"
            ),

            orderBy(
                "staffName"
            )

        );


        const snap=
        await getDocs(q);


        snap.forEach((d)=>{

            const s=d.data();


            if(
                s.staffName &&
                s.staffName.trim()!=""
            ){

                faculty.innerHTML+=`

                    <option value="${escapeHtml(
                        s.staffName
                    )}">

                        ${escapeHtml(
                            s.staffName
                        )}

                    </option>

                `;

            }

        });


    }

    catch(err){

        console.log(
            "Faculty loading error:",
            err
        );

    }

}


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHtml(value){

    if(value===null ||
       value===undefined){

        return "";

    }


    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}

// ==================================================
// SAVE EXAM
// ==================================================

async function saveExam(){


    const exam={

        department:
        document
        .getElementById("department")
        .value,

        year:
        document
        .getElementById("year")
        .value,

        section:
        document
        .getElementById("section")
        .value,

        semester:
        document
        .getElementById("semester")
        .value,

        subject:
        document
        .getElementById("subject")
        .value
        .trim(),

        faculty:
        document
        .getElementById("faculty")
        .value,

        examType:
        document
        .getElementById("examType")
        .value,

        examDate:
        document
        .getElementById("examDate")
        .value,

        examTime:
        document
        .getElementById("examTime")
        .value,

        maxMarks:
        document
        .getElementById("maxMarks")
        .value,

        portion:
        document
        .getElementById("portion")
        .value
        .trim(),

        createdAt:
        new Date(),

        completed:
        false

    };


    // ==================================================
    // VALIDATION
    // ==================================================

    if(

        exam.department==="" ||

        exam.year==="" ||

        exam.section==="" ||

        exam.semester==="" ||

        exam.subject==="" ||

        exam.faculty==="" ||

        exam.examType==="" ||

        exam.examDate==="" ||

        exam.examTime==="" ||

        exam.maxMarks===""

    ){

        alert(
            "Please fill all required fields."
        );

        return;

    }


    try{


        await addDoc(

            collection(
                db,
                "examAssignments"
            ),

            exam

        );


        alert(
            "Exam Assigned Successfully."
        );


        clearForm();


        await loadExams();


    }

    catch(err){

        console.error(
            "Save exam error:",
            err
        );


        alert(
            err.message
        );

    }

}


// ==================================================
// LOAD EXAMS
// ==================================================

async function loadExams(){


    const table=
    document.getElementById(
        "examTable"
    );


    const completedTable=
    document.getElementById(
        "completedExamTable"
    );


    table.innerHTML="";

    completedTable.innerHTML="";


    try{


        const q=query(

            collection(
                db,
                "examAssignments"
            ),

            orderBy(
                "createdAt",
                "desc"
            )

        );


        const snap=
        await getDocs(q);


        // ==================================================
        // NO RECORDS
        // ==================================================

        if(snap.empty){

            table.innerHTML=`

                <tr>

                    <td
                    colspan="12"
                    class="no-data">

                        No Exam Assignments Found

                    </td>

                </tr>

            `;


            completedTable.innerHTML=`

                <tr>

                    <td
                    colspan="13"
                    class="no-data">

                        No Completed Exams

                    </td>

                </tr>

            `;


            return;

        }


        let activeCount=0;

        let completedCount=0;


        // ==================================================
        // PROCESS EVERY RECORD
        // ==================================================

        snap.forEach((item)=>{


            const e=
            item.data();


            /*
             * IMPORTANT
             *
             * Only completed:true is considered
             * completed.
             *
             * Existing records that do not contain
             * completed will remain active.
             */


            const isCompleted=
            e.completed===true;


            // ==================================================
            // COMPLETED
            // ==================================================

            if(isCompleted){

                completedCount++;


                completedTable.innerHTML+=`

                    <tr>

                        <td>
                            ${escapeHtml(
                                e.department
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                e.year
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                e.section
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                e.semester
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                e.subject
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                e.faculty
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                e.examType
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                e.examDate
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                e.examTime
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                e.maxMarks
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                e.portion
                            )}
                        </td>

                        <td>

                            <span
                            class="status-completed">

                                Completed

                            </span>

                        </td>

                        <td>

                            <button
                            class="action-btn delete"
                            onclick="deleteExam('${item.id}')">

                                Delete

                            </button>

                        </td>

                    </tr>

                `;


                return;

            }


            // ==================================================
            // ACTIVE
            // ==================================================

            activeCount++;


            table.innerHTML+=`

                <tr>

                    <td>
                        ${escapeHtml(
                            e.department
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            e.year
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            e.section
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            e.semester
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            e.subject
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            e.faculty
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            e.examType
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            e.examDate
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            e.examTime
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            e.maxMarks
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            e.portion
                        )}
                    </td>

                    <td>


                        <button
                        class="action-btn complete"
                        onclick="markExamComplete('${item.id}')">

                            Mark as Complete

                        </button>


                        <button
                        class="action-btn edit"
                        onclick="editExam('${item.id}')">

                            Edit

                        </button>


                        <button
                        class="action-btn delete"
                        onclick="deleteExam('${item.id}')">

                            Delete

                        </button>


                    </td>

                </tr>

            `;

        });


        // ==================================================
        // NO ACTIVE
        // ==================================================

        if(activeCount===0){

            table.innerHTML=`

                <tr>

                    <td
                    colspan="12"
                    class="no-data">

                        No Active Exam Assignments

                    </td>

                </tr>

            `;

        }


        // ==================================================
        // NO COMPLETED
        // ==================================================

        if(completedCount===0){

            completedTable.innerHTML=`

                <tr>

                    <td
                    colspan="13"
                    class="no-data">

                        No Completed Exams

                    </td>

                </tr>

            `;

        }


    }

    catch(err){

        console.error(
            "Load exams error:",
            err
        );


        table.innerHTML=`

            <tr>

                <td
                colspan="12"
                class="no-data">

                    Unable to load exam assignments

                </td>

            </tr>

        `;


        completedTable.innerHTML=`

            <tr>

                <td
                colspan="13"
                class="no-data">

                    Unable to load completed exams

                </td>

            </tr>

        `;

    }

}


// ==================================================
// MARK AS COMPLETE
// ==================================================

window.markExamComplete=
async function(id){


    const ok=
    confirm(
        "Are you sure you want to mark this exam as completed?"
    );


    if(!ok){

        return;

    }


    try{


        const ref=
        doc(
            db,
            "examAssignments",
            id
        );


        await updateDoc(

            ref,

            {

                completed:true,

                completedAt:
                new Date()

            }

        );


        alert(
            "Exam marked as completed successfully."
        );


        await loadExams();


    }

    catch(err){

        console.error(
            "Complete exam error:",
            err
        );


        alert(
            err.message
        );

    }

};


// ==================================================
// DELETE EXAM
// ==================================================

window.deleteExam=
async function(id){


    const ok=
    confirm(
        "Delete this exam assignment?"
    );


    if(!ok){

        return;

    }


    try{


        await deleteDoc(

            doc(
                db,
                "examAssignments",
                id
            )

        );


        alert(
            "Deleted Successfully"
        );


        await loadExams();


    }

    catch(err){

        console.error(
            "Delete exam error:",
            err
        );


        alert(
            err.message
        );

    }

};


// ==================================================
// EDIT EXAM
// ==================================================

window.editExam=
async function(id){


    try{


        const ref=
        doc(
            db,
            "examAssignments",
            id
        );


        const snap=
        await getDoc(ref);


        if(!snap.exists()){

            alert(
                "Exam record not found."
            );

            return;

        }
