/* =========================================================
   HELPERS
========================================================= */

function getField(data, aliases, fallback = "") {

    for (const key of aliases) {

        if (
            data &&
            data[key] !== undefined &&
            data[key] !== null &&
            String(data[key]).trim() !== ""
        ) {
            return data[key];
        }

    }

    return fallback;
}


/* =========================================================
   NORMALIZE DEPARTMENT
========================================================= */

function normalizeDepartment(value) {

    if (
        value === undefined ||
        value === null
    ) {
        return "";
    }

    return String(value)
        .trim()
        .replace(/\s+/g, " ")
        .toUpperCase();

}


/* =========================================================
   NORMALIZE YEAR
========================================================= */

function normalizeYear(value) {

    if (
        value === undefined ||
        value === null
    ) {
        return "";
    }

    let v = String(value)
        .trim()
        .toUpperCase()
        .replace(/\s+/g, " ");

    if (
        v === "1" ||
        v === "I" ||
        v === "1ST" ||
        v === "1ST YEAR" ||
        v === "FIRST" ||
        v === "FIRST YEAR"
    ) {
        return "1";
    }

    if (
        v === "2" ||
        v === "II" ||
        v === "2ND" ||
        v === "2ND YEAR" ||
        v === "SECOND" ||
        v === "SECOND YEAR"
    ) {
        return "2";
    }

    if (
        v === "3" ||
        v === "III" ||
        v === "3RD" ||
        v === "3RD YEAR" ||
        v === "THIRD" ||
        v === "THIRD YEAR"
    ) {
        return "3";
    }

    if (
        v === "4" ||
        v === "IV" ||
        v === "4TH" ||
        v === "4TH YEAR" ||
        v === "FOURTH" ||
        v === "FOURTH YEAR"
    ) {
        return "4";
    }

    return v;

}


/* =========================================================
   NORMALIZE SECTION
========================================================= */

function normalizeSection(value) {

    if (
        value === undefined ||
        value === null
    ) {
        return "";
    }

    let v = String(value)
        .trim()
        .toUpperCase()
        .replace(/\s+/g, " ");

    v = v
        .replace(/^SECTION\s+/i, "")
        .replace(/\s+SECTION$/i, "")
        .trim();

    return v;

}


/* =========================================================
   NATURAL ROLL NUMBER SORT
========================================================= */

function compareRollNumbers(a, b) {

    const x = String(a || "")
        .trim()
        .toUpperCase();

    const y = String(b || "")
        .trim()
        .toUpperCase();

    if (!x && !y) return 0;

    if (!x) return 1;

    if (!y) return -1;

    const xParts =
        x.match(/\d+|\D+/g) || [];

    const yParts =
        y.match(/\d+|\D+/g) || [];

    const length =
        Math.max(xParts.length, yParts.length);

    for (
        let i = 0;
        i < length;
        i++
    ) {

        const xp = xParts[i] || "";

        const yp = yParts[i] || "";

        const xn = /^\d+$/.test(xp);

        const yn = /^\d+$/.test(yp);

        if (xn && yn) {

            const diff =
                Number(xp) - Number(yp);

            if (diff !== 0) {
                return diff;
            }

        }
        else {

            const diff =
                xp.localeCompare(
                    yp,
                    undefined,
                    {
                        numeric:true,
                        sensitivity:"base"
                    }
                );

            if (diff !== 0) {
                return diff;
            }

        }

    }

    return x.localeCompare(y);

}

function makeStudent(id, data) {

    const registerNo =
        getField(
            data,

        getField(
            data,

                "RollNo",
                "Roll Number",
                "ROLLNO",
                "ROLL_NO"
            ],
            ""
        );

    const name =
        getField(
            data,
            [
                "name",
                "studentName",
                "student_name",
                "fullName",
                "displayName",
                "studentFullName",
                "Name",
                "Student Name"
            ],
            "Unknown Student"
        );

    const department =
        getField(
            data,
            [
                "department",
                "dept",
                "Department",
                "DEPARTMENT",
                "program",
                "course",
                "courseName",
                "Programme",
                "programme"
            ],
            ""
        );

    const year =
        getField(
            data,

                "Year",
                "YEAR",
                "studyYear",
                "academicYear",
                "studentYear",
                "YearOfStudy"
            ],

        );

    const section =

            data,
            [
                "section",
                "Section",
                "SECTION",
                "sec",
                "classSection",
                "SectionName"
            ],
            ""
        );

    return {

        rollNo:

        name:

        department:
            String(department).trim(),

        departmentKey:
            normalizeDepartment(department),

        year:

        section:

    };

}

function showStatus(message) {

/* =========================================================
   TOAST
========================================================= */

function showToast(message) {

    toast.textContent = message;

    toast.style.display = "block";

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {
                toast.style.display =
                    "none";
            },
            3000
        );

}

                );

                allStudents.push(
                    makeStudent(
                        documentSnapshot.id,
                        data
                    )
                );

            }
        );

        allStudents.sort(
            (a,b) =>
                compareRollNumbers(
                    a.rollNo,
                    b.rollNo
                )
        );

        totalStudents.textContent =
            allStudents.length;

        buildFilters();

        applyStudentFilters();

        showStatus(
            `${allStudents.length} students loaded successfully.`
        );

        setTimeout(
            hideStatus,
            2500
        );

        console.log(
            "TOTAL STUDENTS:",
            allStudents.length
        );

    }
    catch(error) {

        console.error(
            "STUDENT LOAD ERROR:",
            error
        );

        showStatus(
            "Error loading students: " +
            error.message
        );

        showToast(
            "Failed to load students."
        );

    }

}


/* =========================================================
   LOAD SUBJECTS
========================================================= */

async function loadSubjects() {

    try {

        console.log(
            "========================================"
        );

        console.log(
            "LOADING SUBJECTS"
        );

        console.log(
            "Collection:",
            SUBJECTS_COLLECTION
        );

        console.log(
            "========================================"
        );

        const snapshot =
            await getDocs(
                collection(
                    db,
                    SUBJECTS_COLLECTION
                )
            );

        allSubjects = [];

        snapshot.forEach(
            documentSnapshot => {

                const data =
                    documentSnapshot.data();

                console.log(
                    "SUBJECT:",
                    documentSnapshot.id,
                    data
                );

                allSubjects.push(
                    makeSubject(
                        documentSnapshot.id,
                        data
                    )
                );

            }
        );

        allSubjects.sort(
            (a,b) => {

                const codeCompare =
                    a.code.localeCompare(
                        b.code,
                        undefined,
                        {
                            numeric:true,
                            sensitivity:"base"
                        }
                    );

                if (codeCompare !== 0) {
                    return codeCompare;
                }

                return a.name.localeCompare(
                    b.name
                );

            }
        );

        applySubjectSearch();

        console.log(
            "TOTAL SUBJECTS:",
            allSubjects.length
        );

    }
    catch(error) {

        console.error(
            "SUBJECT LOAD ERROR:",
            error
        );

        subjectList.innerHTML =
            `
            <div class="empty">
                Error loading subjects.<br><br>
                ${escapeHtml(error.message)}
            </div>
            `;

    }

}


/* =========================================================
   BUILD FILTERS
========================================================= */

function buildFilters() {

    const departments =
        [...new Set(
            allStudents
                .map(
                    student =>
                        student.department
                )
                .filter(Boolean)
        )].sort(
            (a,b) =>
                a.localeCompare(b)
        );


    const years =
        [...new Set(
            allStudents
                .map(
                    student =>
                        student.year
                )
                .filter(Boolean)
        )].sort(
            (a,b) =>
                Number(a) - Number(b)
        );


    const sections =
        [...new Set(
            allStudents
                .map(
                    student =>
                        student.section
                )
                .filter(Boolean)
        )].sort(
            (a,b) =>
                a.localeCompare(b)
        );


    departmentFilter.innerHTML =
        `<option value="">All Departments</option>`;

    departments.forEach(
        department => {

            const option =
                document.createElement("option");

            option.value =
                department;

            option.textContent =
                department;

            departmentFilter.appendChild(
                option
            );

        }
    );


    yearFilter.innerHTML =
        `<option value="">All Years</option>`;

    years.forEach(
        year => {

            const option =
                document.createElement("option");

            option.value =
                year;

            option.textContent =
                `Year ${year}`;

            yearFilter.appendChild(
                option
            );

        }
    );


    sectionFilter.innerHTML =
        `<option value="">All Sections</option>`;

    sections.forEach(
        section => {

            const option =
                document.createElement("option");

            option.value =
                section;

            option.textContent =
                `Section ${section}`;

            sectionFilter.appendChild(
                option
            );

        }
    );

}


/* =========================================================
   APPLY STUDENT FILTERS
========================================================= */

function applyStudentFilters() {

    const department =
        normalizeDepartment(
            departmentFilter.value
        );

    const year =
        normalizeYear(
            yearFilter.value
        );

    const section =
        normalizeSection(
            sectionFilter.value
        );

    const roll =
        rollSearch.value
            .trim()
            .toUpperCase();

    const search =
        studentSearch.value
            .trim()
            .toUpperCase();


    filteredStudents =
        allStudents.filter(
            student => {

                const matchesDepartment =
                    !department ||
                    student.departmentKey ===
                    department;

                const matchesYear =
                    !year ||
                    student.year === year;

                const matchesSection =
                    !section ||
                    student.section === section;

                const matchesRoll =
                    !roll ||
                    student.rollNo
                        .toUpperCase()
                        .includes(roll);

                const searchText =
                    (
                        student.name +
                        " " +
                        student.registerNo +
                        " " +
                        student.rollNo
                    ).toUpperCase();

                const matchesSearch =
                    !search ||
                    searchText.includes(search);


                return (
                    matchesDepartment &&
                    matchesYear &&
                    matchesSection &&
                    matchesRoll &&
                    matchesSearch
                );

            }
        );


    filteredStudents.sort(
        (a,b) =>
            compareRollNumbers(
                a.rollNo,
                b.rollNo
            )
    );


    visibleStudents.textContent =
        filteredStudents.length;

    renderStudents();

    updateStudentSelectionUI();

}


/* =========================================================
   APPLY SUBJECT FILTER
   IMPORTANT:
   SUBJECTS FILTER BY DEPARTMENT
========================================================= */

function applySubjectSearch() {

    const selectedDepartment =
        normalizeDepartment(
            departmentFilter.value
        );

    const selectedYear =
        normalizeYear(
            yearFilter.value
        );

    const search =
        subjectSearch.value
            .trim()
            .toUpperCase();


    filteredSubjects =
        allSubjects.filter(
            subject => {

                /*
                 * When a department is selected,
                 * ONLY subjects belonging to that
                 * department are shown.
                 *
                 * Subjects without a department
                 * are NOT shown when a department
                 * is selected.
                 */

                const matchesDepartment =
                    !selectedDepartment ||
                    subject.departmentKey ===
                    selectedDepartment;


                /*
                 * If Year is selected, restrict
                 * subjects to that year.
                 *
                 * Blank subject year is allowed
                 * so that common/general subjects
                 * are not unnecessarily hidden.
                 */

                const matchesYear =
                    !selectedYear ||
                    !subject.year ||
                    subject.year === selectedYear;


                const searchText =
                    (
                        subject.code +
                        " " +
                        subject.name +
                        " " +
                        subject.department
                    ).toUpperCase();

                const matchesSearch =
                    !search ||
                    searchText.includes(search);


                return (
                    matchesDepartment &&
                    matchesYear &&
                    matchesSearch
                );

            }
        );


    subjectContext.textContent =
        selectedDepartment
            ? (
                selectedYear
                    ? `${departmentFilter.value} - Year ${selectedYear}`
                    : departmentFilter.value
              )
            : "All Departments";


    renderSubjects();

    updateSubjectSelectionUI();

}


/* =========================================================
   RENDER STUDENTS
========================================================= */

function renderStudents() {

    studentTableBody.innerHTML = "";


    if (filteredStudents.length === 0) {

        studentTableBody.innerHTML =
            `
            <tr>
                <td colspan="7">
                    <div class="empty">
                        No students found.
                    </div>
                </td>
            </tr>
            `;

        return;

    }


    filteredStudents.forEach(
        student => {

            const tr =
                document.createElement("tr");

            if (
                selectedStudentIds.has(
                    student.registerNo
                )
            ) {
                tr.classList.add(
                    "student-row-selected"
                );
            }


            const tdCheck =
                document.createElement("td");

            const checkbox =
                document.createElement("input");

            checkbox.type = "checkbox";

            checkbox.checked =
                selectedStudentIds.has(
                    student.registerNo
                );


            checkbox.addEventListener(
                "change",
                () => {

                    if (checkbox.checked) {

                        selectedStudentIds.add(
                            student.registerNo
                        );

                    }
                    else {

                        selectedStudentIds.delete(
                            student.registerNo
                        );

                    }

                    updateStudentSelectionUI();

                    tr.classList.toggle(
                        "student-row-selected",
                        checkbox.checked
                    );

                }
            );


            tdCheck.appendChild(
                checkbox
            );


            const tdRoll =
                document.createElement("td");

            tdRoll.textContent =
                student.rollNo || "-";


            const tdRegister =
                document.createElement("td");

            tdRegister.textContent =
                student.registerNo;


            const tdName =
                document.createElement("td");

            tdName.textContent =
                student.name;


            const tdDepartment =
                document.createElement("td");

            tdDepartment.textContent =
                student.department || "-";


            const tdYear =
                document.createElement("td");

            tdYear.textContent =
                student.year
                    ? `Year ${student.year}`
                    : "-";


            const tdSection =
                document.createElement("td");

            tdSection.textContent =
                student.section
                    ? `Section ${student.section}`
                    : "-";


            tr.appendChild(tdCheck);

            tr.appendChild(tdRoll);

            tr.appendChild(tdRegister);

            tr.appendChild(tdName);

            tr.appendChild(tdDepartment);

            tr.appendChild(tdYear);

            tr.appendChild(tdSection);


            studentTableBody.appendChild(
                tr
            );

        }
    );

}


/* =========================================================
   RENDER SUBJECTS
========================================================= */

function renderSubjects() {

    subjectList.innerHTML = "";


    if (filteredSubjects.length === 0) {

        const selectedDepartment =
            normalizeDepartment(
                departmentFilter.value
            );

        const message =
            selectedDepartment
                ? "No subjects found for the selected department/year."
                : "No subjects found.";

        subjectList.innerHTML =
            `
            <div class="empty">
                ${message}
            </div>
            `;

        return;

    }


    filteredSubjects.forEach(
        subject => {

            const div =
                document.createElement("div");

            div.className =
                "subject-item";


            if (
                selectedSubjectIds.has(
                    subject.id
                )
            ) {

                div.classList.add(
                    "selected-subject"
                );

            }


            const checkbox =
                document.createElement("input");

            checkbox.type =
                "checkbox";

            checkbox.checked =
                selectedSubjectIds.has(
                    subject.id
                );


            checkbox.addEventListener(
                "change",
                () => {

                    if (checkbox.checked) {

                        selectedSubjectIds.add(
                            subject.id
                        );

                    }
                    else {

                        selectedSubjectIds.delete(
                            subject.id
                        );

                    }

                    div.classList.toggle(
                        "selected-subject",
                        checkbox.checked
                    );

                    updateSubjectSelectionUI();

                }
            );


            const content =
                document.createElement("div");

            const code =
                document.createElement("div");

            code.className =
                "subject-code";

            code.textContent =
                subject.code || "NO CODE";


            const name =
                document.createElement("div");

            name.className =
                "subject-name";

            name.textContent =
                subject.name;


            const meta =
                document.createElement("div");

            meta.className =
                "subject-meta";

            let metaText =
                subject.department || "Department not specified";

            if (subject.year) {

                metaText +=
                    ` • Year ${subject.year}`;

            }

            meta.textContent =
                metaText;


            content.appendChild(code);

            content.appendChild(name);

            content.appendChild(meta);


            div.appendChild(checkbox);

            div.appendChild(content);


            div.addEventListener(
                "click",
                event => {

                    if (
                        event.target === checkbox
                    ) {
                        return;
                    }

                    checkbox.checked =
                        !checkbox.checked;

                    checkbox.dispatchEvent(
                        new Event("change")
                    );

                }
            );


            subjectList.appendChild(div);

        }
    );

}


/* =========================================================
   UPDATE STUDENT SELECTION
========================================================= */

function updateStudentSelectionUI() {

    selectedStudents.textContent =
        selectedStudentIds.size;


    const visibleIds =
        filteredStudents.map(
            student =>
                student.registerNo
        );


    const selectedVisibleCount =
        visibleIds.filter(
            id =>
                selectedStudentIds.has(id)
        ).length;


    selectAllStudentsCheck.checked =
        filteredStudents.length > 0 &&
        selectedVisibleCount ===
        filteredStudents.length;


    selectAllStudentsCheck.indeterminate =
        selectedVisibleCount > 0 &&
        selectedVisibleCount <
        filteredStudents.length;

}


/* =========================================================
   UPDATE SUBJECT SELECTION
========================================================= */

function updateSubjectSelectionUI() {

    selectedSubjects.textContent =
        selectedSubjectIds.size;


    const visibleIds =
        filteredSubjects.map(
            subject =>
                subject.id
        );


    const selectedVisibleCount =
        visibleIds.filter(
            id =>
                selectedSubjectIds.has(id)
        ).length;


    document.getElementById(
        "selectAllSubjectsBtn"
    ).textContent =
        filteredSubjects.length > 0 &&
        selectedVisibleCount ===
        filteredSubjects.length
            ? "Clear All Visible"
            : "Select All Visible";

}


/* =========================================================
   GET EXISTING ASSIGNMENT
========================================================= */

async function getExistingAssignment(
    registerNo
) {

    try {

        const assignmentRef =
            doc(
                db,
                ASSIGNMENT_COLLECTION,
                registerNo
            );

        const snapshot =
            await getDoc(
                assignmentRef
            );


        if (!snapshot.exists()) {

            return {
                subjectIds: [],
                subjects: []
            };

        }


        const data =
            snapshot.data();


        const existingIds =
            Array.isArray(
                data.subjectIds
            )
                ? data.subjectIds
                : [];


        const existingSubjects =
            Array.isArray(
                data.subjects
            )
                ? data.subjects
                : [];


        return {

            subjectIds:
                existingIds,

            subjects:
                existingSubjects

        };

    }
    catch(error) {

        console.error(
            "GET ASSIGNMENT ERROR:",
            registerNo,
            error
        );

        return {
            subjectIds: [],
            subjects: []
        };

    }

}


/* =========================================================
   OPEN ASSIGNMENT CONFIRMATION
========================================================= */

function openAssignmentModal() {

    if (
        selectedStudentIds.size === 0
    ) {

        showToast(
            "Please select at least one student."
        );

        return;

    }


    if (
        selectedSubjectIds.size === 0
    ) {

        showToast(
            "Please select at least one subject."
        );

        return;

    }


    const studentCount =
        selectedStudentIds.size;

    const subjectCount =
        selectedSubjectIds.size;


    confirmText.innerHTML =
        `
        You are about to assign
        <strong>${subjectCount}</strong>
        subject(s) to
        <strong>${studentCount}</strong>
        student(s).
        <br><br>
        Existing subjects will be preserved
        and duplicate subjects will not be added.
        `;


    confirmModal.style.display =
        "flex";

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal() {

    confirmModal.style.display =
        "none";

}


/* =========================================================
   ASSIGN SUBJECTS
========================================================= */

async function assignSubjects() {

    closeModal();


    if (
        selectedStudentIds.size === 0 ||
        selectedSubjectIds.size === 0
    ) {

        return;

    }


    const studentsToAssign =
        allStudents.filter(
            student =>
                selectedStudentIds.has(
                    student.registerNo
                )
        );


    const subjectsToAssign =
        allSubjects.filter(
            subject =>
                selectedSubjectIds.has(
                    subject.id
                )
        );


    progressArea.style.display =
        "block";

    progressFill.style.width =
        "0%";

    progressText.textContent =
        "Starting...";


    let completed = 0;

    let successCount = 0;

    let errorCount = 0;


    for (
        const student
        of studentsToAssign
    ) {

        try {

            console.log(
                "ASSIGNING SUBJECTS TO:",
                student
            );


            const existing =
                await getExistingAssignment(
                    student.registerNo
                );


            const subjectIdSet =
                new Set(
                    existing.subjectIds
                );


            const subjectObjects =
                Array.isArray(
                    existing.subjects
                )
                    ? [...existing.subjects]
                    : [];


            for (
                const subject
                of subjectsToAssign
            ) {

                if (
                    !subjectIdSet.has(
                        subject.id
                    )
                ) {

                    subjectIdSet.add(
                        subject.id
                    );


                    const alreadyObject =
                        subjectObjects.some(
                            existingSubject =>
                                existingSubject.id ===
                                subject.id
                        );


                    if (!alreadyObject) {

                        subjectObjects.push({

                            id:
                                subject.id,

                            code:
                                subject.code,

                            name:
                                subject.name,

                            department:
                                subject.department,

                            year:
                                subject.year

                        });

                    }

                }

            }


            const assignmentRef =
                doc(
                    db,
                    ASSIGNMENT_COLLECTION,
                    student.registerNo
                );


            const batch =
                writeBatch(db);


            batch.set(
                assignmentRef,
                {

                    registerNo:
                        student.registerNo,

                    rollNo:
                        student.rollNo,

                    studentName:
                        student.name,

                    department:
                        student.department,

                    year:
                        student.year,

                    section:
                        student.section,

                    subjectIds:
                        [...subjectIdSet],

                    subjects:
                        subjectObjects,

                    updatedAt:
                        serverTimestamp()

                },
                {
                    merge:true
                }
            );


            await batch.commit();


            successCount++;

        }
        catch(error) {

            errorCount++;

            console.error(
                "ASSIGNMENT ERROR:",
                student.registerNo,
                error
            );

        }


        completed++;

        const percentage =
            Math.round(
                (
                    completed /
                    studentsToAssign.length
                ) * 100
            );


        progressFill.style.width =
            percentage + "%";

        progressText.textContent =
            `${percentage}% (${completed}/${studentsToAssign.length})`;

    }


    if (errorCount === 0) {

        showToast(
            `Successfully processed ${successCount} student(s).`
        );

    }
    else {

        showToast(
            `${successCount} succeeded, ${errorCount} failed.`
        );

    }


    progressText.textContent =
        "Completed";


    setTimeout(
        () => {

            progressArea.style.display =
                "none";

        },
        2500
    );

}


/* =========================================================
   SELECT ALL STUDENTS
========================================================= */

function selectAllVisibleStudents() {

    filteredStudents.forEach(
        student => {

            selectedStudentIds.add(
                student.registerNo
            );

        }
    );

    renderStudents();

    updateStudentSelectionUI();

}


/* =========================================================
   CLEAR STUDENTS
========================================================= */

function clearStudentSelection() {

    selectedStudentIds.clear();

    renderStudents();

    updateStudentSelectionUI();

}


/* =========================================================
   SELECT ALL SUBJECTS
========================================================= */

function selectAllVisibleSubjects() {

    const allVisibleSelected =
        filteredSubjects.length > 0 &&
        filteredSubjects.every(
            subject =>
                selectedSubjectIds.has(
                    subject.id
                )
        );


    if (allVisibleSelected) {

        filteredSubjects.forEach(
            subject => {

                selectedSubjectIds.delete(
                    subject.id
                );

            }
        );

    }
    else {

        filteredSubjects.forEach(
            subject => {

                selectedSubjectIds.add(
                    subject.id
                );

            }
        );

    }


    renderSubjects();

    updateSubjectSelectionUI();

}


/* =========================================================
   CLEAR SUBJECTS
========================================================= */

function clearSubjectSelection() {

    selectedSubjectIds.clear();

    renderSubjects();

    updateSubjectSelectionUI();

}


/* =========================================================
   CLEAR FILTERS
========================================================= */

function clearFilters() {

    departmentFilter.value =
        "";

    yearFilter.value =
        "";

    sectionFilter.value =
        "";

    rollSearch.value =
        "";

    studentSearch.value =
        "";

    subjectSearch.value =
        "";


    selectedStudentIds.clear();

    selectedSubjectIds.clear();


    applyStudentFilters();

    applySubjectSearch();


    showToast(
        "Filters cleared."
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   DEPARTMENT / YEAR CHANGE
========================================================= */

function studentContextChanged() {

    /*
     * Student list changes according to
     * Department / Year / Section.
     */

    applyStudentFilters();


    /*
     * Subject list MUST also change when
     * Department or Year changes.
     */

    selectedSubjectIds.clear();

    applySubjectSearch();

    updateSubjectSelectionUI();

}


/* =========================================================
   EVENT LISTENERS
========================================================= */


/* Department */

departmentFilter.addEventListener(
    "change",
    () => {

        studentContextChanged();

    }
);


/* Year */

yearFilter.addEventListener(
    "change",
    () => {

        studentContextChanged();

    }
);


/* Section */

sectionFilter.addEventListener(
    "change",
    () => {

        applyStudentFilters();

    }
);


/* Roll Search */

rollSearch.addEventListener(
    "input",
    () => {

        applyStudentFilters();

    }
);


/* Student Search */

studentSearch.addEventListener(
    "input",
    () => {

        applyStudentFilters();

    }
);


/* Subject Search */

subjectSearch.addEventListener(
    "input",
    () => {

        applySubjectSearch();

    }
);


/* Load Students */

document.getElementById(
    "loadStudentsBtn"
).addEventListener(
    "click",
    loadStudents
);


/* Refresh */

document.getElementById(
    "refreshBtn"
).addEventListener(
    "click",
    async () => {

        selectedStudentIds.clear();

        selectedSubjectIds.clear();

        await loadStudents();

        await loadSubjects();

        showToast(
            "Data refreshed."
        );

    }
);


/* Clear Filters */

document.getElementById(
    "clearFiltersBtn"
).addEventListener(
    "click",
    clearFilters
);


/* Select All Students Button */

document.getElementById(
    "selectAllStudentsBtn"
).addEventListener(
    "click",
    selectAllVisibleStudents
);


/* Clear Student Selection */

document.getElementById(
    "clearStudentSelectionBtn"
).addEventListener(
    "click",
    clearStudentSelection
);


/* Select All Students Checkbox */

selectAllStudentsCheck.addEventListener(
    "change",
    () => {

        if (
            selectAllStudentsCheck.checked
        ) {

            selectAllVisibleStudents();

        }
        else {

            clearStudentSelection();

        }

    }
);


/* Select All Subjects */

document.getElementById(
    "selectAllSubjectsBtn"
).addEventListener(
    "click",
    selectAllVisibleSubjects
);


/* Clear Subject Selection */

document.getElementById(
    "clearSubjectSelectionBtn"
).addEventListener(
    "click",
    clearSubjectSelection
);


/* Assign */

document.getElementById(
    "assignBtn"
).addEventListener(
    "click",
    openAssignmentModal
);


/* Cancel Modal */

document.getElementById(
    "cancelModalBtn"
).addEventListener(
    "click",
    closeModal
);


/* Confirm Assignment */

document.getElementById(
    "confirmAssignBtn"
).addEventListener(
    "click",
    assignSubjects
);


/* Close modal outside */

confirmModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            confirmModal
        ) {

            closeModal();

        }

    }
);
