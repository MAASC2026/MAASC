<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Event Request</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
    color:#333;
}

/* ================= HEADER ================= */

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:70px;
    background:#500454;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
    color:white;
    box-shadow:0 2px 10px rgba(0,0,0,.25);
    z-index:1000;
}

.header h2{
    font-size:24px;
}

.user{
    font-size:15px;
}

/* ================= MAIN ================= */

.main{
    max-width:1100px;
    margin:100px auto 50px;
    padding:20px;
}

/* ================= CARD ================= */

.card{
    background:white;
    border-radius:12px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.card h3{
    margin-bottom:20px;
    color:#500454;
    border-bottom:1px solid #eee;
    padding-bottom:12px;
}

/* ================= FORM ================= */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:14px;
    outline:none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#500454;
}

.form-group textarea{
    resize:vertical;
    min-height:90px;
}

/* ================= DEPARTMENT BOX ================= */

.department-box{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    background:#fafafa;
}

.department-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 5px;
    border-bottom:1px solid #eee;
}

.department-item:last-child{
    border-bottom:none;
}

.department-item input{
    width:auto;
}

.department-name{
    font-weight:600;
}

.department-info{
    margin-top:8px;
    color:#666;
    font-size:13px;
}

/* ================= GUEST ================= */

.guest-row{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:10px;
    margin-bottom:10px;
}

.guest-row button{
    background:#dc3545;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
}

.add-guest{
    background:#198754;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:6px;
    cursor:pointer;
}

/* ================= BUTTON ================= */

.submit-btn{
    width:100%;
    background:#500454;
    color:white;
    border:none;
    padding:14px;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.submit-btn:hover{
    background:#3d033f;
}

.submit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* ================= TABLE ================= */

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
    vertical-align:top;
}

th{
    background:#500454;
    color:white;
}

tr:hover{
    background:#fafafa;
}

/* ================= STATUS ================= */

.status{
    display:inline-block;
    padding:5px 10px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
}

.pending{
    background:#fff3cd;
    color:#856404;
}

.approved{
    background:#d1e7dd;
    color:#0f5132;
}

.rejected{
    background:#f8d7da;
    color:#842029;
}

.forwarded{
    background:#cfe2ff;
    color:#084298;
}

/* ================= LOADING ================= */

.loading{
    text-align:center;
    padding:20px;
    color:#666;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .header{
        padding:0 15px;
    }

    .header h2{
        font-size:18px;
    }

    .user{
        font-size:12px;
    }

    .main{
        margin-top:90px;
        padding:10px;
    }

    .card{
        padding:15px;
    }

    .guest-row{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <h2>Event Request</h2>

    <div class="user">
        <span id="userName">Loading...</span>
    </div>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="main">


<!-- =====================================================
     EVENT FORM
===================================================== -->

<div class="card">

    <h3>Create Event Request</h3>

    <form id="eventForm">


        <!-- ================= EVENT NAME ================= -->

        <div class="form-group">

            <label>
                Event Name
            </label>

            <input
                type="text"
                id="eventName"
                required
                placeholder="Enter event name"
            >

        </div>


        <!-- ================= EVENT TYPE ================= -->

        <div class="form-group">

            <label>
                Event Type
            </label>

            <select
                id="eventType"
                required
            >

                <option value="">
                    Select Event Type
                </option>

                <option value="Academic">
                    Academic
                </option>

                <option value="Cultural">
                    Cultural
                </option>

                <option value="Sports">
                    Sports
                </option>

                <option value="Workshop">
                    Workshop
                </option>

                <option value="Seminar">
                    Seminar
                </option>

                <option value="Conference">
                    Conference
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <!-- =================================================
             ORGANISING DEPARTMENTS
        ================================================== -->

        <div class="form-group">

            <label>
                Organising Department(s)
            </label>

            <div
                id="departmentContainer"
                class="department-box"
            >

                <div class="loading">
                    Loading departments...
                </div>

            </div>

            <div class="department-info">
                Select all departments for which this event
                is being organised.
            </div>

        </div>


        <!-- ================= EVENT DATE ================= -->

        <div class="form-group">

            <label>
                Event Date
            </label>

            <input
                type="date"
                id="eventDate"
                required
            >

        </div>


        <!-- ================= START TIME ================= -->

        <div class="form-group">

            <label>
                Start Time
            </label>

            <input
                type="time"
                id="startTime"
                required
            >

        </div>


        <!-- ================= END TIME ================= -->

        <div class="form-group">

            <label>
                End Time
            </label>

            <input
                type="time"
                id="endTime"
                required
            >

        </div>


        <!-- ================= VENUE ================= -->

        <div class="form-group">

            <label>
                Venue
            </label>

            <input
                type="text"
                id="venue"
                required
                placeholder="Enter venue"
            >

        </div>


        <!-- ================= PARTICIPANTS ================= -->

        <div class="form-group">

            <label>
                Number of Participants
            </label>

            <input
                type="number"
                id="participants"
                min="1"
                required
                placeholder="Enter number of participants"
            >

        </div>


        <!-- =================================================
             FORWARD DEPARTMENT
        ================================================== -->

        <div class="form-group">

            <label>
                Department to be Forwarded
            </label>

            <input
                type="text"
                id="targetDepartment"
                placeholder="Dean will decide"
            >

        </div>


        <!-- ================= DESCRIPTION ================= -->

        <div class="form-group">

            <label>
                Description
            </label>

            <textarea
                id="description"
                placeholder="Enter event description"
            ></textarea>

        </div>


        <!-- ================= PURPOSE ================= -->

        <div class="form-group">

            <label>
                Purpose
            </label>

            <textarea
                id="purpose"
                placeholder="Enter purpose of the event"
            ></textarea>

        </div>


        <!-- ================= REQUIREMENTS ================= -->

        <div class="form-group">

            <label>
                Requirements
            </label>

            <textarea
                id="requirements"
                placeholder="Enter requirements"
            ></textarea>

        </div>


        <!-- =================================================
             GUESTS
        ================================================== -->

        <div class="form-group">

            <label>
                Guests
            </label>

            <div id="guestContainer">

                <div class="guest-row">

                    <input
                        type="text"
                        class="guest-name"
                        placeholder="Guest Name"
                    >

                    <input
                        type="text"
                        class="guest-designation"
                        placeholder="Designation / Organisation"
                    >

                    <button
                        type="button"
                        onclick="removeGuest(this)"
                    >
                        Remove
                    </button>

                </div>

            </div>

            <button
                type="button"
                class="add-guest"
                onclick="addGuest()"
            >
                + Add Guest
            </button>

        </div>


        <!-- ================= SUBMIT ================= -->

        <button
            type="submit"
            class="submit-btn"
            id="submitBtn"
        >
            Submit Event Request
        </button>

    </form>

</div>


<!-- =====================================================
     MY REQUESTS
===================================================== -->

<div class="card">

    <h3>My Event Requests</h3>

    <div
        id="requestLoading"
        class="loading"
        style="display:none;"
    >
        Loading requests...
    </div>

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>
                        Event
                    </th>

                    <th>
                        Organising Department(s)
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Venue
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Dean Remarks
                    </th>

                    <th>
                        Forwarded Department
                    </th>

                </tr>

            </thead>

            <tbody id="requestTable">

            </tbody>

        </table>

    </div>

</div>


</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import { db } from "./firebase-config.js";

import {
    collection,
    addDoc,
    query,
    where,
    getDocs,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   SESSION
===================================================== */

const staffId =
    sessionStorage.getItem("staffId");

const staffName =
    sessionStorage.getItem("staffName");


/*
=========================================================
IMPORTANT

A Head may now have MULTIPLE departments.

Supported sessionStorage formats:

1.
departments = ["IT","Computer Science"]

2.
departments = '["IT","Computer Science"]'

3.
departments = "IT,Computer Science"

4.
department = "IT,Computer Science"

5.
department = "IT"

The code below supports all of them.
=========================================================
*/


let headDepartments = [];


/* =====================================================
   NORMALISE DEPARTMENT
===================================================== */

function normaliseDepartment(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .trim()
        .replace(/\s+/g," ");

}


/* =====================================================
   ADD UNIQUE DEPARTMENT
===================================================== */

function addUniqueDepartment(value){

    const department =
        normaliseDepartment(value);

    if(!department){
        return;
    }

    const exists =
        headDepartments.some(
            d =>
                d.toLowerCase() ===
                department.toLowerCase()
        );

    if(!exists){

        headDepartments.push(
            department
        );

    }

}


/* =====================================================
   READ MULTIPLE DEPARTMENTS
===================================================== */

function readDepartmentValue(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return;

    }


    /*
       JSON ARRAY
    */

    if(typeof value === "string"){

        const trimmed =
            value.trim();

        if(
            trimmed.startsWith("[") &&
            trimmed.endsWith("]")
        ){

            try{

                const parsed =
                    JSON.parse(trimmed);

                if(Array.isArray(parsed)){

                    parsed.forEach(
                        item =>
                            addUniqueDepartment(item)
                    );

                    return;

                }

            }
            catch(error){

                console.warn(
                    "Unable to parse department JSON",
                    error
                );

            }

        }

    }


    /*
       REAL ARRAY
    */

    if(Array.isArray(value)){

        value.forEach(
            item =>
                addUniqueDepartment(item)
        );

        return;

    }


    /*
       COMMA / PIPE SEPARATED
    */

    if(typeof value === "string"){

        const parts =
            value.split(/[,\|]/);

        parts.forEach(
            part =>
                addUniqueDepartment(part)
        );

        return;

    }


    /*
       SINGLE VALUE
    */

    addUniqueDepartment(value);

}


/* =====================================================
   LOAD DEPARTMENTS FROM SESSION
===================================================== */

function loadDepartmentsFromSession(){

    headDepartments = [];


    /*
       Preferred:
       departments
    */

    const departments =
        sessionStorage.getItem(
            "departments"
        );


    if(departments){

        readDepartmentValue(
            departments
        );

    }


    /*
       Backward compatibility:
       department
    */

    const department =
        sessionStorage.getItem(
            "department"
        );


    if(department){

        readDepartmentValue(
            department
        );

    }


    /*
       Additional possible key:
       headDepartments
    */

    const storedHeadDepartments =
        sessionStorage.getItem(
            "headDepartments"
        );


    if(storedHeadDepartments){

        readDepartmentValue(
            storedHeadDepartments
        );

    }


    /*
       Remove duplicate departments
    */

    headDepartments =
        [...new Set(
            headDepartments
        )];


    console.log(
        "HEAD DEPARTMENTS:",
        headDepartments
    );

}


/* =====================================================
   DISPLAY USER
===================================================== */

document.getElementById(
    "userName"
).textContent =
    staffName || staffId || "Staff";


/* =====================================================
   LOGIN CHECK
===================================================== */

if(!staffId){

    alert(
        "Please Login"
    );

    window.location.href =
        "login.html";

    throw new Error(
        "No staff ID found"
    );

}


/* =====================================================
   LOAD DEPARTMENTS
===================================================== */

loadDepartmentsFromSession();


/* =====================================================
   DISPLAY DEPARTMENTS
===================================================== */

function displayDepartments(){

    const container =
        document.getElementById(
            "departmentContainer"
        );


    container.innerHTML = "";


    if(headDepartments.length === 0){

        container.innerHTML = `

            <div
                style="
                    color:#dc3545;
                    padding:10px;
                    font-weight:bold;
                "
            >
                No department assigned to this Head.
                Please check the Head department assignment.
            </div>

        `;

        return;

    }


    headDepartments.forEach(
        (department,index) => {

            const wrapper =
                document.createElement(
                    "label"
                );

            wrapper.className =
                "department-item";


            const checkbox =
                document.createElement(
                    "input"
                );

            checkbox.type =
                "checkbox";

            checkbox.className =
                "department-checkbox";

            checkbox.value =
                department;


            /*
               If only one department,
               select automatically.
            */

            if(headDepartments.length === 1){

                checkbox.checked =
                    true;

            }


            const text =
                document.createElement(
                    "span"
                );

            text.className =
                "department-name";

            text.textContent =
                department;


            wrapper.appendChild(
                checkbox
            );

            wrapper.appendChild(
                text
            );

            container.appendChild(
                wrapper
            );

        }
    );

}


/* =====================================================
   DISPLAY
===================================================== */

displayDepartments();


/* =====================================================
   GET SELECTED DEPARTMENTS
===================================================== */

function getSelectedDepartments(){

    const checkboxes =
        document.querySelectorAll(
            ".department-checkbox:checked"
        );


    return Array.from(
        checkboxes
    )
    .map(
        checkbox =>
            normaliseDepartment(
                checkbox.value
            )
    )
    .filter(
        value => value !== ""
    );

}


/* =====================================================
   GUEST
===================================================== */

window.addGuest = function(){

    const container =
        document.getElementById(
            "guestContainer"
        );


    const row =
        document.createElement(
            "div"
        );

    row.className =
        "guest-row";


    row.innerHTML = `

        <input
            type="text"
            class="guest-name"
            placeholder="Guest Name"
        >

        <input
            type="text"
            class="guest-designation"
            placeholder="Designation / Organisation"
        >

        <button
            type="button"
            onclick="removeGuest(this)"
        >
            Remove
        </button>

    `;


    container.appendChild(
        row
    );

};


window.removeGuest = function(button){

    const container =
        document.getElementById(
            "guestContainer"
        );


    const rows =
        container.querySelectorAll(
            ".guest-row"
        );


    /*
       Keep at least one row.
    */

    if(rows.length <= 1){

        rows[0]
            .querySelector(
                ".guest-name"
            ).value = "";

        rows[0]
            .querySelector(
                ".guest-designation"
            ).value = "";

        return;

    }


    button
        .closest(".guest-row")
        .remove();

};


/* =====================================================
   GET GUESTS
===================================================== */

function getGuests(){

    const rows =
        document.querySelectorAll(
            ".guest-row"
        );


    const guests = [];


    rows.forEach(
        row => {

            const name =
                row.querySelector(
                    ".guest-name"
                )?.value.trim() || "";


            const designation =
                row.querySelector(
                    ".guest-designation"
                )?.value.trim() || "";


            if(
                name ||
                designation
            ){

                guests.push({

                    name:
                        name,

                    designation:
                        designation

                });

            }

        }
    );


    return guests;

}


/* =====================================================
   SUBMIT EVENT
===================================================== */

document.getElementById(
    "eventForm"
)
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        /* ================================
           GET DEPARTMENTS
        ================================= */

        const selectedDepartments =
            getSelectedDepartments();


        if(
            selectedDepartments.length === 0
        ){

            alert(
                "Please select at least one Organising Department."
            );

            return;

        }


        /* ================================
           GET FORM VALUES
        ================================= */

        const eventName =
            document.getElementById(
                "eventName"
            ).value.trim();


        const eventType =
            document.getElementById(
                "eventType"
            ).value;


        const eventDate =
            document.getElementById(
                "eventDate"
            ).value;


        const startTime =
            document.getElementById(
                "startTime"
            ).value;


        const endTime =
            document.getElementById(
                "endTime"
            ).value;


        const venue =
            document.getElementById(
                "venue"
            ).value.trim();


        const participants =
            document.getElementById(
                "participants"
            ).value;


        const targetDepartment =
            document.getElementById(
                "targetDepartment"
            ).value.trim();


        const description =
            document.getElementById(
                "description"
            ).value.trim();


        const purpose =
            document.getElementById(
                "purpose"
            ).value.trim();


        const requirements =
            document.getElementById(
                "requirements"
            ).value.trim();


        const guests =
            getGuests();


        /* ================================
           TIME CHECK
        ================================= */

        if(startTime >= endTime){

            alert(
                "End time must be later than start time."
            );

            return;

        }


        /* ================================
           BUTTON
        ================================= */

        const submitBtn =
            document.getElementById(
                "submitBtn"
            );


        submitBtn.disabled =
            true;


        submitBtn.textContent =
            "Submitting...";


        try{


            /* =========================================
               FIRESTORE

               NEW:
               organisingDepartments = array

               OLD:
               organisingDepartment = first department

               This keeps compatibility with
               existing records.
            ========================================= */

            await addDoc(

                collection(
                    db,
                    "eventRequests"
                ),

                {

                    /* ================= EVENT ================= */

                    eventName:
                        eventName,

                    eventType:
                        eventType,

                    eventDate:
                        eventDate,

                    startTime:
                        startTime,

                    endTime:
                        endTime,

                    venue:
                        venue,

                    participants:
                        Number(participants),


                    /* =========================================
                       MULTIPLE ORGANISING DEPARTMENTS
                    ========================================= */

                    organisingDepartments:
                        selectedDepartments,


                    /*
                       Backward compatibility.

                       For an event belonging to multiple
                       departments, this contains the first
                       department.
                    */

                    organisingDepartment:
                        selectedDepartments[0],


                    /* ================= REQUESTER ================= */

                    requestedByStaffId:
                        staffId,

                    requestedByStaffName:
                        staffName || "",


                    /* ================= FORWARD ================= */

                    targetDepartment:
                        targetDepartment,


                    /* ================= DETAILS ================= */

                    description:
                        description,

                    purpose:
                        purpose,

                    requirements:
                        requirements,

                    guests:
                        guests,


                    /* ================= WORKFLOW ================= */

                    status:
                        "Pending Dean Approval",

                    submittedTo:
                        "Dean",

                    deanStatus:
                        "Pending",

                    deanRemarks:
                        "",


                    /* ================= FORWARD STATUS ================= */

                    forwardedByDean:
                        false,

                    forwardedToDepartment:
                        "",

                    forwardedAt:
                        null,


                    /* ================= TIMESTAMP ================= */

                    submittedAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }

            );


            alert(

                "Event Request submitted successfully.\n\n" +

                "Organising Department(s): " +

                selectedDepartments.join(", ") +

                "\n\nSent to Dean for approval."

            );


            clearForm();


            loadMyRequests();


        }
        catch(error){

            console.error(
                "Event request error:",
                error
            );


            alert(

                "Unable to submit Event Request.\n\n" +

                error.message

            );

        }
        finally{

            submitBtn.disabled =
                false;

            submitBtn.textContent =
                "Submit Event Request";

        }

    }
);


/* =====================================================
   CLEAR FORM
===================================================== */

window.clearForm = function(){

    document.getElementById(
        "eventForm"
    ).reset();


    /*
       Re-select all departments
       after form reset.
    */

    document.querySelectorAll(
        ".department-checkbox"
    )
    .forEach(
        checkbox => {

            if(headDepartments.length === 1){

                checkbox.checked =
                    true;

            }
            else{

                checkbox.checked =
                    false;

            }

        }
    );


    /*
       Reset guests
    */

    document.getElementById(
        "guestContainer"
    ).innerHTML = `

        <div class="guest-row">

            <input
                type="text"
                class="guest-name"
                placeholder="Guest Name"
            >

            <input
                type="text"
                class="guest-designation"
                placeholder="Designation / Organisation"
            >

            <button
                type="button"
                onclick="removeGuest(this)"
            >
                Remove
            </button>

        </div>

    `;

};


/* =====================================================
   LOAD MY REQUESTS
===================================================== */

async function loadMyRequests(){

    const loading =
        document.getElementById(
            "requestLoading"
        );


    const table =
        document.getElementById(
            "requestTable"
        );


    loading.style.display =
        "block";


    table.innerHTML =
        "";


    try{

        const q =
            query(

                collection(
                    db,
                    "eventRequests"
                ),

                where(
                    "requestedByStaffId",
                    "==",
                    staffId
                )

            );


        const snap =
            await getDocs(q);


        loading.style.display =
            "none";


        if(snap.empty){

            table.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="empty"
                    >
                        No event requests found.
                    </td>

                </tr>

            `;

            return;

        }


        const requests = [];


        snap.forEach(
            doc => {

                requests.push({

                    id:
                        doc.id,

                    data:
                        doc.data()

                });

            }
        );


        /*
           Newest first.
        */

        requests.sort(
            (a,b) => {

                const aTime =
                    a.data.submittedAt?.seconds || 0;

                const bTime =
                    b.data.submittedAt?.seconds || 0;

                return bTime - aTime;

            }
        );


        requests.forEach(
            item => {

                const data =
                    item.data;


                /*
                   NEW records use array.

                   OLD records use single
                   organisingDepartment.
                */

                let departments = [];


                if(
                    Array.isArray(
                        data.organisingDepartments
                    )
                ){

                    departments =
                        data.organisingDepartments;

                }
                else if(
                    data.organisingDepartment
                ){

                    departments = [
                        data.organisingDepartment
                    ];

                }


                const departmentText =
                    departments.length
                        ? departments.join(", ")
                        : "-";


                let statusClass =
                    "pending";


                const status =
                    data.status ||
                    "Pending";


                const statusLower =
                    String(status)
                        .toLowerCase();


                if(
                    statusLower.includes(
                        "approved"
                    )
                ){

                    statusClass =
                        "approved";

                }


                if(
                    statusLower.includes(
                        "rejected"
                    )
                ){

                    statusClass =
                        "rejected";

                }


                if(
                    statusLower.includes(
                        "forward"
                    )
                ){

                    statusClass =
                        "forwarded";

                }


                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>

                        <strong>
                            ${escapeHtml(
                                data.eventName || "-"
                            )}
                        </strong>

                        <br>

                        <small>
                            ${escapeHtml(
                                data.eventType || "-"
                            )}
                        </small>

                    </td>


                    <td>
                        ${escapeHtml(
                            departmentText
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            data.eventDate || "-"
                        )}
                        <br>
                        <small>
                            ${
                                escapeHtml(
                                    data.startTime || ""
                                )
                            }
                            -
                            ${
                                escapeHtml(
                                    data.endTime || ""
                                )
                            }
                        </small>
                    </td>


                    <td>
                        ${escapeHtml(
                            data.venue || "-"
                        )}
                    </td>


                    <td>

                        <span
                            class="status ${statusClass}"
                        >
                            ${escapeHtml(
                                status
                            )}
                        </span>

                    </td>


                    <td>
                        ${escapeHtml(
                            data.deanRemarks || "-"
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            data.forwardedToDepartment || "-"
                        )}
                    </td>

                `;


                table.appendChild(
                    row
                );

            }
        );


    }
    catch(error){

        console.error(
            "Load requests error:",
            error
        );


        loading.style.display =
            "none";


        table.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty"
                >

                    Unable to load event requests.

                    <br><br>

                    ${escapeHtml(
                        error.message
                    )}

                </td>

            </tr>

        `;

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   INITIAL LOAD
===================================================== */

loadMyRequests();

</script>
