<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Event Request</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
    color:#333;
}

/* ================= HEADER ================= */

.header{

    position:fixed;

    top:0;
    left:0;
    right:0;

    height:70px;

    background:#500454;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 30px;

    color:white;

    box-shadow:0 2px 10px rgba(0,0,0,.25);

    z-index:1000;
}

.header h2{
    font-size:24px;
}

.user{
    font-size:15px;
}

/* ================= MAIN ================= */

.main{

    margin-top:70px;

    padding:30px;

    max-width:1400px;

    margin-left:auto;

    margin-right:auto;
}

/* ================= CARD ================= */

.card{

    background:white;

    padding:25px;

    border-radius:10px;

    box-shadow:0 0 10px rgba(0,0,0,.12);

    margin-bottom:25px;
}

.card h2{

    color:#500454;

    margin-bottom:22px;

    font-size:23px;
}

/* ================= FORM ================= */

.form-grid{

    display:grid;

    grid-template-columns:
    repeat(2,minmax(250px,1fr));

    gap:20px;
}

.form-group{

    display:flex;

    flex-direction:column;
}

.form-group.full{

    grid-column:1/-1;
}

label{

    font-weight:bold;

    margin-bottom:7px;

    color:#444;
}

input,
select,
textarea{

    width:100%;

    padding:12px;

    border:1px solid #ccc;

    border-radius:6px;

    font-size:15px;

    outline:none;

    background:white;
}

input:focus,
select:focus,
textarea:focus{

    border-color:#500454;

    box-shadow:
    0 0 0 2px rgba(80,4,84,.08);
}

textarea{

    min-height:100px;

    resize:vertical;
}

/* ================= GUEST ================= */

.guest-section{

    margin-top:30px;

    padding:20px;

    border:1px solid #e2e2e2;

    border-radius:8px;

    background:#fafafa;
}

.guest-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:18px;
}

.guest-header h3{

    color:#500454;

    font-size:19px;
}

.add-btn{

    border:none;

    background:#500454;

    color:white;

    padding:10px 18px;

    border-radius:6px;

    cursor:pointer;

    font-weight:bold;
}

.add-btn:hover{

    background:#6e0a75;
}

.guest-row{

    display:grid;

    grid-template-columns:
    1fr 1fr 1fr 50px;

    gap:12px;

    margin-bottom:12px;

    align-items:end;
}

.remove-btn{

    height:42px;

    border:none;

    background:#dc2626;

    color:white;

    border-radius:6px;

    cursor:pointer;

    font-size:20px;

    font-weight:bold;
}

.remove-btn:hover{

    background:#b91c1c;
}

/* ================= BUTTONS ================= */

.submit-area{

    margin-top:25px;

    display:flex;

    justify-content:flex-end;

    gap:12px;
}

.submit-btn{

    background:#500454;

    color:white;

    border:none;

    padding:14px 28px;

    border-radius:7px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

.submit-btn:hover{

    background:#6e0a75;
}

.clear-btn{

    background:#6b7280;

    color:white;

    border:none;

    padding:14px 25px;

    border-radius:7px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

/* ================= TABLE ================= */

.table-wrap{

    width:100%;

    overflow-x:auto;
}

table{

    width:100%;

    border-collapse:collapse;
}

th,
td{

    padding:12px;

    border:1px solid #ddd;

    text-align:left;

    white-space:nowrap;
}

th{

    background:#500454;

    color:white;
}

tr:nth-child(even){

    background:#fafafa;
}

/* ================= STATUS ================= */

.status{

    display:inline-block;

    padding:6px 11px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;
}

.status.pending{

    background:#fff3cd;

    color:#856404;
}

.status.approved{

    background:#d1fae5;

    color:#065f46;
}

.status.rejected{

    background:#fee2e2;

    color:#991b1b;
}

.status.forwarded{

    background:#dbeafe;

    color:#1e40af;
}

.loading{

    text-align:center;

    padding:20px;

    color:#500454;

    font-weight:bold;
}

.empty{

    text-align:center;

    padding:25px;

    color:#777;
}

/* ================= RESPONSIVE ================= */

@media(max-width:850px){

    .form-grid{

        grid-template-columns:1fr;
    }

    .form-group.full{

        grid-column:auto;
    }

    .guest-row{

        grid-template-columns:1fr;
    }

    .remove-btn{

        width:100%;
    }

}

@media(max-width:600px){

    .header{

        padding:0 15px;
    }

    .header h2{

        font-size:18px;
    }

    .user{

        font-size:12px;
    }

    .main{

        padding:15px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <h2>
        EVENT REQUEST
    </h2>

    <div class="user">

        Welcome
        <span id="staffName"></span>

    </div>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="main">


<!-- =====================================================
     EVENT REQUEST FORM
===================================================== -->

<div class="card">

    <h2>
        📅 Event Request
    </h2>


    <form id="eventForm">


        <div class="form-grid">


            <!-- EVENT NAME -->

            <div class="form-group full">

                <label>
                    Event Name *
                </label>

                <input
                    type="text"
                    id="eventName"
                    placeholder="Enter event name"
                    required
                >

            </div>


            <!-- EVENT TYPE -->

            <div class="form-group">

                <label>
                    Event Type *
                </label>

                <select
                    id="eventType"
                    required
                >

                    <option value="">
                        Select Event Type
                    </option>

                    <option value="Academic">
                        Academic
                    </option>

                    <option value="Cultural">
                        Cultural
                    </option>

                    <option value="Technical">
                        Technical
                    </option>

                    <option value="Workshop">
                        Workshop
                    </option>

                    <option value="Seminar">
                        Seminar
                    </option>

                    <option value="Conference">
                        Conference
                    </option>

                    <option value="Sports">
                        Sports
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- DEPARTMENT -->

            <div class="form-group">

                <label>
                    Organising Department
                </label>

                <input
                    type="text"
                    id="department"
                    readonly
                >

            </div>


            <!-- DATE -->

            <div class="form-group">

                <label>
                    Event Date *
                </label>

                <input
                    type="date"
                    id="eventDate"
                    required
                >

            </div>


            <!-- START TIME -->

            <div class="form-group">

                <label>
                    Start Time *
                </label>

                <input
                    type="time"
                    id="startTime"
                    required
                >

            </div>


            <!-- END TIME -->

            <div class="form-group">

                <label>
                    End Time *
                </label>

                <input
                    type="time"
                    id="endTime"
                    required
                >

            </div>


            <!-- VENUE -->

            <div class="form-group">

                <label>
                    Venue *
                </label>

                <input
                    type="text"
                    id="venue"
                    placeholder="Enter venue"
                    required
                >

            </div>


            <!-- PARTICIPANTS -->

            <div class="form-group">

                <label>
                    Expected Participants *
                </label>

                <input
                    type="number"
                    id="participants"
                    min="1"
                    placeholder="Enter number"
                    required
                >

            </div>


            <!-- FORWARD DEPARTMENT -->

            <div class="form-group">

                <label>
                    Department to be Forwarded
                </label>

                <input
                    type="text"
                    id="targetDepartment"
                    placeholder="Dean will decide"
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group full">

                <label>
                    Event Description *
                </label>

                <textarea
                    id="description"
                    placeholder="Enter event description"
                    required
                ></textarea>

            </div>


            <!-- PURPOSE -->

            <div class="form-group full">

                <label>
                    Purpose / Objective *
                </label>

                <textarea
                    id="purpose"
                    placeholder="Enter purpose / objective"
                    required
                ></textarea>

            </div>


            <!-- REQUIREMENTS -->

            <div class="form-group full">

                <label>
                    Facilities / Requirements
                </label>

                <textarea
                    id="requirements"
                    placeholder="Projector, microphone, chairs, transport, refreshments, etc."
                ></textarea>

            </div>


        </div>


        <!-- =================================================
             GUEST SECTION
        ================================================== -->

        <div class="guest-section">

            <div class="guest-header">

                <h3>
                    👤 Guest Details
                </h3>

                <button
                    type="button"
                    class="add-btn"
                    onclick="addGuest()"
                >
                    + Add Guest
                </button>

            </div>


            <div id="guestContainer">

                <div class="guest-row">

                    <div class="form-group">

                        <label>
                            Guest Name
                        </label>

                        <input
                            type="text"
                            class="guestName"
                            placeholder="Guest name"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Designation
                        </label>

                        <input
                            type="text"
                            class="guestDesignation"
                            placeholder="Designation"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Organisation
                        </label>

                        <input
                            type="text"
                            class="guestOrganisation"
                            placeholder="Organisation"
                        >

                    </div>


                    <button
                        type="button"
                        class="remove-btn"
                        onclick="removeGuest(this)"
                    >
                        ×
                    </button>

                </div>

            </div>

        </div>


        <!-- =================================================
             BUTTONS
        ================================================== -->

        <div class="submit-area">

            <button
                type="button"
                class="clear-btn"
                onclick="clearForm()"
            >
                Clear
            </button>


            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                Submit Event Request
            </button>

        </div>


    </form>

</div>


<!-- =====================================================
     MY REQUESTS
===================================================== -->

<div class="card">

    <h2>
        📋 My Event Requests
    </h2>


    <div
        id="requestLoading"
        class="loading"
    >
        Loading requests...
    </div>


    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>
                        Event
                    </th>

                    <th>
                        Type
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Venue
                    </th>

                    <th>
                        Guests
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Dean Remarks
                    </th>

                </tr>

            </thead>


            <tbody id="requestTable">

            </tbody>

        </table>

    </div>

</div>


</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import { db } from "./firebase-config.js";

import {

    collection,
    addDoc,
    query,
    where,
    getDocs,
    serverTimestamp

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   SESSION
===================================================== */

const staffId =
    sessionStorage.getItem("staffId");

const staffName =
    sessionStorage.getItem("staffName");

const department =
    sessionStorage.getItem("department");


/* =====================================================
   LOGIN CHECK
===================================================== */

if(!staffId){

    alert("Please Login");

    window.location.href =
        "login.html";

}


/* =====================================================
   DISPLAY STAFF
===================================================== */

document.getElementById(
    "staffName"
).textContent =
    staffName || "";

document.getElementById(
    "department"
).value =
    department || "";


/* =====================================================
   ADD GUEST
===================================================== */

window.addGuest = function(){

    const container =
        document.getElementById(
            "guestContainer"
        );


    const row =
        document.createElement("div");

    row.className =
        "guest-row";


    row.innerHTML = `

        <div class="form-group">

            <label>
                Guest Name
            </label>

            <input
                type="text"
                class="guestName"
                placeholder="Guest name"
            >

        </div>


        <div class="form-group">

            <label>
                Designation
            </label>

            <input
                type="text"
                class="guestDesignation"
                placeholder="Designation"
            >

        </div>


        <div class="form-group">

            <label>
                Organisation
            </label>

            <input
                type="text"
                class="guestOrganisation"
                placeholder="Organisation"
            >

        </div>


        <button
            type="button"
            class="remove-btn"
            onclick="removeGuest(this)"
        >
            ×
        </button>

    `;


    container.appendChild(row);

};


/* =====================================================
   REMOVE GUEST
===================================================== */

window.removeGuest = function(button){

    const rows =
        document.querySelectorAll(
            ".guest-row"
        );


    if(rows.length <= 1){

        alert(
            "At least one guest row must remain."
        );

        return;

    }


    button
        .closest(".guest-row")
        .remove();

};


/* =====================================================
   GET GUESTS
===================================================== */

function getGuests(){

    const names =
        document.querySelectorAll(
            ".guestName"
        );

    const designations =
        document.querySelectorAll(
            ".guestDesignation"
        );

    const organisations =
        document.querySelectorAll(
            ".guestOrganisation"
        );


    const guests = [];


    for(
        let i = 0;
        i < names.length;
        i++
    ){

        const name =
            names[i].value.trim();

        const designation =
            designations[i].value.trim();

        const organisation =
            organisations[i].value.trim();


        if(
            name ||
            designation ||
            organisation
        ){

            guests.push({

                name:name,

                designation:designation,

                organisation:organisation

            });

        }

    }


    return guests;

}


/* =====================================================
   SUBMIT
===================================================== */

document.getElementById(
    "eventForm"
).addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const eventName =
            document.getElementById(
                "eventName"
            ).value.trim();


        const eventType =
            document.getElementById(
                "eventType"
            ).value;


        const eventDate =
            document.getElementById(
                "eventDate"
            ).value;


        const startTime =
            document.getElementById(
                "startTime"
            ).value;


        const endTime =
            document.getElementById(
                "endTime"
            ).value;


        const venue =
            document.getElementById(
                "venue"
            ).value.trim();


        const participants =
            document.getElementById(
                "participants"
            ).value;


        const targetDepartment =
            document.getElementById(
                "targetDepartment"
            ).value.trim();


        const description =
            document.getElementById(
                "description"
            ).value.trim();


        const purpose =
            document.getElementById(
                "purpose"
            ).value.trim();


        const requirements =
            document.getElementById(
                "requirements"
            ).value.trim();


        const guests =
            getGuests();


        /* ===============================
           TIME CHECK
        =============================== */

        if(startTime >= endTime){

            alert(
                "End time must be later than start time."
            );

            return;

        }


        const submitBtn =
            document.getElementById(
                "submitBtn"
            );


        submitBtn.disabled = true;

        submitBtn.textContent =
            "Submitting...";


        try{

            await addDoc(

                collection(
                    db,
                    "eventRequests"
                ),

                {

                    eventName:eventName,

                    eventType:eventType,

                    eventDate:eventDate,

                    startTime:startTime,

                    endTime:endTime,

                    venue:venue,

                    participants:
                        Number(participants),

                    organisingDepartment:
                        department,

                    requestedByStaffId:
                        staffId,

                    requestedByStaffName:
                        staffName,

                    targetDepartment:
                        targetDepartment,

                    description:
                        description,

                    purpose:
                        purpose,

                    requirements:
                        requirements,

                    guests:
                        guests,


                    /* WORKFLOW */

                    status:
                        "Pending Dean Approval",

                    submittedTo:
                        "Dean",

                    deanStatus:
                        "Pending",

                    deanRemarks:
                        "",

                    forwardedByDean:
                        false,

                    forwardedToDepartment:
                        "",

                    forwardedAt:
                        null,

                    submittedAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }

            );


            alert(
                "Event Request submitted successfully.\n\nSent to Dean for approval."
            );


            clearForm();

            loadMyRequests();

        }
        catch(error){

            console.error(
                "Event request error:",
                error
            );


            alert(
                "Unable to submit Event Request.\n\n" +
                error.message
            );

        }
        finally{

            submitBtn.disabled =
                false;

            submitBtn.textContent =
                "Submit Event Request";

        }

    }
);


/* =====================================================
   CLEAR FORM
===================================================== */

window.clearForm = function(){

    document.getElementById(
        "eventForm"
    ).reset();


    document.getElementById(
        "department"
    ).value =
        department || "";


    document.getElementById(
        "guestContainer"
    ).innerHTML = `

        <div class="guest-row">

            <div class="form-group">

                <label>
                    Guest Name
                </label>

                <input
                    type="text"
                    class="guestName"
                    placeholder="Guest name"
                >

            </div>


            <div class="form-group">

                <label>
                    Designation
                </label>

                <input
                    type="text"
                    class="guestDesignation"
                    placeholder="Designation"
                >

            </div>


            <div class="form-group">

                <label>
                    Organisation
                </label>

                <input
                    type="text"
                    class="guestOrganisation"
                    placeholder="Organisation"
                >

            </div>


            <button
                type="button"
                class="remove-btn"
                onclick="removeGuest(this)"
            >
                ×
            </button>

        </div>

    `;

};


/* =====================================================
   LOAD MY REQUESTS
===================================================== */

async function loadMyRequests(){

    const loading =
        document.getElementById(
            "requestLoading"
        );

    const table =
        document.getElementById(
            "requestTable"
        );


    loading.style.display =
        "block";


    table.innerHTML = "";


    try{

        const q = query(

            collection(
                db,
                "eventRequests"
            ),

            where(
                "requestedByStaffId",
                "==",
                staffId
            )

        );


        const snap =
            await getDocs(q);


        loading.style.display =
            "none";


        if(snap.empty){

            table.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="empty"
                    >
                        No Event Requests found.
                    </td>

                </tr>

            `;

            return;

        }


        const requests =
            snap.docs.map(
                doc => ({
                    id:doc.id,
                    ...doc.data()
                })
            );


        requests.sort(
            (a,b) => {

                const aTime =
                    a.submittedAt &&
                    a.submittedAt.toMillis
                    ? a.submittedAt.toMillis()
                    : 0;

                const bTime =
                    b.submittedAt &&
                    b.submittedAt.toMillis
                    ? b.submittedAt.toMillis()
                    : 0;

                return bTime - aTime;

            }
        );


        requests.forEach(
            request => {

                const tr =
                    document.createElement(
                        "tr"
                    );


                const guests =
                    Array.isArray(
                        request.guests
                    )
                    ? request.guests
                    : [];


                const guestText =
                    guests.length
                    ? guests
                        .map(
                            g => g.name || ""
                        )
                        .filter(Boolean)
                        .join(", ")
                    : "No Guest";


                const status =
                    request.status ||
                    "Pending Dean Approval";


                const statusClass =
                    getStatusClass(
                        status
                    );


                tr.innerHTML = `

                    <td>
                        ${escapeHtml(
                            request.eventName || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            request.eventType || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            request.eventDate || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            request.venue || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            guestText
                        )}
                    </td>

                    <td>

                        <span
                            class="status ${statusClass}"
                        >

                            ${escapeHtml(
                                status
                            )}

                        </span>

                    </td>

                    <td>
                        ${escapeHtml(
                            request.deanRemarks || "-"
                        )}
                    </td>

                `;


                table.appendChild(tr);

            }
        );

    }
    catch(error){

        console.error(
            "Load requests error:",
            error
        );


        loading.style.display =
            "none";


        table.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty"
                >
                    Unable to load Event Requests.
                </td>

            </tr>

        `;

    }

}


/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(status){

    const value =
        String(status)
        .toLowerCase();


    if(
        value.includes("approved")
    ){

        return "approved";

    }


    if(
        value.includes("rejected")
    ){

        return "rejected";

    }


    if(
        value.includes("forwarded")
    ){

        return "forwarded";

    }


    return "pending";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value ?? "")

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   INITIAL LOAD
===================================================== */

loadMyRequests();


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
    loadMyRequests,
    30000
);

</script>


</body>

</html>
