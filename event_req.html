
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Event Request</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
    color:#333;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;

    height:70px;

    background:#500454;
    color:white;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 30px;

    box-shadow:0 2px 10px rgba(0,0,0,.25);

    z-index:1000;
}

.header h2{
    font-size:24px;
}

.user{
    font-size:15px;
}


/* =====================================================
   MAIN
===================================================== */

.main{

    margin-top:70px;

    padding:30px;

    max-width:1400px;

    margin-left:auto;
    margin-right:auto;

}


/* =====================================================
   CARD
===================================================== */

.card{

    background:white;

    padding:25px;

    border-radius:10px;

    box-shadow:
        0 0 10px rgba(0,0,0,.12);

    margin-bottom:25px;

}

.card h2{

    color:#500454;

    margin-bottom:22px;

    font-size:23px;

}


/* =====================================================
   FORM
===================================================== */

.form-grid{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(250px,1fr));

    gap:20px;

}

.form-group{

    display:flex;

    flex-direction:column;

}

.form-group.full{

    grid-column:1/-1;

}

label{

    font-weight:bold;

    margin-bottom:7px;

    color:#444;

}

input,
select,
textarea{

    width:100%;

    padding:12px;

    border:1px solid #ccc;

    border-radius:6px;

    font-size:15px;

    outline:none;

    background:white;

}

input:focus,
select:focus,
textarea:focus{

    border-color:#500454;

    box-shadow:
        0 0 0 2px rgba(80,4,84,.08);

}

textarea{

    min-height:100px;

    resize:vertical;

}


/* =====================================================
   MULTIPLE DEPARTMENT DISPLAY
===================================================== */

.department-box{

    width:100%;

    min-height:50px;

    padding:10px;

    border:1px solid #ccc;

    border-radius:6px;

    background:#fafafa;

}

.department-title{

    font-size:12px;

    color:#777;

    margin-bottom:7px;

}

.department-list{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

}

.department-tag{

    display:inline-block;

    background:#500454;

    color:white;

    padding:7px 12px;

    border-radius:18px;

    font-size:13px;

    font-weight:bold;

}

.department-loading{

    color:#777;

    padding:5px;

}

.department-error{

    color:#c62828;

    font-weight:bold;

    padding:5px;

}


/* =====================================================
   GUEST
===================================================== */

.guest-section{

    margin-top:30px;

    padding:20px;

    border:1px solid #e2e2e2;

    border-radius:8px;

    background:#fafafa;

}

.guest-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:18px;

}

.guest-header h3{

    color:#500454;

    font-size:19px;

}

.add-btn{

    border:none;

    background:#500454;

    color:white;

    padding:10px 18px;

    border-radius:6px;

    cursor:pointer;

    font-weight:bold;

}

.add-btn:hover{

    background:#6e0a75;

}

.guest-row{

    display:grid;

    grid-template-columns:
        1fr 1fr 1fr 50px;

    gap:12px;

    margin-bottom:12px;

    align-items:end;

}

.remove-btn{

    height:42px;

    border:none;

    background:#dc2626;

    color:white;

    border-radius:6px;

    cursor:pointer;

    font-size:20px;

    font-weight:bold;

}

.remove-btn:hover{

    background:#b91c1c;

}


/* =====================================================
   BUTTONS
===================================================== */

.submit-area{

    margin-top:25px;

    display:flex;

    justify-content:flex-end;

    gap:12px;

}

.submit-btn{

    background:#500454;

    color:white;

    border:none;

    padding:14px 28px;

    border-radius:7px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}

.submit-btn:hover{

    background:#6e0a75;

}

.submit-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

}

.clear-btn{

    background:#6b7280;

    color:white;

    border:none;

    padding:14px 25px;

    border-radius:7px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}


/* =====================================================
   TABLE
===================================================== */

.table-wrap{

    width:100%;

    overflow-x:auto;

}

table{

    width:100%;

    border-collapse:collapse;

}

th,
td{

    padding:12px;

    border:1px solid #ddd;

    text-align:left;

    white-space:nowrap;

}

th{

    background:#500454;

    color:white;

}

tr:nth-child(even){

    background:#fafafa;

}


/* =====================================================
   STATUS
===================================================== */

.status{

    display:inline-block;

    padding:6px 11px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;

}

.status.pending{

    background:#fff3cd;

    color:#856404;

}

.status.approved{

    background:#d1fae5;

    color:#065f46;

}

.status.rejected{

    background:#fee2e2;

    color:#991b1b;

}

.status.forwarded{

    background:#dbeafe;

    color:#1e40af;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    text-align:center;

    padding:20px;

    color:#500454;

    font-weight:bold;

}

.empty{

    text-align:center;

    padding:25px;

    color:#777;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:850px){

    .form-grid{

        grid-template-columns:1fr;

    }

    .form-group.full{

        grid-column:auto;

    }

    .guest-row{

        grid-template-columns:1fr;

    }

    .remove-btn{

        width:100%;

    }

}

@media(max-width:600px){

    .header{

        padding:0 15px;

    }

    .header h2{

        font-size:18px;

    }

    .user{

        font-size:12px;

    }

    .main{

        padding:15px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <h2>
        EVENT REQUEST
    </h2>

    <div class="user">

        Welcome
        <span id="staffName"></span>

    </div>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="main">


<!-- =====================================================
     EVENT REQUEST FORM
===================================================== -->

<div class="card">

    <h2>
        📅 Event Request
    </h2>


    <form id="eventForm">


        <div class="form-grid">


            <!-- =================================================
                 EVENT NAME
            ================================================== -->

            <div class="form-group full">

                <label>
                    Event Name *
                </label>

                <input
                    type="text"
                    id="eventName"
                    placeholder="Enter event name"
                    required
                >

            </div>


            <!-- =================================================
                 EVENT TYPE
            ================================================== -->

            <div class="form-group">

                <label>
                    Event Type *
                </label>

                <select
                    id="eventType"
                    required
                >

                    <option value="">
                        Select Event Type
                    </option>

                    <option value="Academic">
                        Academic
                    </option>

                    <option value="Cultural">
                        Cultural
                    </option>

                    <option value="Technical">
                        Technical
                    </option>

                    <option value="Workshop">
                        Workshop
                    </option>

                    <option value="Seminar">
                        Seminar
                    </option>

                    <option value="Conference">
                        Conference
                    </option>

                    <option value="Sports">
                        Sports
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- =================================================
                 ORGANISING DEPARTMENTS
            ================================================== -->

            <div class="form-group">

                <label>
                    Organising Department(s)
                </label>

                <div
                    id="departmentBox"
                    class="department-box"
                >

                    <div class="department-loading">
                        Loading Head departments...
                    </div>

                </div>

            </div>


            <!-- =================================================
                 EVENT DATE
            ================================================== -->

            <div class="form-group">

                <label>
                    Event Date *
                </label>

                <input
                    type="date"
                    id="eventDate"
                    required
                >

            </div>


            <!-- =================================================
                 START TIME
            ================================================== -->

            <div class="form-group">

                <label>
                    Start Time *
                </label>

                <input
                    type="time"
                    id="startTime"
                    required
                >

            </div>


            <!-- =================================================
                 END TIME
            ================================================== -->

            <div class="form-group">

                <label>
                    End Time *
                </label>

                <input
                    type="time"
                    id="endTime"
                    required
                >

            </div>


            <!-- =================================================
                 VENUE
            ================================================== -->

            <div class="form-group">

                <label>
                    Venue *
                </label>

                <input
                    type="text"
                    id="venue"
                    placeholder="Enter venue"
                    required
                >

            </div>


            <!-- =================================================
                 PARTICIPANTS
            ================================================== -->

            <div class="form-group">

                <label>
                    Expected Participants *
                </label>

                <input
                    type="number"
                    id="participants"
                    min="1"
                    placeholder="Enter number"
                    required
                >

            </div>


            <!-- =================================================
                 FORWARD DEPARTMENT
            ================================================== -->

            <div class="form-group">

                <label>
                    Department to be Forwarded
                </label>

                <input
                    type="text"
                    id="targetDepartment"
                    placeholder="Dean will decide"
                >

            </div>


            <!-- =================================================
                 DESCRIPTION
            ================================================== -->

            <div class="form-group full">

                <label>
                    Event Description *
                </label>

                <textarea
                    id="description"
                    placeholder="Enter event description"
                    required
                ></textarea>

            </div>


            <!-- =================================================
                 PURPOSE
            ================================================== -->

            <div class="form-group full">

                <label>
                    Purpose / Objective *
                </label>

                <textarea
                    id="purpose"
                    placeholder="Enter purpose / objective"
                    required
                ></textarea>

            </div>


            <!-- =================================================
                 REQUIREMENTS
            ================================================== -->

            <div class="form-group full">

                <label>
                    Facilities / Requirements
                </label>

                <textarea
                    id="requirements"
                    placeholder="Projector, microphone, chairs, transport, refreshments, etc."
                ></textarea>

            </div>


        </div>


        <!-- =================================================
             GUEST SECTION
        ================================================== -->

        <div class="guest-section">

            <div class="guest-header">

                <h3>
                    👤 Guest Details
                </h3>

                <button
                    type="button"
                    class="add-btn"
                    onclick="addGuest()"
                >
                    + Add Guest
                </button>

            </div>


            <div id="guestContainer">


                <div class="guest-row">


                    <div class="form-group">

                        <label>
                            Guest Name
                        </label>

                        <input
                            type="text"
                            class="guestName"
                            placeholder="Guest name"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Designation
                        </label>

                        <input
                            type="text"
                            class="guestDesignation"
                            placeholder="Designation"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Organisation
                        </label>

                        <input
                            type="text"
                            class="guestOrganisation"
                            placeholder="Organisation"
                        >

                    </div>


                    <button
                        type="button"
                        class="remove-btn"
                        onclick="removeGuest(this)"
                    >
                        ×
                    </button>


                </div>


            </div>

        </div>


        <!-- =================================================
             BUTTONS
        ================================================== -->

        <div class="submit-area">


            <button
                type="button"
                class="clear-btn"
                onclick="clearForm()"
            >
                Clear
            </button>


            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                Submit Event Request
            </button>


        </div>


    </form>

</div>


<!-- =====================================================
     MY REQUESTS
===================================================== -->

<div class="card">

    <h2>
        📋 My Event Requests
    </h2>


    <div
        id="requestLoading"
        class="loading"
        style="display:none;"
    >
        Loading requests...
    </div>


    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>
                        Event
                    </th>

                    <th>
                        Type
                    </th>

                    <th>
                        Organising Department(s)
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Venue
                    </th>

                    <th>
                        Guests
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Dean Remarks
                    </th>

                </tr>

            </thead>


            <tbody id="requestTable">

            </tbody>

        </table>

    </div>

</div>


</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


import { db } from "./firebase-config.js";


import {

    collection,

    addDoc,

    query,

    where,

    getDocs,

    getDoc,

    doc,

    serverTimestamp

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   SESSION
===================================================== */

const staffId =
    sessionStorage.getItem(
        "staffId"
    );


const sessionStaffName =
    sessionStorage.getItem(
        "staffName"
    );


/* =====================================================
   GLOBAL
===================================================== */

/*
    IMPORTANT:

    Do NOT take the department from:

        sessionStorage.department

    anymore.

    The Assign Department Head page stores:

        headDepartments: [...]

    inside:

        staff/{staffId}

    Therefore this page reads the actual
    Firestore staff document.
*/

let staffName =
    sessionStaffName || "";

let headDepartments = [];


/* =====================================================
   LOGIN CHECK
===================================================== */

if(!staffId){

    alert(
        "Please Login"
    );

    window.location.href =
        "login.html";

    throw new Error(
        "No staff ID found."
    );

}


/* =====================================================
   DISPLAY STAFF NAME
===================================================== */

document.getElementById(
    "staffName"
).textContent =
    staffName;


/* =====================================================
   NORMALISE DEPARTMENT
===================================================== */

function normaliseDepartment(
    value
){

    return String(
        value ?? ""
    )
    .trim()
    .replace(
        /\s+/g,
        " "
    );

}


/* =====================================================
   REMOVE DUPLICATES
===================================================== */

function uniqueDepartments(
    departments
){

    const result = [];


    departments.forEach(
        department => {

            const value =
                normaliseDepartment(
                    department
                );


            if(!value){
                return;
            }


            const exists =
                result.some(
                    item =>
                        item.toLowerCase() ===
                        value.toLowerCase()
                );


            if(!exists){

                result.push(
                    value
                );

            }

        }
    );


    return result;

}


/* =====================================================
   LOAD LOGGED-IN STAFF
===================================================== */

async function loadLoggedInStaff(){

    const box =
        document.getElementById(
            "departmentBox"
        );


    box.innerHTML = `

        <div class="department-loading">
            Loading Head departments...
        </div>

    `;


    try{


        /*
            IMPORTANT:

            The staff document ID in your
            Assign Department Head page is:

                staffId

            because it uses:

                doc(db,"staff",staffId)

            and saves:

                headDepartments:[...]
        */

        const staffRef =
            doc(
                db,
                "staff",
                staffId
            );


        const staffSnap =
            await getDoc(
                staffRef
            );


        if(!staffSnap.exists()){

            throw new Error(
                "Staff record not found for Staff ID: " +
                staffId
            );

        }


        const data =
            staffSnap.data();


        console.log(
            "LOGGED-IN STAFF DATA:",
            data
        );


        /*
            Get actual staff name
        */

        staffName =
            String(
                data.staffName ||
                data.name ||
                sessionStaffName ||
                ""
            ).trim();


        document.getElementById(
            "staffName"
        ).textContent =
            staffName;


        /*
            ==========================================
            PRIMARY FORMAT
            ==========================================

            headDepartments:
            [
                "IT",
                "Computer Science"
            ]
        */

        if(
            Array.isArray(
                data.headDepartments
            )
        ){

            headDepartments =
                data.headDepartments;

        }
        else{

            headDepartments = [];

        }


        /*
            ==========================================
            BACKWARD COMPATIBILITY
            ==========================================

            If an old record only has:

                department: "IT"

            use that as one department.
        */

        if(
            headDepartments.length === 0 &&
            data.department
        ){

            headDepartments = [
                data.department
            ];

        }


        /*
            Clean duplicates
        */

        headDepartments =
            uniqueDepartments(
                headDepartments
            );


        console.log(
            "HEAD DEPARTMENTS:",
            headDepartments
        );


        /*
            Check Head role
        */

        const role =
            String(
                data.role || ""
            )
            .trim()
            .toLowerCase();


        if(
            role !== "department head" &&
            headDepartments.length === 0
        ){

            box.innerHTML = `

                <div class="department-error">

                    This staff member is not assigned
                    as a Department Head.

                </div>

            `;

            document.getElementById(
                "submitBtn"
            ).disabled = true;

            return;

        }


        /*
            Must have at least one department.
        */

        if(
            headDepartments.length === 0
        ){

            box.innerHTML = `

                <div class="department-error">

                    No department is assigned to
                    this Department Head.

                    <br><br>

                    Please use the Assign Department Head
                    page to assign a department.

                </div>

            `;


            document.getElementById(
                "submitBtn"
            ).disabled = true;


            return;

        }


        /*
            Display all departments.
        */

        displayHeadDepartments();


    }
    catch(error){

        console.error(
            "LOAD HEAD DEPARTMENT ERROR:",
            error
        );


        box.innerHTML = `

            <div class="department-error">

                Unable to load Head departments.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;


        document.getElementById(
            "submitBtn"
        ).disabled = true;

    }

}


/* =====================================================
   DISPLAY HEAD DEPARTMENTS
===================================================== */

function displayHeadDepartments(){

    const box =
        document.getElementById(
            "departmentBox"
        );


    box.innerHTML = "";


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "department-title";


    title.textContent =
        "This event will be organised for:";


    box.appendChild(
        title
    );


    const list =
        document.createElement(
            "div"
        );


    list.className =
        "department-list";


    headDepartments.forEach(
        department => {

            const tag =
                document.createElement(
                    "span"
                );


            tag.className =
                "department-tag";


            tag.textContent =
                department;


            list.appendChild(
                tag
            );

        }
    );


    box.appendChild(
        list
    );

}


/* =====================================================
   ADD GUEST
===================================================== */

window.addGuest =
function(){

    const container =
        document.getElementById(
            "guestContainer"
        );


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "guest-row";


    row.innerHTML = `

        <div class="form-group">

            <label>
                Guest Name
            </label>

            <input
                type="text"
                class="guestName"
                placeholder="Guest name"
            >

        </div>


        <div class="form-group">

            <label>
                Designation
            </label>

            <input
                type="text"
                class="guestDesignation"
                placeholder="Designation"
            >

        </div>


        <div class="form-group">

            <label>
                Organisation
            </label>

            <input
                type="text"
                class="guestOrganisation"
                placeholder="Organisation"
            >

        </div>


        <button
            type="button"
            class="remove-btn"
            onclick="removeGuest(this)"
        >
            ×
        </button>

    `;


    container.appendChild(
        row
    );

};


/* =====================================================
   REMOVE GUEST
===================================================== */

window.removeGuest =
function(button){

    const rows =
        document.querySelectorAll(
            ".guest-row"
        );


    if(
        rows.length <= 1
    ){

        alert(
            "At least one guest row must remain."
        );

        return;

    }


    button
        .closest(
            ".guest-row"
        )
        .remove();

};


/* =====================================================
   GET GUESTS
===================================================== */

function getGuests(){

    const names =
        document.querySelectorAll(
            ".guestName"
        );


    const designations =
        document.querySelectorAll(
            ".guestDesignation"
        );


    const organisations =
        document.querySelectorAll(
            ".guestOrganisation"
        );


    const guests = [];


    for(
        let i = 0;
        i < names.length;
        i++
    ){

        const name =
            names[i]
                .value
                .trim();


        const designation =
            designations[i]
                .value
                .trim();


        const organisation =
            organisations[i]
                .value
                .trim();


        if(
            name ||
            designation ||
            organisation
        ){

            guests.push({

                name:
                    name,

                designation:
                    designation,

                organisation:
                    organisation

            });

        }

    }


    return guests;

}


/* =====================================================
   SUBMIT
===================================================== */

document.getElementById(
    "eventForm"
)
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        /*
            ==========================================
            VERY IMPORTANT
            ==========================================

            The event departments come from the
            logged-in Head's Firestore record.

            They are NOT taken from sessionStorage.
        */

        if(
            headDepartments.length === 0
        ){

            alert(
                "No Department Head department is assigned."
            );

            return;

        }


        const eventName =
            document.getElementById(
                "eventName"
            )
            .value
            .trim();


        const eventType =
            document.getElementById(
                "eventType"
            )
            .value;


        const eventDate =
            document.getElementById(
                "eventDate"
            )
            .value;


        const startTime =
            document.getElementById(
                "startTime"
            )
            .value;


        const endTime =
            document.getElementById(
                "endTime"
            )
            .value;


        const venue =
            document.getElementById(
                "venue"
            )
            .value
            .trim();


        const participants =
            document.getElementById(
                "participants"
            )
            .value;


        const targetDepartment =
            document.getElementById(
                "targetDepartment"
            )
            .value
            .trim();


        const description =
            document.getElementById(
                "description"
            )
            .value
            .trim();


        const purpose =
            document.getElementById(
                "purpose"
            )
            .value
            .trim();


        const requirements =
            document.getElementById(
                "requirements"
            )
            .value
            .trim();


        const guests =
            getGuests();


        /* =================================================
           TIME CHECK
        ================================================== */

        if(
            startTime >= endTime
        ){

            alert(
                "End time must be later than start time."
            );

            return;

        }


        /* =================================================
           BUTTON
        ================================================== */

        const submitBtn =
            document.getElementById(
                "submitBtn"
            );


        submitBtn.disabled =
            true;


        submitBtn.textContent =
            "Submitting...";


        try{


            /*
                =================================================
                SAVE EVENT
                =================================================

                Example:

                headDepartments =

                [
                    "IT",
                    "Computer Science"
                ]

                Therefore Firestore gets:

                organisingDepartments:
                [
                    "IT",
                    "Computer Science"
                ]

                This means the SAME event belongs
                to BOTH departments.
            */


            await addDoc(

                collection(
                    db,
                    "eventRequests"
                ),

                {

                    /* ===============================
                       EVENT DETAILS
                    =============================== */

                    eventName:
                        eventName,

                    eventType:
                        eventType,

                    eventDate:
                        eventDate,

                    startTime:
                        startTime,

                    endTime:
                        endTime,

                    venue:
                        venue,

                    participants:
                        Number(
                            participants
                        ),


                    /* ===============================
                       MULTIPLE HEAD DEPARTMENTS
                    =============================== */

                    organisingDepartments:
                        [
                            ...headDepartments
                        ],


                    /*
                        BACKWARD COMPATIBILITY

                        Existing pages may still look for
                        organisingDepartment.

                        Keep first department here.
                    */

                    organisingDepartment:
                        headDepartments[0],


                    /* ===============================
                       REQUESTER
                    =============================== */

                    requestedByStaffId:
                        staffId,

                    requestedByStaffName:
                        staffName,


                    /* ===============================
                       FORWARD
                    =============================== */

                    targetDepartment:
                        targetDepartment,


                    /* ===============================
                       DETAILS
                    =============================== */

                    description:
                        description,

                    purpose:
                        purpose,

                    requirements:
                        requirements,

                    guests:
                        guests,


                    /* ===============================
                       WORKFLOW
                    =============================== */

                    status:
                        "Pending Dean Approval",

                    submittedTo:
                        "Dean",

                    deanStatus:
                        "Pending",

                    deanRemarks:
                        "",


                    /* ===============================
                       DEAN FORWARD
                    =============================== */

                    forwardedByDean:
                        false,

                    forwardedToDepartment:
                        "",

                    forwardedAt:
                        null,


                    /* ===============================
                       TIMESTAMPS
                    =============================== */

                    submittedAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }

            );


            alert(

                "Event Request submitted successfully.\n\n" +

                "Organising Department(s):\n" +

                headDepartments.join(
                    ", "
                ) +

                "\n\nSent to Dean for approval."

            );


            clearForm();


            await loadMyRequests();


        }
        catch(error){

            console.error(
                "EVENT REQUEST ERROR:",
                error
            );


            alert(

                "Unable to submit Event Request.\n\n" +

                error.message

            );

        }
        finally{

            submitBtn.disabled =
                false;

            submitBtn.textContent =
                "Submit Event Request";

        }

    }
);


/* =====================================================
   CLEAR FORM
===================================================== */

window.clearForm =
function(){

    document.getElementById(
        "eventForm"
    )
    .reset();


    /*
        Department display is NOT reset.

        It always comes from the logged-in
        Department Head record.
    */

    displayHeadDepartments();


    /*
        Reset guests
    */

    document.getElementById(
        "guestContainer"
    ).innerHTML = `

        <div class="guest-row">


            <div class="form-group">

                <label>
                    Guest Name
                </label>

                <input
                    type="text"
                    class="guestName"
                    placeholder="Guest name"
                >

            </div>


            <div class="form-group">

                <label>
                    Designation
                </label>

                <input
                    type="text"
                    class="guestDesignation"
                    placeholder="Designation"
                >

            </div>


            <div class="form-group">

                <label>
                    Organisation
                </label>

                <input
                    type="text"
                    class="guestOrganisation"
                    placeholder="Organisation"
                >

            </div>


            <button
                type="button"
                class="remove-btn"
                onclick="removeGuest(this)"
            >
                ×
            </button>


        </div>

    `;

};


/* =====================================================
   LOAD MY REQUESTS
===================================================== */

async function loadMyRequests(){

    const loading =
        document.getElementById(
            "requestLoading"
        );


    const table =
        document.getElementById(
            "requestTable"
        );


    loading.style.display =
        "block";


    table.innerHTML =
        "";


    try{


        const q =
            query(

                collection(
                    db,
                    "eventRequests"
                ),

                where(
                    "requestedByStaffId",
                    "==",
                    staffId
                )

            );


        const snap =
            await getDocs(
                q
            );


        loading.style.display =
            "none";


        if(
            snap.empty
        ){

            table.innerHTML = `

                <tr>

                    <td
                        colspan="8"
                        class="empty"
                    >
                        No Event Requests found.
                    </td>

                </tr>

            `;

            return;

        }


        const requests =
            snap.docs.map(
                item => ({

                    id:
                        item.id,

                    ...item.data()

                })
            );


        /*
            Newest first.
        */

        requests.sort(
            (a,b) => {

                const aTime =
                    a.submittedAt &&
                    a.submittedAt.toMillis
                    ?
                    a.submittedAt.toMillis()
                    :
                    0;


                const bTime =
                    b.submittedAt &&
                    b.submittedAt.toMillis
                    ?
                    b.submittedAt.toMillis()
                    :
                    0;


                return bTime - aTime;

            }
        );


        requests.forEach(
            request => {


                const tr =
                    document.createElement(
                        "tr"
                    );


                /*
                    New format:

                    organisingDepartments:[...]

                    Old format:

                    organisingDepartment:"IT"
                */

                let departments = [];


                if(
                    Array.isArray(
                        request.organisingDepartments
                    )
                ){

                    departments =
                        request.organisingDepartments;

                }
                else if(
                    request.organisingDepartment
                ){

                    departments = [

                        request.organisingDepartment

                    ];

                }


                const departmentText =
                    departments.length
                    ?
                    departments.join(
                        ", "
                    )
                    :
                    "-";


                const guests =
                    Array.isArray(
                        request.guests
                    )
                    ?
                    request.guests
                    :
                    [];


                const guestText =
                    guests.length
                    ?
                    guests
                        .map(
                            g =>
                                g.name || ""
                        )
                        .filter(
                            Boolean
                        )
                        .join(
                            ", "
                        )
                    :
                    "No Guest";


                const status =
                    request.status ||
                    "Pending Dean Approval";


                const statusClass =
                    getStatusClass(
                        status
                    );


                tr.innerHTML = `

                    <td>

                        ${escapeHtml(
                            request.eventName ||
                            "-"
                        )}

                    </td>


                    <td>

                        ${escapeHtml(
                            request.eventType ||
                            "-"
                        )}

                    </td>


                    <td>

                        ${escapeHtml(
                            departmentText
                        )}

                    </td>


                    <td>

                        ${escapeHtml(
                            request.eventDate ||
                            "-"
                        )}

                        <br>

                        <small>

                            ${escapeHtml(
                                request.startTime ||
                                ""
                            )}

                            -

                            ${escapeHtml(
                                request.endTime ||
                                ""
                            )}

                        </small>

                    </td>


                    <td>

                        ${escapeHtml(
                            request.venue ||
                            "-"
                        )}

                    </td>


                    <td>

                        ${escapeHtml(
                            guestText
                        )}

                    </td>


                    <td>

                        <span
                            class="status ${statusClass}"
                        >

                            ${escapeHtml(
                                status
                            )}

                        </span>

                    </td>


                    <td>

                        ${escapeHtml(
                            request.deanRemarks ||
                            "-"
                        )}

                    </td>

                `;


                table.appendChild(
                    tr
                );

            }
        );


    }
    catch(error){

        console.error(
            "LOAD REQUESTS ERROR:",
            error
        );


        loading.style.display =
            "none";


        table.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty"
                >

                    Unable to load Event Requests.

                    <br><br>

                    ${escapeHtml(
                        error.message
                    )}

                </td>

            </tr>

        `;

    }

}


/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(
    status
){

    const value =
        String(
            status
        )
        .toLowerCase();


    if(
        value.includes(
            "approved"
        )
    ){

        return "approved";

    }


    if(
        value.includes(
            "rejected"
        )
    ){

        return "rejected";

    }


    if(
        value.includes(
            "forwarded"
        )
    ){

        return "forwarded";

    }


    return "pending";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =====================================================
   INITIAL LOAD
===================================================== */

await loadLoggedInStaff();

await loadMyRequests();


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
    loadMyRequests,
    30000
);

</script>
