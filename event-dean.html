<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dean - Event Approval</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
    color:#333;
}

/* ================= HEADER ================= */

.header{

    position:fixed;

    top:0;
    left:0;
    right:0;

    height:70px;

    background:#500454;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 30px;

    color:white;

    box-shadow:0 2px 10px rgba(0,0,0,.25);

    z-index:1000;
}

.header h2{
    font-size:24px;
}

.user{
    font-size:15px;
}

/* ================= MAIN ================= */

.main{

    margin-top:70px;

    padding:30px;

    max-width:1500px;

    margin-left:auto;

    margin-right:auto;
}

/* ================= CARD ================= */

.card{

    background:white;

    padding:25px;

    border-radius:10px;

    box-shadow:0 0 10px rgba(0,0,0,.12);

    margin-bottom:25px;
}

.card h2{

    color:#500454;

    margin-bottom:20px;

    font-size:23px;
}

/* ================= STATS ================= */

.stats{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:20px;

    margin-bottom:25px;
}

.stat{

    background:white;

    padding:22px;

    border-radius:10px;

    box-shadow:0 0 10px rgba(0,0,0,.12);

    text-align:center;
}

.stat h1{

    color:#500454;

    font-size:36px;

    margin-bottom:8px;
}

.stat p{

    font-weight:bold;

    font-size:16px;
}

/* ================= REQUEST CARD ================= */

.request-card{

    border:1px solid #ddd;

    border-radius:10px;

    margin-bottom:20px;

    overflow:hidden;

    background:white;
}

.request-header{

    background:#500454;

    color:white;

    padding:16px 20px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;
}

.request-header h3{

    font-size:19px;
}

.request-id{

    font-size:12px;

    opacity:.9;
}

/* ================= REQUEST BODY ================= */

.request-body{

    padding:20px;
}

/* ================= DETAILS GRID ================= */

.details-grid{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:15px;

    margin-bottom:20px;
}

.detail{

    background:#f8f8f8;

    border:1px solid #eee;

    border-radius:7px;

    padding:13px;
}

.detail label{

    display:block;

    color:#777;

    font-size:12px;

    font-weight:bold;

    margin-bottom:5px;

    text-transform:uppercase;
}

.detail strong{

    color:#333;

    font-size:15px;
}

/* ================= FULL DETAILS ================= */

.description-box{

    background:#fafafa;

    border:1px solid #eee;

    border-radius:7px;

    padding:15px;

    margin-bottom:15px;
}

.description-box h4{

    color:#500454;

    margin-bottom:8px;
}

.description-box p{

    white-space:pre-wrap;

    line-height:1.5;
}

/* ================= GUEST ================= */

.guest-title{

    color:#500454;

    margin-bottom:10px;

}

.guest-table{

    width:100%;

    border-collapse:collapse;

    margin-bottom:20px;
}

.guest-table th,
.guest-table td{

    padding:10px;

    border:1px solid #ddd;

    text-align:left;
}

.guest-table th{

    background:#500454;

    color:white;
}

.no-guest{

    color:#777;

    padding:10px 0;
}

/* ================= ACTION ================= */

.action-box{

    border-top:1px solid #ddd;

    padding-top:20px;

    margin-top:20px;
}

.action-grid{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:15px;
}

.action-group{

    display:flex;

    flex-direction:column;
}

.action-group.full{

    grid-column:1/-1;
}

.action-group label{

    font-weight:bold;

    margin-bottom:7px;
}

select,
textarea{

    width:100%;

    padding:12px;

    border:1px solid #ccc;

    border-radius:6px;

    font-size:14px;

    outline:none;

    background:white;
}

select:focus,
textarea:focus{

    border-color:#500454;
}

textarea{

    min-height:80px;

    resize:vertical;
}

/* ================= BUTTONS ================= */

.buttons{

    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:18px;
}

button{

    border:none;

    border-radius:6px;

    padding:12px 22px;

    font-weight:bold;

    cursor:pointer;

    font-size:14px;
}

.approve-btn{

    background:#15803d;

    color:white;
}

.approve-btn:hover{

    background:#166534;
}

.reject-btn{

    background:#dc2626;

    color:white;
}

.reject-btn:hover{

    background:#b91c1c;
}

.forward-btn{

    background:#2563eb;

    color:white;
}

.forward-btn:hover{

    background:#1d4ed8;
}

/* ================= STATUS ================= */

.status{

    display:inline-block;

    padding:6px 12px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;
}

.status.pending{

    background:#fff3cd;

    color:#856404;
}

.status.approved{

    background:#d1fae5;

    color:#065f46;
}

.status.rejected{

    background:#fee2e2;

    color:#991b1b;
}

.status.forwarded{

    background:#dbeafe;

    color:#1e40af;
}

/* ================= EMPTY ================= */

.empty{

    background:white;

    border-radius:10px;

    padding:50px;

    text-align:center;

    box-shadow:0 0 10px rgba(0,0,0,.12);

    color:#777;
}

.empty-icon{

    font-size:45px;

    margin-bottom:12px;
}

/* ================= LOADING ================= */

.loading{

    text-align:center;

    padding:40px;

    color:#500454;

    font-weight:bold;
}

/* ================= APPROVED HISTORY ================= */

.history-table{

    width:100%;

    border-collapse:collapse;

    overflow:hidden;
}

.history-table th,
.history-table td{

    padding:12px;

    border:1px solid #ddd;

    text-align:left;
}

.history-table th{

    background:#500454;

    color:white;
}

.history-table tr:nth-child(even){

    background:#fafafa;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1000px){

    .stats{

        grid-template-columns:1fr;
    }

    .details-grid{

        grid-template-columns:
        repeat(2,1fr);
    }

}

@media(max-width:750px){

    .main{

        padding:15px;
    }

    .header{

        padding:0 15px;
    }

    .header h2{

        font-size:18px;
    }

    .user{

        font-size:12px;
    }

    .details-grid{

        grid-template-columns:1fr;
    }

    .action-grid{

        grid-template-columns:1fr;
    }

    .action-group.full{

        grid-column:auto;
    }

    .buttons{

        flex-direction:column;
    }

    button{

        width:100%;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <h2>
        DEAN
    </h2>

    <div class="user">

        Welcome
        <span id="deanName"></span>

    </div>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="main">


<!-- =====================================================
     STATISTICS
===================================================== -->

<div class="stats">

    <div class="stat">

        <h1 id="pendingCount">
            0
        </h1>

        <p>
            Pending Approval
        </p>

    </div>


    <div class="stat">

        <h1 id="approvedCount">
            0
        </h1>

        <p>
            Approved
        </p>

    </div>


    <div class="stat">

        <h1 id="forwardedCount">
            0
        </h1>

        <p>
            Forwarded
        </p>

    </div>

</div>


<!-- =====================================================
     PENDING REQUESTS
===================================================== -->

<div class="card">

    <h2>
        📋 Event Requests Pending Approval
    </h2>


    <div
        id="loading"
        class="loading"
    >
        Loading event requests...
    </div>


    <div id="pendingContainer">

    </div>

</div>


<!-- =====================================================
     APPROVAL HISTORY
===================================================== -->

<div class="card">

    <h2>
        📊 Event Approval History
    </h2>


    <div
        id="historyLoading"
        class="loading"
    >
        Loading history...
    </div>


    <div style="overflow-x:auto;">

        <table class="history-table">

            <thead>

                <tr>

                    <th>
                        Event
                    </th>

                    <th>
                        Department
                    </th>

                    <th>
                        Event Date
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Forwarded To
                    </th>

                    <th>
                        Dean Remarks
                    </th>

                </tr>

            </thead>


            <tbody id="historyTable">

            </tbody>

        </table>

    </div>

</div>


</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import { db } from "./firebase-config.js";

import {

    collection,
    query,
    where,
    getDocs,
    updateDoc,
    doc,
    serverTimestamp

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   SESSION
===================================================== */

const deanId =
    sessionStorage.getItem("staffId");

const deanName =
    sessionStorage.getItem("staffName");


/* =====================================================
   DISPLAY DEAN
===================================================== */

document.getElementById(
    "deanName"
).textContent =
    deanName || "Dean";


/* =====================================================
   LOAD DEPARTMENTS
===================================================== */

async function loadDepartments(){

    try{

        const snap =
            await getDocs(
                collection(db,"staff")
            );


        const departments =
            new Set();


        snap.forEach(
            document => {

                const data =
                    document.data();


                if(data.department){

                    departments.add(
                        String(
                            data.department
                        ).trim()
                    );

                }

            }
        );


        return Array.from(
            departments
        ).sort();


    }
    catch(error){

        console.error(
            "Department loading error:",
            error
        );


        return [];

    }

}


/* =====================================================
   LOAD PENDING REQUESTS
===================================================== */

async function loadPendingRequests(){

    const loading =
        document.getElementById(
            "loading"
        );

    const container =
        document.getElementById(
            "pendingContainer"
        );


    loading.style.display =
        "block";

    container.innerHTML =
        "";


    try{

        const q = query(

            collection(
                db,
                "eventRequests"
            ),

            where(
                "status",
                "==",
                "Pending Dean Approval"
            )

        );


        const snap =
            await getDocs(q);


        loading.style.display =
            "none";


        document.getElementById(
            "pendingCount"
        ).textContent =
            snap.size;


        if(snap.empty){

            container.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        ✅
                    </div>

                    <h3>
                        No Pending Event Requests
                    </h3>

                    <p style="margin-top:8px;">
                        All event requests have been processed.
                    </p>

                </div>

            `;

            return;

        }


        const departments =
            await loadDepartments();


        snap.forEach(
            document => {

                const request =
                    document.data();


                renderPendingRequest(

                    document.id,

                    request,

                    departments,

                    container

                );

            }
        );


    }
    catch(error){

        console.error(
            "Pending request error:",
            error
        );


        loading.style.display =
            "none";


        container.innerHTML = `

            <div class="empty">

                Unable to load event requests.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/* =====================================================
   RENDER REQUEST
===================================================== */

function renderPendingRequest(
    requestId,
    request,
    departments,
    container
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "request-card";


    const guests =
        Array.isArray(
            request.guests
        )
        ? request.guests
        : [];


    let guestHTML = "";


    if(guests.length){

        guestHTML = `

            <table class="guest-table">

                <thead>

                    <tr>

                        <th>
                            Guest Name
                        </th>

                        <th>
                            Designation
                        </th>

                        <th>
                            Organisation
                        </th>

                    </tr>

                </thead>

                <tbody>

                    ${
                        guests.map(
                            guest => `

                                <tr>

                                    <td>
                                        ${escapeHtml(
                                            guest.name || "-"
                                        )}
                                    </td>

                                    <td>
                                        ${escapeHtml(
                                            guest.designation || "-"
                                        )}
                                    </td>

                                    <td>
                                        ${escapeHtml(
                                            guest.organisation || "-"
                                        )}
                                    </td>

                                </tr>

                            `
                        ).join("")
                    }

                </tbody>

            </table>

        `;

    }
    else{

        guestHTML = `

            <div class="no-guest">
                No guest details provided.
            </div>

        `;

    }


    let departmentOptions = `

        <option value="">
            Select Department
        </option>

    `;


    departments.forEach(
        department => {

            departmentOptions += `

                <option value="${escapeAttribute(
                    department
                )}">

                    ${escapeHtml(
                        department
                    )}

                </option>

            `;

        }
    );


    card.innerHTML = `

        <!-- HEADER -->

        <div class="request-header">

            <div>

                <h3>
                    ${escapeHtml(
                        request.eventName || "Event"
                    )}
                </h3>

                <div class="request-id">

                    Request ID:
                    ${escapeHtml(
                        requestId
                    )}

                </div>

            </div>


            <span class="status pending">

                Pending Dean Approval

            </span>

        </div>


        <!-- BODY -->

        <div class="request-body">


            <!-- BASIC DETAILS -->

            <div class="details-grid">


                <div class="detail">

                    <label>
                        Requesting Department
                    </label>

                    <strong>
                        ${escapeHtml(
                            request.organisingDepartment || "-"
                        )}
                    </strong>

                </div>


                <div class="detail">

                    <label>
                        Requested By
                    </label>

                    <strong>
                        ${escapeHtml(
                            request.requestedByStaffName || "-"
                        )}
                    </strong>

                </div>


                <div class="detail">

                    <label>
                        Staff ID
                    </label>

                    <strong>
                        ${escapeHtml(
                            request.requestedByStaffId || "-"
                        )}
                    </strong>

                </div>


                <div class="detail">

                    <label>
                        Event Type
                    </label>

                    <strong>
                        ${escapeHtml(
                            request.eventType || "-"
                        )}
                    </strong>

                </div>


                <div class="detail">

                    <label>
                        Event Date
                    </label>

                    <strong>
                        ${escapeHtml(
                            request.eventDate || "-"
                        )}
                    </strong>

                </div>


                <div class="detail">

                    <label>
                        Time
                    </label>

                    <strong>

                        ${escapeHtml(
                            request.startTime || "-"
                        )}

                        -

                        ${escapeHtml(
                            request.endTime || "-"
                        )}

                    </strong>

                </div>


                <div class="detail">

                    <label>
                        Venue
                    </label>

                    <strong>
                        ${escapeHtml(
                            request.venue || "-"
                        )}
                    </strong>

                </div>


                <div class="detail">

                    <label>
                        Participants
                    </label>

                    <strong>
                        ${escapeHtml(
                            request.participants || "0"
                        )}
                    </strong>

                </div>


                <div class="detail">

                    <label>
                        Requested Forward Department
                    </label>

                    <strong>
                        ${escapeHtml(
                            request.targetDepartment || "Dean Decision"
                        )}
                    </strong>

                </div>


            </div>


            <!-- DESCRIPTION -->

            <div class="description-box">

                <h4>
                    Event Description
                </h4>

                <p>
                    ${escapeHtml(
                        request.description || "-"
                    )}
                </p>

            </div>


            <!-- PURPOSE -->

            <div class="description-box">

                <h4>
                    Purpose / Objective
                </h4>

                <p>
                    ${escapeHtml(
                        request.purpose || "-"
                    )}
                </p>

            </div>


            <!-- REQUIREMENTS -->

            <div class="description-box">

                <h4>
                    Facilities / Requirements
                </h4>

                <p>
                    ${escapeHtml(
                        request.requirements || "-"
                    )}
                </p>

            </div>


            <!-- GUESTS -->

            <h4 class="guest-title">
                👤 Guest Details
            </h4>

            ${guestHTML}


            <!-- ACTION -->

            <div class="action-box">

                <div class="action-grid">


                    <!-- FORWARD DEPARTMENT -->

                    <div class="action-group">

                        <label>
                            Forward To Department
                        </label>

                        <select
                            id="department-${requestId}"
                        >

                            ${departmentOptions}

                        </select>

                    </div>


                    <!-- REMARKS -->

                    <div class="action-group">

                        <label>
                            Dean Remarks
                        </label>

                        <textarea
                            id="remarks-${requestId}"
                            placeholder="Enter remarks"
                        ></textarea>

                    </div>

                </div>


                <!-- BUTTONS -->

                <div class="buttons">


                    <button
                        type="button"
                        class="reject-btn"
                        onclick="rejectRequest('${requestId}')"
                    >

                        ✕ Reject

                    </button>


                    <button
                        type="button"
                        class="approve-btn"
                        onclick="approveRequest('${requestId}')"
                    >

                        ✓ Approve

                    </button>


                    <button
                        type="button"
                        class="forward-btn"
                        onclick="approveAndForward('${requestId}')"
                    >

                        ➜ Approve & Forward

                    </button>


                </div>

            </div>

        </div>

    `;


    container.appendChild(card);

}


/* =====================================================
   APPROVE ONLY
===================================================== */

window.approveRequest =
async function(requestId){

    const remarksElement =
        document.getElementById(
            `remarks-${requestId}`
        );


    const remarks =
        remarksElement
        ? remarksElement.value.trim()
        : "";


    if(
        !confirm(
            "Approve this Event Request?"
        )
    ){

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "eventRequests",
                requestId
            ),

            {

                status:
                    "Approved by Dean",

                submittedTo:
                    "Approved",

                deanStatus:
                    "Approved",

                deanRemarks:
                    remarks,

                approvedByDeanId:
                    deanId || "",

                approvedByDeanName:
                    deanName || "",

                approvedAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            }

        );


        alert(
            "Event Request approved successfully."
        );


        loadPendingRequests();

        loadHistory();

    }
    catch(error){

        console.error(
            "Approval error:",
            error
        );


        alert(
            "Unable to approve request.\n\n" +
            error.message
        );

    }

};


/* =====================================================
   REJECT
===================================================== */

window.rejectRequest =
async function(requestId){

    const remarksElement =
        document.getElementById(
            `remarks-${requestId}`
        );


    const remarks =
        remarksElement
        ? remarksElement.value.trim()
        : "";


    if(!remarks){

        alert(
            "Please enter Dean Remarks before rejecting."
        );

        return;

    }


    if(
        !confirm(
            "Reject this Event Request?"
        )
    ){

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "eventRequests",
                requestId
            ),

            {

                status:
                    "Rejected by Dean",

                submittedTo:
                    "Rejected",

                deanStatus:
                    "Rejected",

                deanRemarks:
                    remarks,

                approvedByDeanId:
                    deanId || "",

                approvedByDeanName:
                    deanName || "",

                rejectedAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            }

        );


        alert(
            "Event Request rejected."
        );


        loadPendingRequests();

        loadHistory();

    }
    catch(error){

        console.error(
            "Reject error:",
            error
        );


        alert(
            "Unable to reject request.\n\n" +
            error.message
        );

    }

};


/* =====================================================
   APPROVE AND FORWARD
===================================================== */

window.approveAndForward =
async function(requestId){

    const departmentElement =
        document.getElementById(
            `department-${requestId}`
        );


    const remarksElement =
        document.getElementById(
            `remarks-${requestId}`
        );


    const targetDepartment =
        departmentElement
        ? departmentElement.value.trim()
        : "";


    const remarks =
        remarksElement
        ? remarksElement.value.trim()
        : "";


    if(!targetDepartment){

        alert(
            "Please select the department to forward this event."
        );

        return;

    }


    if(
        !confirm(
            "Approve this Event Request and forward it to " +
            targetDepartment +
            "?"
        )
    ){

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "eventRequests",
                requestId
            ),

            {

                status:
                    "Forwarded to Department",

                submittedTo:
                    targetDepartment,

                deanStatus:
                    "Approved",

                deanRemarks:
                    remarks,

                approvedByDeanId:
                    deanId || "",

                approvedByDeanName:
                    deanName || "",

                forwardedByDean:
                    true,

                forwardedToDepartment:
                    targetDepartment,

                approvedAt:
                    serverTimestamp(),

                forwardedAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            }

        );


        alert(
            "Event approved and forwarded successfully."
        );


        loadPendingRequests();

        loadHistory();

    }
    catch(error){

        console.error(
            "Forward error:",
            error
        );


        alert(
            "Unable to forward request.\n\n" +
            error.message
        );

    }

};


/* =====================================================
   LOAD HISTORY
===================================================== */

async function loadHistory(){

    const loading =
        document.getElementById(
            "historyLoading"
        );

    const table =
        document.getElementById(
            "historyTable"
        );


    loading.style.display =
        "block";


    table.innerHTML =
        "";


    try{

        const q =
            collection(
                db,
                "eventRequests"
            );


        const snap =
            await getDocs(q);


        loading.style.display =
            "none";


        let countApproved = 0;

        let countForwarded = 0;


        const records = [];


        snap.forEach(
            document => {

                const data =
                    document.data();


                const status =
                    data.status || "";


                if(
                    status ===
                    "Approved by Dean"
                ){

                    countApproved++;

                }


                if(
                    status ===
                    "Forwarded to Department"
                ){

                    countForwarded++;

                }


                if(

                    status ===
                    "Approved by Dean"

                    ||

                    status ===
                    "Rejected by Dean"

                    ||

                    status ===
                    "Forwarded to Department"

                ){

                    records.push({

                        id:document.id,

                        ...data

                    });

                }

            }
        );


        document.getElementById(
            "approvedCount"
        ).textContent =
            countApproved;


        document.getElementById(
            "forwardedCount"
        ).textContent =
            countForwarded;


        if(!records.length){

            table.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="empty"
                    >
                        No approval history available.
                    </td>

                </tr>

            `;

            return;

        }


        records.sort(
            (a,b) => {

                const aTime =
                    a.updatedAt &&
                    a.updatedAt.toMillis
                    ? a.updatedAt.toMillis()
                    : 0;

                const bTime =
                    b.updatedAt &&
                    b.updatedAt.toMillis
                    ? b.updatedAt.toMillis()
                    : 0;

                return bTime - aTime;

            }
        );


        records.forEach(
            request => {

                const tr =
                    document.createElement(
                        "tr"
                    );


                const status =
                    request.status || "-";


                tr.innerHTML = `

                    <td>
                        ${escapeHtml(
                            request.eventName || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            request.organisingDepartment || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            request.eventDate || "-"
                        )}
                    </td>

                    <td>

                        <span
                            class="status ${getStatusClass(
                                status
                            )}"
                        >

                            ${escapeHtml(
                                status
                            )}

                        </span>

                    </td>

                    <td>
                        ${escapeHtml(
                            request.forwardedToDepartment || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            request.deanRemarks || "-"
                        )}
                    </td>

                `;


                table.appendChild(tr);

            }
        );


    }
    catch(error){

        console.error(
            "History error:",
            error
        );


        loading.style.display =
            "none";


        table.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty"
                >
                    Unable to load history.
                </td>

            </tr>

        `;

    }

}


/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(status){

    const value =
        String(status)
        .toLowerCase();


    if(
        value.includes("forwarded")
    ){

        return "forwarded";

    }


    if(
        value.includes("approved")
    ){

        return "approved";

    }


    if(
        value.includes("rejected")
    ){

        return "rejected";

    }


    return "pending";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value ?? "")

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeAttribute(value){

    return String(value ?? "")

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        );

}


/* =====================================================
   INITIAL LOAD
===================================================== */

loadPendingRequests();

loadHistory();


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
    function(){

        loadPendingRequests();

        loadHistory();

    },
    30000
);

</script>
